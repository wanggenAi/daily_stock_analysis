name: GenGe Start V31 Industry Now

on:
  push:
    branches: [main]
    paths: [".github/workflows/genge-start-v31-industry-now.yml"]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch full V3.1 every-industry research
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 2026-08-26: rerun after canonical All-A source resolution fix.
          gh workflow run genge-v31-industry-research.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f upstream_run_id=32865436950
          sleep 8
          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow genge-v31-industry-research.yml \
            --event workflow_dispatch \
            --branch main \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          printf '%s\n' "$RUN_ID" > .github/last_v31_industry_run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/last_v31_industry_run.txt
          git commit -m "chore: record latest V3.1 industry run $RUN_ID" || true
          git push
          echo "V31_INDUSTRY_RUN_ID=$RUN_ID"