name: V3.1 PIT OOS round 6 expectation gap

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v31_pit_oos_round6_expectation_gap.py'
      - 'scripts/v31_pit_normalized_earnings_panel.py'
      - 'docs/V31_EXPECTATION_GAP_ROUND6_DRAFT.md'
      - '.github/workflows/v31-pit-oos-round6-expectation-gap.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install 'akshare>=1.12.0' 'pandas>=2.0.0,<3.0.0' 'numpy>=1.24.0' 'yfinance>=0.2.0' tabulate

      - name: Run frozen Round-6 OOS
        run: python scripts/v31_pit_oos_round6_expectation_gap.py

      - name: Persist auditable Round-6 results
        if: success()
        run: |
          rm -rf backtests/v31_pit_oos_round6_expectation_gap
          mkdir -p backtests/v31_pit_oos_round6_expectation_gap
          cp -a artifacts/v31_pit_oos_round6_expectation_gap/. backtests/v31_pit_oos_round6_expectation_gap/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/v31_pit_oos_round6_expectation_gap
          if ! git diff --cached --quiet; then
            git commit -m 'Store V3.1 Round-6 expectation-gap OOS results'
            git push
          fi

      - name: Upload Round-6 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-pit-oos-round6-expectation-gap
          path: artifacts/v31_pit_oos_round6_expectation_gap/
          if-no-files-found: warn
