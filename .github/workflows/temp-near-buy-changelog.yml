name: Temporary Near-BUY changelog insertion

on:
  push:
    branches: [docs/near-buy-changelog-20260905]
    paths:
      - ".github/workflows/temp-near-buy-changelog.yml"

permissions:
  contents: write

jobs:
  insert-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/near-buy-changelog-20260905
      - name: Insert flat Unreleased changelog entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n\n'
          entry = ('- [新功能] GenGe 候选终态后新增 observer-only Near-BUY 研究叠加层：'
                   '按 SUFFICIENT/MISSING/CONFLICTED/CONFIRMED_NEGATIVE 区分证据质量，'
                   '仅对无 Hard Gate FAIL、无 confirmed-negative 且满足研究条件的对象标记 NEAR_BUY；'
                   '提供 20%–30%（默认 25%）研究型 starter-position advisory，并支持 5/10/20/60 交易日前向收益、'
                   '基准超额、胜率、盈亏比与 60 日最大回撤评估；不改变 Canonical/Production Authority、'
                   'Formal BUY 门槛、BUY/WAIT_PRICE/REJECT 三态、UNKNOWN 非 PASS 与 no-auto-trade。\n')
          if entry not in text:
              if marker not in text:
                  raise SystemExit('Unreleased marker missing')
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changelog only
        shell: bash
        run: |
          if git diff --quiet -- docs/CHANGELOG.md; then
            echo "changelog already updated"
            exit 0
          fi
          git config user.name "wanggen"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add docs/CHANGELOG.md
          git commit -m "docs: document near-buy research overlay"
          git push origin HEAD:docs/near-buy-changelog-20260905
