name: GenGe Append Insurance Progress Locator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-append-insurance-progress-locator.yml"

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record append run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 8
          gh run list --repo "${{ github.repository }}" --workflow genge-append-insurance-progress.yml --limit 3 --json databaseId,status,conclusion,headSha,url > docs/GENGE_APPEND_INSURANCE_PROGRESS_LOCATOR.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_APPEND_INSURANCE_PROGRESS_LOCATOR.json
          git commit -m "chore: record insurance progress append run" || exit 0
          git push origin HEAD:main
