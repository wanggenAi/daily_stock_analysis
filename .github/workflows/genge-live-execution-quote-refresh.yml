name: GenGe Live Execution Quote Refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GenGe Realtime Data Package"]
    types: [completed]

concurrency:
  group: genge-live-execution-quote-consumer
  cancel-in-progress: true

jobs:
  consume:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply persisted quote snapshot without network access
        run: |
          set -euo pipefail
          test -s data/live_execution_quotes/latest.json
          python scripts/genge_apply_live_quote_snapshot.py \
            --dashboard data/investor_decision_dashboard/latest.json \
            --quotes data/live_execution_quotes/latest.json \
            --markdown INVESTOR_DECISION_DASHBOARD.md \
            --max-age-minutes 15
      - name: Verify Formal authority was not recomputed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investor_decision_dashboard/latest.json').read_text(encoding='utf-8'))
          o=p['live_execution_overlay']
          assert o['source']=='PERSISTED_LIVE_EXECUTION_QUOTE_SNAPSHOT'
          assert o['formal_action_recomputed'] is False
          assert o['formal_action_mutation_allowed'] is False
          assert p['no_auto_trade'] is True
          PY
      - name: Persist display/execution-reference overlay only
        run: |
          set -euo pipefail
          git config user.name 'genge-live-quote-consumer-bot'
          git config user.email '31836791+wanggenAi@users.noreply.github.com'
          git add -f data/investor_decision_dashboard/latest.json INVESTOR_DECISION_DASHBOARD.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply persisted live quote snapshot [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
