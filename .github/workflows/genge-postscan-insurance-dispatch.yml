name: GenGe Postscan Insurance Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-postscan-insurance-dispatch.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch canonical Postscan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genge-postscan-research.yml --repo "${{ github.repository }}" --ref main -f upstream_run_id=32099563360
          sleep 12
          gh run list --repo "${{ github.repository }}" --workflow genge-postscan-research.yml --limit 3 --json databaseId,status,conclusion,headSha,event,url > docs/GENGE_POSTSCAN_INSURANCE_DISPATCH.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_POSTSCAN_INSURANCE_DISPATCH.json
          git commit -m "chore: record canonical insurance postscan run" || exit 0
          git push origin HEAD:main
