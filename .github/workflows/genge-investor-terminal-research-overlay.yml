name: GenGe Investor Terminal Research Overlay

on:
  workflow_run:
    workflows:
      - "GenGe V3.1 Terminal Research Decision"
      - "GenGe Investor Decision Brief"
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/genge-investor-terminal-research-overlay.yml"
      - "src/strategies/genge_opportunity_discovery/investor_terminal_research_overlay.py"
      - "tests/test_investor_terminal_research_overlay.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: genge-investor-terminal-research-overlay
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract test dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Verify research-only investor overlay contract
        run: python -m pytest -q tests/test_investor_terminal_research_overlay.py

  production:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Overlay latest terminal research onto investor brief with optimistic replay
        run: |
          set -euo pipefail
          git config user.name "genge-investor-terminal-overlay-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            test -s data/deep_calculation/latest_research_decisions.json
            test -s data/investor_decision_dashboard/latest.json
            test -s INVESTOR_DECISION_DASHBOARD.md
            python -m src.strategies.genge_opportunity_discovery.investor_terminal_research_overlay \
              --dashboard-json data/investor_decision_dashboard/latest.json \
              --dashboard-md INVESTOR_DECISION_DASHBOARD.md \
              --terminal-research-json data/deep_calculation/latest_research_decisions.json
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investor_decision_dashboard/latest.json').read_text(encoding='utf-8'))
          r=p['terminal_research_snapshot']
          assert p['formal_action_source'] == 'FINALIZED_CANONICAL_ONLY'
          assert p['formal_action_recomputed'] is False
          assert p['no_auto_trade'] is True
          assert r['research_authority'] == 'RESEARCH_ONLY'
          assert r['formal_trading_authority'] is False
          assert r['automatic_formal_buy_allowed'] is False
          assert r['unknown_is_pass'] is False
          assert r['no_auto_trade'] is True
          assert r['requested_count'] == sum(r['decision_counts'].values())
          assert set(r['decision_counts']) == {'BUY','WAIT_PRICE','REJECT'}
          PY
            git add -f data/investor_decision_dashboard/latest.json
            git add INVESTOR_DECISION_DASHBOARD.md
            if git diff --cached --quiet; then
              echo "Investor brief already has current terminal research overlay."
              break
            fi
            git commit -m "Persist investor terminal research overlay [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            [ "$attempt" -lt 4 ] || exit 1
          done

      - name: Publish overlaid investor summary
        if: always()
        run: |
          if [ -f INVESTOR_DECISION_DASHBOARD.md ]; then
            cat INVESTOR_DECISION_DASHBOARD.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Investor dashboard unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload investor terminal research overlay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-investor-terminal-research-overlay-${{ github.run_id }}
          path: |
            INVESTOR_DECISION_DASHBOARD.md
            data/investor_decision_dashboard/latest.json
          if-no-files-found: error
          retention-days: 30
