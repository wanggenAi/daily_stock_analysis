name: Temporary Near-BUY evidence recovery patch

on:
  push:
    branches: [fix/near-buy-evidence-recovery-20260905]
    paths:
      - ".github/workflows/temp-near-buy-recovery-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/near-buy-evidence-recovery-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Apply recovery patch
        run: python scripts/temp_apply_near_buy_recovery.py
      - name: Verify targeted contract
        run: |
          python -m py_compile scripts/near_buy_research_overlay.py
          python -m pytest -q tests/test_genge_near_buy_research_overlay.py
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "wanggen"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add scripts/near_buy_research_overlay.py tests/test_genge_near_buy_research_overlay.py .github/workflows/genge-near-buy-research.yml docs/CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: prioritize missing Near-BUY evidence recovery"
          git push origin HEAD:fix/near-buy-evidence-recovery-20260905
