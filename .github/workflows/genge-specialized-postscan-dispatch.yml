name: GenGe Specialized Postscan Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-specialized-postscan-dispatch.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Postscan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genge-postscan-research.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f upstream_run_id=32099563360
          echo "Dispatched canonical Postscan for upstream 32099563360"
