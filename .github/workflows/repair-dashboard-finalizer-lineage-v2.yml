name: Repair dashboard Finalizer lineage pinning v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-dashboard-finalizer-lineage-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch dashboard lineage and contract test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/genge-investor-decision-dashboard.yml')
          lines = workflow_path.read_text(encoding='utf-8').splitlines()

          step = '      - name: Locate latest successful authorized Canonical'
          if lines.count(step) != 1:
              raise SystemExit(f'expected one authority step, found {lines.count(step)}')
          s = lines.index(step)
          gh_token = next(i for i in range(s, min(s + 12, len(lines))) if lines[i].strip().startswith('GH_TOKEN:'))
          if not any('EVENT_NAME:' in x for x in lines[gh_token + 1:gh_token + 5]):
              expr_open = '$' + '{{ '
              expr_close = ' }}'
              lines[gh_token + 1:gh_token + 1] = [
                  '          EVENT_NAME: ' + expr_open + 'github.event_name' + expr_close,
                  '          TRIGGER_WORKFLOW: ' + expr_open + 'github.event.workflow_run.name' + expr_close,
                  '          TRIGGER_RUN_ID: ' + expr_open + 'github.event.workflow_run.id' + expr_close,
              ]

          start_line = '          rm -rf incoming-authority; mkdir incoming-authority'
          start = lines.index(start_line, s)
          first_test = lines.index('          test -n "$selected"', start)
          old_block = lines[start:first_test + 1]
          if not any('TRIGGER_WORKFLOW' in x for x in old_block):
              replacement = [
                  '          rm -rf incoming-authority; mkdir incoming-authority',
                  '          selected=""',
                  '          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$TRIGGER_WORKFLOW" = "GenGe V3.1.1 Production Finalizer" ]; then',
                  '            selected="$TRIGGER_RUN_ID"',
                  '            test -n "$selected"',
                  '            run_json=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${selected}")',
                  '            test "$(printf \'%s\' "$run_json" | jq -r \'.conclusion // empty\')" = "success"',
                  '            test "$(printf \'%s\' "$run_json" | jq -r \'.name // empty\')" = "GenGe V3.1.1 Production Finalizer"',
                  '            artifacts=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${selected}/artifacts?per_page=100")',
                  '            test "$(printf \'%s\' "$artifacts" | jq \'[.artifacts[] | select(.expired == false and (.name | startswith("genge-v311-authoritative-canonical-")))] | length\')" -gt 0',
                  '            echo "Pinning Canonical authority to triggering Finalizer run ${selected}"',
                  '          else',
                  '            runs=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v311-production-finalizer.yml/runs?status=success&per_page=40")',
                  '            for run_id in $(printf \'%s\' "$runs" | jq -r \'.workflow_runs[] | select(.conclusion == "success") | .id\'); do',
                  '              artifacts=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")',
                  '              if [ "$(printf \'%s\' "$artifacts" | jq \'[.artifacts[] | select(.expired == false and (.name | startswith("genge-v311-authoritative-canonical-")))] | length\')" -gt 0 ]; then',
                  '                selected="$run_id"; break',
                  '              fi',
                  '            done',
                  '          fi',
                  '          test -n "$selected"',
              ]
              lines[start:first_test + 1] = replacement

          launch = '          CANONICAL="$canonical" AUTHORITY="$authority" RECONCILIATION="$reconciliation" python - <<\'PY\''
          if launch in lines:
              idx = lines.index(launch)
              lines[idx] = '          FINALIZER_RUN_ID="$selected" CANONICAL="$canonical" AUTHORITY="$authority" RECONCILIATION="$reconciliation" python - <<\'PY\''

          auth_assert = "          assert a['authorized'] is True"
          ai = lines.index(auth_assert, s)
          finalizer_assert = "          assert str(a['finalizer_run_id']) == str(os.environ['FINALIZER_RUN_ID'])"
          if finalizer_assert not in lines[ai:ai + 5]:
              lines.insert(ai + 1, finalizer_assert)

          workflow_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test_path = Path('tests/test_genge_investor_dashboard_workflow_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_finalizer_trigger_pins_dashboard_to_exact_finalizer_run() -> None:'
          if marker not in tests:
              new_test = [
                  '', '',
                  'def test_finalizer_trigger_pins_dashboard_to_exact_finalizer_run() -> None:',
                  '    workflow = _workflow()',
                  '    authority = workflow.split("- name: Locate latest successful authorized Canonical", 1)[1].split(',
                  '        "- name: Download latest usable Terminal BUY WAIT_PRICE REJECT truth", 1',
                  '    )[0]',
                  '',
                  '    assert "EVENT_NAME:" in authority',
                  '    assert "TRIGGER_WORKFLOW:" in authority',
                  '    assert "TRIGGER_RUN_ID:" in authority',
                  '    assert \'[ "$EVENT_NAME" = "workflow_run" ] && [ "$TRIGGER_WORKFLOW" = "GenGe V3.1.1 Production Finalizer" ]\' in authority',
                  '    assert \'selected="$TRIGGER_RUN_ID"\' in authority',
                  '    assert \'actions/runs/${selected}\' in authority',
                  '    assert \'FINALIZER_RUN_ID="$selected" CANONICAL="$canonical"\' in authority',
                  '    assert "assert str(a[\'finalizer_run_id\']) == str(os.environ[\'FINALIZER_RUN_ID\'])" in authority',
              ]
              test_path.write_text(tests + '\n'.join(new_test) + '\n', encoding='utf-8')
          PY

      - name: Run dashboard workflow contract tests
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q tests/test_genge_investor_dashboard_workflow_contract.py

      - name: Commit repair and remove one-shot workflows
        run: |
          set -euo pipefail
          git config user.name "genge-repair-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add .github/workflows/genge-investor-decision-dashboard.yml tests/test_genge_investor_dashboard_workflow_contract.py
          git rm -f .github/workflows/repair-dashboard-finalizer-lineage.yml .github/workflows/repair-dashboard-finalizer-lineage-v2.yml
          git commit -m "Pin investor dashboard to triggering Finalizer epoch"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Re-run Finalizer from latest authorized source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v311-production-finalizer.yml/runs?status=success&per_page=20" | jq -r '.workflow_runs[0].id // empty')
          test -n "$latest"
          rm -rf /tmp/latest-authority; mkdir -p /tmp/latest-authority
          gh run download "$latest" --repo "$GITHUB_REPOSITORY" --pattern 'genge-v311-authoritative-canonical-*' --dir /tmp/latest-authority
          authority=$(find /tmp/latest-authority -name production_authority.json -print -quit)
          test -n "$authority"
          source_run=$(jq -r '.canonical_source_run_id // empty' "$authority")
          source_workflow=$(jq -r '.source_workflow // empty' "$authority")
          test -n "$source_run"; test -n "$source_workflow"
          gh workflow run genge-v311-production-finalizer.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_run_id="$source_run" \
            -f source_workflow="$source_workflow"
          echo "Dispatched Finalizer replay from ${source_workflow} run ${source_run}"
