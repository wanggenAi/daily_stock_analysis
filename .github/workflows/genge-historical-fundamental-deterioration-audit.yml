name: GenGe Historical Fundamental Deterioration Audit

on:
  pull_request:
    paths:
      - "src/strategies/genge_opportunity_discovery/historical_fundamental_deterioration_audit.py"
      - "src/strategies/genge_opportunity_discovery/hard_logic_historical_backtest.py"
      - "tests/test_genge_historical_fundamental_deterioration_audit.py"
      - "config/genge_hard_logic_famous_cases.csv"
      - ".github/workflows/genge-historical-fundamental-deterioration-audit.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical replay start date"
        required: false
        default: "2018-01-01"
        type: string
      end_date:
        description: "Historical replay end date"
        required: false
        default: "2026-08-18"
        type: string

permissions:
  contents: read

concurrency:
  group: genge-historical-fundamental-deterioration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Validate disclosure chronology
        run: |
          python -m py_compile src/strategies/genge_opportunity_discovery/historical_fundamental_deterioration_audit.py
          python -m pytest -q tests/test_genge_historical_fundamental_deterioration_audit.py

  public-data-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Cache historical public data
        uses: actions/cache@v4
        with:
          path: data/cache/hard_logic_history_backtest
          key: hard-logic-history-v3-${{ runner.os }}-${{ hashFiles('config/genge_hard_logic_famous_cases.csv') }}
      - name: Resolve replay dates
        shell: bash
        run: |
          echo "START_DATE=${{ inputs.start_date || '2018-01-01' }}" >> "$GITHUB_ENV"
          echo "END_DATE=${{ inputs.end_date || '2026-08-18' }}" >> "$GITHUB_ENV"
      - name: Audit post-entry financial deterioration
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.historical_fundamental_deterioration_audit \
            --cases-file config/genge_hard_logic_famous_cases.csv \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --output-dir reports/historical_fundamental_deterioration_audit \
            --cache-dir data/cache/hard_logic_history_backtest \
            --evaluation-stride 5 \
            --cost-bps-per-side 15
      - name: Validate output contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path('reports/historical_fundamental_deterioration_audit')
          required = [
              root/'historical_fundamental_deterioration_audit_summary.json',
              root/'historical_fundamental_deterioration_audit.md',
              root/'fundamental_deterioration_observations.csv',
              root/'fundamental_deterioration_trade_summary.csv',
              root/'fundamental_deterioration_rule_stats.csv',
              root/'data_failures.csv',
          ]
          for path in required:
              assert path.exists() and path.stat().st_size > 0, path
          summary = json.loads((root/'historical_fundamental_deterioration_audit_summary.json').read_text(encoding='utf-8'))
          assert summary['point_in_time_disclosure_only'] is True
          assert summary['trade_outcome_not_used_to_form_warning'] is True
          assert summary['existing_sell_rule_unchanged'] is True
          assert summary['famous_case_selection_bias_warning'] is True
          assert summary['production_deployment_allowed'] is False
          assert summary['trade_count'] > 0
          assert summary['observation_count'] > 0
          stats = list(csv.DictReader((root/'fundamental_deterioration_rule_stats.csv').open(encoding='utf-8')))
          assert len(stats) >= 3
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/historical_fundamental_deterioration_audit/historical_fundamental_deterioration_audit.md ]; then
            cat reports/historical_fundamental_deterioration_audit/historical_fundamental_deterioration_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-historical-fundamental-deterioration-audit
          path: reports/historical_fundamental_deterioration_audit
          if-no-files-found: error
