name: GenGe Pipeline Maintenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/GENGE_PIPELINE_MAINTENANCE_TRIGGER.md"

permissions:
  contents: write
  actions: write

concurrency:
  group: genge-pipeline-maintenance
  cancel-in-progress: false

jobs:
  maintain-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove false-trigger paths and enable permanent progress runner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/genge-opportunity-discovery.yml')
          text = path.read_text(encoding='utf-8')
          trigger_block = '''  pull_request:\n    branches: [main]\n  push:\n    branches: [main]\n'''
          if trigger_block in text:
              text = text.replace(
                  trigger_block,
                  '  # PR/push checks live in CI/Fresh validation workflows.\n'
                  '  # Keeping production to schedule/workflow_dispatch prevents artifact-less downstream workflow_run events.\n',
                  1,
              )
          elif '  push:\n    branches: [main]\n' in text or '  pull_request:\n    branches: [main]\n' in text:
              raise SystemExit('unexpected Opportunity Discovery trigger layout; refusing unsafe patch')

          old = 'python -m src.strategies.genge_opportunity_discovery.all_a_full_scan \\\\n'
          new = 'python -m src.strategies.genge_opportunity_discovery.all_a_progress_runner \\\\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'all_a_progress_runner' not in text:
              raise SystemExit('could not locate All-A production command')
          path.write_text(text, encoding='utf-8')

          obsolete = [
              '.github/workflows/genge-valuation-research.yml',
              '.github/workflows/genge-industry-coverage.yml',
              '.github/workflows/genge-long-term-second-pass.yml',
              '.github/workflows/genge-zero-buy-audit.yml',
              '.github/workflows/genge-postscan-dispatch-locator.yml',
              '.github/workflows/genge-postscan-force-dispatch.yml',
              '.github/workflows/genge-fresh-production-validation.yml',
              'docs/GENGE_POSTSCAN_DISPATCH_TRIGGER.md',
              'docs/GENGE_POSTSCAN_FORCE_TRIGGER.md',
          ]
          for name in obsolete:
              p = Path(name)
              if p.exists():
                  p.unlink()
                  print(f'removed={name}')
          PY

      - name: Verify maintenance patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/genge-opportunity-discovery.yml').read_text(encoding='utf-8')
          on_block = text.split('permissions:', 1)[0]
          assert '  push:\n' not in on_block
          assert '  pull_request:\n' not in on_block
          assert 'workflow_dispatch:' in on_block
          assert 'schedule:' in on_block
          assert 'python -m src.strategies.genge_opportunity_discovery.all_a_progress_runner' in text
          assert 'python -m src.strategies.genge_opportunity_discovery.all_a_full_scan \\\\n' not in text
          for name in (
              'genge-valuation-research.yml', 'genge-industry-coverage.yml',
              'genge-long-term-second-pass.yml', 'genge-zero-buy-audit.yml',
          ):
              assert not (Path('.github/workflows') / name).exists(), name
          print('maintenance_patch=validated')
          PY

      - name: Commit production-chain cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: canonicalize GenGe production trigger chain [skip ci]"
            git push origin HEAD:main
          fi

      - name: Dispatch canonical Postscan against successful Fresh All-A
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: "32090231706"
        run: |
          set -euo pipefail
          before=$(gh run list --repo "$REPO" --workflow genge-postscan-research.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run genge-postscan-research.yml --repo "$REPO" --ref main -f upstream_run_id="$UPSTREAM_RUN_ID"
          run_id=""
          for _ in $(seq 1 20); do
            sleep 5
            candidate=$(gh run list --repo "$REPO" --workflow genge-postscan-research.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$candidate" != "0" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "failed to locate newly dispatched Postscan run" >&2
            exit 1
          fi
          echo "POSTSCAN_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "canonical_postscan_run_id=$run_id"

      - name: Persist Postscan started status
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_json=$(gh run view "$POSTSCAN_RUN_ID" --repo "$REPO" --json status,conclusion,event,createdAt,url,headSha)
          python - "$run_json" <<'PY'
          import json, sys
          from pathlib import Path
          d = json.loads(sys.argv[1])
          Path('docs/GENGE_POSTSCAN_RUNTIME_STATUS.md').write_text(
              '# GenGe Postscan Runtime Status\n\n'
              f"upstream_run_id: 32090231706\npostscan_run_id: {d.get('databaseId','')}\n"
              f"status: {d.get('status','')}\nconclusion: {d.get('conclusion','')}\n"
              f"event: {d.get('event','')}\ncreated_at_utc: {d.get('createdAt','')}\n"
              f"head_sha: {d.get('headSha','')}\nurl: {d.get('url','')}\n"
              'canonical_workflow: .github/workflows/genge-postscan-research.yml\n\n'
              'Fresh All-A upstream run 32090231706 succeeded with artifact 9308603602. '
              'This canonical Postscan must produce industry coverage, long-term second pass, '
              'valuation_research_routed.csv, long-term final decision and Zero-BUY audit.\n',
              encoding='utf-8')
          PY
          sed -i "s/postscan_run_id: $/postscan_run_id: ${POSTSCAN_RUN_ID}/" docs/GENGE_POSTSCAN_RUNTIME_STATUS.md
          git add docs/GENGE_POSTSCAN_RUNTIME_STATUS.md
          git commit -m "docs: record canonical Postscan run ${POSTSCAN_RUN_ID} [skip ci]" || true
          git push origin HEAD:main

      - name: Wait for canonical Postscan terminal state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          gh run watch "$POSTSCAN_RUN_ID" --repo "$REPO" --exit-status --interval 15
          echo "POSTSCAN_WATCH_RC=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Persist Postscan terminal status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          status=$(gh run view "$POSTSCAN_RUN_ID" --repo "$REPO" --json status --jq '.status')
          conclusion=$(gh run view "$POSTSCAN_RUN_ID" --repo "$REPO" --json conclusion --jq '.conclusion // ""')
          event=$(gh run view "$POSTSCAN_RUN_ID" --repo "$REPO" --json event --jq '.event')
          created=$(gh run view "$POSTSCAN_RUN_ID" --repo "$REPO" --json createdAt --jq '.createdAt')
          url=$(gh run view "$POSTSCAN_RUN_ID" --repo "$REPO" --json url --jq '.url')
          head=$(gh run view "$POSTSCAN_RUN_ID" --repo "$REPO" --json headSha --jq '.headSha')
          artifacts=$(gh api "repos/${REPO}/actions/runs/${POSTSCAN_RUN_ID}/artifacts" --jq '.artifacts[] | "- artifact: \(.name) | id=\(.id) | size=\(.size_in_bytes)"' || true)
          cat > docs/GENGE_POSTSCAN_RUNTIME_STATUS.md <<EOF
          # GenGe Postscan Runtime Status

          upstream_run_id: 32090231706
          postscan_run_id: ${POSTSCAN_RUN_ID}
          status: ${status}
          conclusion: ${conclusion}
          event: ${event}
          created_at_utc: ${created}
          head_sha: ${head}
          url: ${url}
          canonical_workflow: .github/workflows/genge-postscan-research.yml

          ## Artifacts
          ${artifacts:-No artifacts produced.}

          Fresh upstream artifact: genge-all-a-production-report / id 9308603602.
          Required terminal outputs: industry coverage, long-term second pass, valuation_research_routed.csv, long-term final decision and Zero-BUY audit.
          EOF
          git add docs/GENGE_POSTSCAN_RUNTIME_STATUS.md
          git commit -m "docs: persist canonical Postscan ${conclusion} run ${POSTSCAN_RUN_ID} [skip ci]" || true
          git push origin HEAD:main
          if [ "$conclusion" != "success" ]; then
            exit 1
          fi
