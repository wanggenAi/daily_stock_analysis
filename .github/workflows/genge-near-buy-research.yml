name: GenGe Near-BUY Research Overlay

on:
  push:
    branches: [main]
    paths:
      - "scripts/near_buy_research_overlay.py"
      - "tests/test_genge_near_buy_research_overlay.py"
      - ".github/workflows/genge-near-buy-research.yml"
  pull_request:
    paths:
      - "scripts/near_buy_research_overlay.py"
      - "tests/test_genge_near_buy_research_overlay.py"
      - ".github/workflows/genge-near-buy-research.yml"
  workflow_run:
    workflows:
      - "GenGe Candidate Terminal Review"
      - "GenGe Candidate Terminal Auto Repair"
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed Candidate Terminal or Auto-Repair run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-near-buy-${{ github.event.workflow_run.id || inputs.upstream_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Compile observer overlay
        run: python -m py_compile scripts/near_buy_research_overlay.py
      - name: Run Near-BUY contract tests
        run: python -m pytest -q tests/test_genge_near_buy_research_overlay.py tests/test_genge_near_buy_workflow_contract.py

  build-overlay:
    needs: contract-tests
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve successful terminal artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          preferred=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            preferred="${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            preferred="${{ inputs.upstream_run_id }}"
          fi

          candidates=()
          if [[ "$preferred" =~ ^[0-9]+$ ]]; then candidates+=("$preferred"); fi

          mapfile -t terminal_runs < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-candidate-terminal-review.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[].id'
          )
          mapfile -t repair_runs < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-candidate-terminal-auto-repair.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[].id'
          )
          for candidate in "${terminal_runs[@]}" "${repair_runs[@]}"; do
            if [[ "$candidate" =~ ^[0-9]+$ ]] && [[ " ${candidates[*]} " != *" $candidate "* ]]; then
              candidates+=("$candidate")
            fi
          done

          upstream=""
          artifact_name=""
          for candidate in "${candidates[@]}"; do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}")
            [ "$(printf '%s' "$run_json" | jq -r '.conclusion // ""')" = "success" ] || continue
            [ "$(printf '%s' "$run_json" | jq -r '.head_branch // ""')" = "main" ] || continue
            run_path=$(printf '%s' "$run_json" | jq -r '.path // ""')
            case "$run_path" in
              .github/workflows/genge-candidate-terminal-review.yml)
                expected_artifact="genge-candidate-terminal-decisions"
                ;;
              .github/workflows/genge-candidate-terminal-auto-repair.yml)
                expected_artifact="genge-candidate-terminal-decisions-auto-repair"
                ;;
              *)
                continue
                ;;
            esac
            artifacts_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100")
            artifact_id=$(printf '%s' "$artifacts_json" | \
              jq -r --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty')
            if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
              upstream="$candidate"
              artifact_name="$expected_artifact"
              echo "selected terminal source run $candidate path=$run_path artifact=$expected_artifact id=$artifact_id"
              break
            fi
          done

          [[ "$upstream" =~ ^[0-9]+$ ]] || {
            echo "no successful main Candidate Terminal/Auto-Repair run has a usable terminal artifact" >&2
            exit 1
          }
          echo "UPSTREAM_RUN_ID=$upstream" >> "$GITHUB_ENV"
          echo "UPSTREAM_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Download terminal decisions
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.UPSTREAM_ARTIFACT_NAME }}
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}

      - name: Build observer-only Near-BUY overlay
        shell: bash
        run: |
          set -euo pipefail
          terminal="$(find upstream -type f -name candidate_terminal_decisions.csv -print -quit)"
          [ -n "$terminal" ] || { echo "candidate_terminal_decisions.csv missing" >&2; exit 1; }
          python scripts/near_buy_research_overlay.py \
            --terminal-csv "$terminal" \
            --output-dir reports/near_buy_research

      - name: Validate authority invariants
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('reports/near_buy_research')
          summary = json.loads((root/'near_buy_research_summary.json').read_text(encoding='utf-8'))
          rows = list(csv.DictReader((root/'near_buy_research_overlay.csv').open(encoding='utf-8')))
          assert summary['candidate_count'] == len(rows)
          assert summary['formal_action_unchanged'] is True
          assert summary['canonical_authority_unchanged'] is True
          assert summary['hard_gate_failure_can_be_near_buy'] is False
          assert summary['confirmed_negative_can_be_near_buy'] is False
          assert summary['evidence_recovery_starter_allowed'] is False
          assert summary['unknown_evidence_is_pass'] is False
          assert summary['evidence_recovery_is_formal_signal'] is False
          assert summary['automatic_promotion_allowed'] is False
          assert summary['no_auto_trade'] is True
          assert all(row['formal_action_unchanged'] == 'True' for row in rows)
          assert all(row['canonical_authority_unchanged'] == 'True' for row in rows)
          assert all(row['automatic_promotion_allowed'] == 'False' for row in rows)
          assert all(row['no_auto_trade'] == 'True' for row in rows)
          assert all(not row['confirmed_negative_items'] for row in rows if row['research_opportunity_state'] == 'NEAR_BUY')
          assert all(row['starter_position_advisory_allowed'] == 'False' for row in rows if row['research_opportunity_state'] == 'EVIDENCE_RECOVERY_PRIORITY')
          assert all(row['evidence_recovery_starter_allowed'] == 'False' for row in rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publish Near-BUY summary
        if: always()
        run: |
          if [ -f reports/near_buy_research/near_buy_research_overlay.md ]; then
            cat reports/near_buy_research/near_buy_research_overlay.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Near-BUY research artifact
        uses: actions/upload-artifact@v4
        with:
          name: genge-near-buy-research-${{ env.UPSTREAM_RUN_ID }}
          path: reports/near_buy_research
          if-no-files-found: error
          retention-days: 30
