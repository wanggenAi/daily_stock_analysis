name: GenGe Postscan Run Locator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-postscan-run-locator.yml"

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record latest canonical Postscan dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow genge-postscan-research.yml \
            --event workflow_dispatch \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url \
            > docs/GENGE_POSTSCAN_RUN_LOCATOR.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_POSTSCAN_RUN_LOCATOR.json
          git commit -m "chore: record canonical postscan validation run" || exit 0
          git push origin HEAD:main
