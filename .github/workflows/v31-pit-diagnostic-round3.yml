name: V3.1 PIT diagnostic round 3

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v31_pit_diagnose_round3.py'
      - '.github/workflows/v31-pit-diagnostic-round3.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check whether round-3 diagnosis already finished
        id: existing
        shell: bash
        run: |
          if [ -f backtests/v31_pit_diagnostic_round3/diagnostic_summary.csv ]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
            echo 'Round-3 diagnosis already persisted; skipping recomputation.'
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.done != 'true'
        with:
          python-version: '3.11'

      - name: Install diagnostic runtime
        if: steps.existing.outputs.done != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install 'akshare>=1.12.0' 'pandas>=2.0.0' 'numpy>=1.24.0' tabulate

      - name: Run locked round-3 diagnosis
        if: steps.existing.outputs.done != 'true'
        run: python scripts/v31_pit_diagnose_round3.py

      - name: Persist auditable diagnostic results
        if: steps.existing.outputs.done != 'true' && success()
        run: |
          rm -rf backtests/v31_pit_diagnostic_round3
          mkdir -p backtests/v31_pit_diagnostic_round3
          cp -a artifacts/v31_pit_diagnostic_round3/. backtests/v31_pit_diagnostic_round3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/v31_pit_diagnostic_round3
          if ! git diff --cached --quiet; then
            git commit -m 'Store V3.1 round-3 diagnostic results'
            git push
          fi

      - name: Upload diagnostic artifacts
        if: steps.existing.outputs.done != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-pit-diagnostic-round3
          path: artifacts/v31_pit_diagnostic_round3/
          if-no-files-found: warn
