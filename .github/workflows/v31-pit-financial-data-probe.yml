name: V3.1 PIT financial data probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v31_pit_financial_data_probe.py'
      - '.github/workflows/v31-pit-financial-data-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install probe runtime
        run: |
          python -m pip install --upgrade pip
          pip install 'akshare>=1.12.0' 'pandas>=2.0.0' tabulate

      - name: Probe historical statement availability metadata
        run: python scripts/v31_pit_financial_data_probe.py

      - name: Persist probe evidence
        if: success()
        run: |
          rm -rf backtests/v31_pit_financial_probe
          mkdir -p backtests/v31_pit_financial_probe
          cp -a artifacts/v31_pit_financial_probe/. backtests/v31_pit_financial_probe/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/v31_pit_financial_probe
          if ! git diff --cached --quiet; then
            git commit -m 'Store V3.1 PIT financial data probe'
            git push
          fi

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-pit-financial-data-probe
          path: artifacts/v31_pit_financial_probe/
          if-no-files-found: warn
