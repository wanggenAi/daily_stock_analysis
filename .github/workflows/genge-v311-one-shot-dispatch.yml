name: GenGe V3.1.1 One-Shot Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-v311-one-shot-dispatch.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch repaired authoritative Every-Industry run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v31-industry-research.yml/dispatches" \
            -f ref=main \
            -f 'inputs[upstream_run_id]=33080408700'
          echo "Dispatched repaired Every-Industry with upstream_run_id=33080408700"
