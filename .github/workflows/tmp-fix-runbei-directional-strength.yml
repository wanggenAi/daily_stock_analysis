name: Temporary Runbei Directional Strength Fix

on:
  push:
    branches: [fix/runbei-directional-strength-20260911]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runbei-directional-strength-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch directional success-archetype scoring
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('src/strategies/genge_opportunity_discovery/success_archetype_recall.py')
          text = source.read_text(encoding='utf-8')
          old = '''def _points(row: Mapping[str, Any], feature: Mapping[str, Any]) -> tuple[float, bool, str]:
              aliases = feature.get("aliases") or [feature["id"]]
              field = next((a for a in aliases if row.get(a) not in (None, "")), None)
              if field is None:
                  return 0.0, False, ""
              value = _float(row.get(field))
              ref = _float(feature.get("reference_value"))
              tol = _float(feature.get("tolerance"))
              if value is None or ref is None or tol is None or tol <= 0:
                  return 0.0, False, ""
              similarity = max(0.0, 1.0 - abs(value - ref) / tol)
              return float(feature["weight"]) * similarity, True, field
          '''
          # Normalize indentation because the literal above is nested in this workflow script.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''def _points(row: Mapping[str, Any], feature: Mapping[str, Any]) -> tuple[float, bool, str]:
              aliases = feature.get("aliases") or [feature["id"]]
              field = next((a for a in aliases if row.get(a) not in (None, "")), None)
              if field is None:
                  return 0.0, False, ""
              value = _float(row.get(field))
              ref = _float(feature.get("reference_value"))
              tol = _float(feature.get("tolerance"))
              if value is None or ref is None or tol is None or tol <= 0:
                  return 0.0, False, ""
              mode = _text(feature.get("mode") or "proximity").lower()
              if mode == "proximity":
                  similarity = max(0.0, 1.0 - abs(value - ref) / tol)
              elif mode == "at_least":
                  # Directional strength feature: matching or exceeding the frozen
                  # success reference earns full credit. Only shortfall is penalized.
                  # This prevents stronger profit/cash-flow growth from looking
                  # *less* Runbei-like merely because it overshoots the exemplar.
                  similarity = 1.0 if value >= ref else max(0.0, 1.0 - (ref - value) / tol)
              else:
                  raise ValueError(f"unsupported success-archetype feature mode: {mode}")
              return float(feature["weight"]) * similarity, True, field
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('expected _points block not found')
          text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')

          archetype_path = Path('data/research_archetypes/runbei_v1.json')
          archetype = json.loads(archetype_path.read_text(encoding='utf-8'))
          directional = {
              'earnings_quality_score',
              'net_profit_yoy_pct',
              'recurring_profit_yoy_pct',
              'operating_cash_flow_yoy_pct',
          }
          for feature in archetype['features']:
              feature['mode'] = 'at_least' if feature['id'] in directional else 'proximity'
          notes = archetype['reference'].setdefault('source_notes', [])
          note = 'Directional strength metrics use at_least scoring: exceeding the frozen Runbei reference is not penalized; cash conversion remains symmetric proximity to avoid rewarding transient working-capital spikes.'
          if note not in notes:
              notes.append(note)
          archetype_path.write_text(json.dumps(archetype, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          tests = Path('tests/test_genge_success_archetype_recall.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '{"id": "earnings_quality_score", "weight": 20, "reference_value": 90, "tolerance": 25, "aliases": ["earnings_quality_score"]},',
              '{"id": "earnings_quality_score", "weight": 20, "mode": "at_least", "reference_value": 90, "tolerance": 25, "aliases": ["earnings_quality_score"]},'
          ).replace(
              '{"id": "cash_conversion_ratio", "weight": 15, "reference_value": 1.0721, "tolerance": 1.5, "aliases": ["cash_conversion_ratio"]},',
              '{"id": "cash_conversion_ratio", "weight": 15, "mode": "proximity", "reference_value": 1.0721, "tolerance": 1.5, "aliases": ["cash_conversion_ratio"]},'
          ).replace(
              '{"id": "net_profit_yoy_pct", "weight": 25, "reference_value": 44.82, "tolerance": 60, "aliases": ["net_profit_yoy_pct"]},',
              '{"id": "net_profit_yoy_pct", "weight": 25, "mode": "at_least", "reference_value": 44.82, "tolerance": 60, "aliases": ["net_profit_yoy_pct"]},'
          ).replace(
              '{"id": "recurring_profit_yoy_pct", "weight": 25, "reference_value": 45.14, "tolerance": 60, "aliases": ["recurring_profit_yoy_pct"]},',
              '{"id": "recurring_profit_yoy_pct", "weight": 25, "mode": "at_least", "reference_value": 45.14, "tolerance": 60, "aliases": ["recurring_profit_yoy_pct"]},'
          ).replace(
              '{"id": "operating_cash_flow_yoy_pct", "weight": 15, "reference_value": 26.52, "tolerance": 80, "aliases": ["operating_cash_flow_yoy_pct"]},',
              '{"id": "operating_cash_flow_yoy_pct", "weight": 15, "mode": "at_least", "reference_value": 26.52, "tolerance": 80, "aliases": ["operating_cash_flow_yoy_pct"]},'
          )
          extra = r'''

          def test_directional_strength_does_not_penalize_growth_above_runbei_reference():
              scored = score_row(
                  _row(
                      earnings_quality_score=95,
                      cash_conversion_ratio=1.0721,
                      net_profit_yoy_pct=80,
                      recurring_profit_yoy_pct=100,
                      operating_cash_flow_yoy_pct=260,
                  ),
                  _archetype(),
              )
              assert scored["success_archetype_similarity_score"] == 100.0
              assert scored["success_archetype_state"] == "ARCHETYPE_MATCH"


          def test_taihua_like_growth_profile_is_recalled_instead_of_penalized_for_overshoot():
              scored = score_row(
                  _row(
                      code="603055",
                      stock_name="台华新材",
                      earnings_quality_score=90,
                      cash_conversion_ratio=2.7,
                      net_profit_yoy_pct=17.96,
                      recurring_profit_yoy_pct=73.29,
                      operating_cash_flow_yoy_pct=267.76,
                      quant_status="PRIORITY_RESEARCH",
                  ),
                  _archetype(),
              )
              assert scored["success_archetype_evidence_coverage"] == 1.0
              assert scored["success_archetype_similarity_score"] >= 70.0
              assert scored["success_archetype_state"] == "ARCHETYPE_MATCH"


          def test_symmetric_cash_conversion_still_penalizes_extreme_working_capital_spike():
              scored = score_row(
                  _row(
                      cash_conversion_ratio=5.0,
                      net_profit_yoy_pct=44.82,
                      recurring_profit_yoy_pct=45.14,
                      operating_cash_flow_yoy_pct=26.52,
                  ),
                  _archetype(),
              )
              details = json.loads(scored["success_archetype_feature_scores_json"])
              assert details["cash_conversion_ratio"] == 0.0
          '''
          extra = '\n'.join(line[10:] if line.startswith('          ') else line for line in extra.splitlines())
          if 'test_taihua_like_growth_profile_is_recalled_instead_of_penalized_for_overshoot' not in test_text:
              test_text += extra + '\n'
          if 'import json\n' not in test_text.split('\n', 5)[:5]:
              test_text = 'import json\n' + test_text
          tests.write_text(test_text, encoding='utf-8')
          PY
      - name: Run focused tests
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m pytest -q tests/test_genge_success_archetype_recall.py tests/test_genge_research_priority_archetype.py tests/test_runbei_archetype_deep_handoff.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "genge-runbei-fix-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add src/strategies/genge_opportunity_discovery/success_archetype_recall.py data/research_archetypes/runbei_v1.json tests/test_genge_success_archetype_recall.py
          git commit -m "fix: stop penalizing stronger Runbei archetype growth"
          git push origin HEAD:fix/runbei-directional-strength-20260911
