name: GenGe V3.1.1 Hourly Deep Overlay

on:
  schedule:
    # Beijing 09:05-16:05 on weekdays (UTC 01:05-08:05).
    - cron: "5 1-8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: genge-v311-hourly-deep-overlay
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  persist-hourly-deep-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate latest successful authoritative Finalizer artifact
        id: authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          runs=$(gh api -X GET "repos/${repo}/actions/workflows/genge-v311-production-finalizer.yml/runs?status=success&per_page=30")
          run_ids=$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.conclusion == "success") | .id')
          found=""
          for run_id in $run_ids; do
            artifacts=$(gh api -X GET "repos/${repo}/actions/runs/${run_id}/artifacts?per_page=100")
            row=$(printf '%s' "$artifacts" | jq -r '.artifacts[] | select(.expired == false and (.name | startswith("genge-v311-authoritative-canonical-"))) | [.id,.name] | @tsv' | head -n1)
            if [ -n "$row" ]; then
              artifact_id=$(printf '%s' "$row" | cut -f1)
              artifact_name=$(printf '%s' "$row" | cut -f2)
              found=1
              echo "finalizer_run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
              echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "No successful non-expired authoritative canonical artifact found" >&2
            exit 1
          fi

      - name: Download exact authoritative canonical artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > authoritative.zip
          unzip -q authoritative.zip -d incoming
          test -f incoming/authoritative/production_authority.json
          test -f incoming/authoritative/canonical_snapshot/latest.json
          test -f incoming/authoritative/operating_views/hourly.json
          test -f incoming/authoritative/holdings_reconciliation.json
          test -f incoming/authoritative/candidate_lifecycle/candidate_lifecycle_state.json
          test -f incoming/authoritative/candidate_lifecycle/summary.json

      - name: Run hourly overlay and evidence contract tests
        run: |
          python -m pytest -q \
            tests/test_genge_hourly_deep_overlay.py \
            tests/test_genge_evidence_event_store.py \
            tests/test_genge_hourly_research_state.py \
            tests/test_genge_industry_cycle_evidence_bridge.py \
            tests/test_genge_commodity_price_evidence_collector.py \
            tests/test_genge_research_mapping_coverage.py

      - name: Build price/value hourly deep overlay
        run: |
          python -m src.strategies.genge_opportunity_discovery.hourly_deep_overlay \
            --authoritative-root incoming/authoritative \
            --output-root data/hourly_deep_overlay

      - name: Build reviewed research mapping coverage
        run: |
          python -m src.strategies.genge_opportunity_discovery.research_mapping_coverage \
            --coverage-output data/research_mapping/coverage.json \
            --industry-csv-output data/research_mapping/company_industry_map.csv

      - name: Collect public company announcement evidence
        continue-on-error: true
        run: |
          python -m src.strategies.genge_opportunity_discovery.hourly_evidence_collector \
            --hourly-overlay data/hourly_deep_overlay/latest.json \
            --evidence-root data/evidence_events \
            --status-output data/evidence_events/collector_status.json \
            --lookback-hours 72

      - name: Bridge audited industry supply-demand evidence
        run: |
          python -m src.strategies.genge_opportunity_discovery.industry_cycle_evidence_bridge \
            --hourly-overlay data/hourly_deep_overlay/latest.json \
            --industry-evidence data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence data/research_mapping/company_industry_map.csv \
            --evidence-root data/evidence_events \
            --status-output data/evidence_events/industry_collector_status.json

      - name: Collect public commodity benchmark evidence
        continue-on-error: true
        run: |
          python -m src.strategies.genge_opportunity_discovery.commodity_price_evidence_collector \
            --hourly-overlay data/hourly_deep_overlay/latest.json \
            --config config/commodity_research_benchmarks.json \
            --evidence-root data/evidence_events \
            --status-output data/evidence_events/commodity_collector_status.json

      - name: Build evidence source coverage registry
        run: |
          python -m src.strategies.genge_opportunity_discovery.evidence_source_registry \
            --evidence-root data/evidence_events \
            --collector-status data/evidence_events/collector_status.json \
            --industry-status data/evidence_events/industry_collector_status.json \
            --commodity-status data/evidence_events/commodity_collector_status.json \
            --policy-status data/evidence_events/policy_collector_status.json \
            --competition-status data/evidence_events/competition_collector_status.json \
            --output data/evidence_events/source_registry.json

      - name: Build evidence-aware hourly research state
        run: |
          python -m src.strategies.genge_opportunity_discovery.hourly_research_state \
            --price-overlay data/hourly_deep_overlay/latest.json \
            --price-history-root data/hourly_deep_overlay \
            --evidence-root data/evidence_events \
            --output-root data/hourly_research_state

      - name: Validate overlays remain research-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          price = json.loads(Path('data/hourly_deep_overlay/latest.json').read_text(encoding='utf-8'))
          research = json.loads(Path('data/hourly_research_state/latest.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('data/evidence_events/source_registry.json').read_text(encoding='utf-8'))
          coverage = json.loads(Path('data/research_mapping/coverage.json').read_text(encoding='utf-8'))
          assert price['formal_action_source'] == 'FINALIZED_CANONICAL_ONLY'
          assert price['formal_action_recomputed'] is False
          assert price['overlay_may_overwrite_formal_action'] is False
          assert price['price_overlay_is_formal_buy'] is False
          assert price['tradeable_scope'] == 'SHANGHAI_SHENZHEN_MAINBOARD_ONLY'
          assert research['formal_action_source'] == 'FINALIZED_CANONICAL_ONLY'
          assert research['formal_action_recomputed'] is False
          assert research['overlay_may_overwrite_formal_action'] is False
          assert research['evidence_may_overwrite_formal_action'] is False
          assert research['no_auto_trade'] is True
          assert registry['formal_action_eligible'] is False
          assert registry['coverage_semantics'] == 'CONNECTED_DOES_NOT_IMPLY_FRESH_OR_MAPPED'
          assert coverage['formal_action_eligible'] is False
          assert coverage['mapping_policy'] == 'MISSING_MAPPING_IS_A_VISIBLE_RESEARCH_GAP_NOT_A_GUESS'
          assert research['canonical_snapshot_id'] == price['canonical_snapshot_id']
          assert research['canonical_source_run_id'] == price['canonical_source_run_id']
          PY

      - name: Upload hourly research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-hourly-deep-overlay-${{ github.run_id }}
          path: |
            data/hourly_deep_overlay
            data/evidence_events
            data/hourly_research_state
            data/research_mapping
          if-no-files-found: error
          retention-days: 30

      - name: Persist hourly research history to main
        run: |
          set -euo pipefail
          git config user.name "genge-v311-hourly-overlay-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add data/hourly_deep_overlay data/evidence_events data/hourly_research_state data/research_mapping
          if git diff --cached --quiet; then
            echo "No hourly research state change to persist"
            exit 0
          fi
          sid=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('data/hourly_deep_overlay/latest.json').read_text(encoding='utf-8'))['canonical_snapshot_id'])
          PY
          )
          git commit -m "Persist V3.1.1 hourly research state ${sid} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish summary
        if: always()
        run: |
          echo "# GenGe V3.1.1 Hourly Deep Overlay" >> "$GITHUB_STEP_SUMMARY"
          echo "- finalizer run: ${{ steps.authority.outputs.finalizer_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- authoritative artifact: ${{ steps.authority.outputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Formal actions are read-only and come only from finalized canonical" >> "$GITHUB_STEP_SUMMARY"
          echo "- reviewed mapping coverage exposes unmapped holdings/candidates instead of guessing" >> "$GITHUB_STEP_SUMMARY"
          echo "- price/value history, company announcements, industry-cycle evidence, and commodity benchmarks are research overlays" >> "$GITHUB_STEP_SUMMARY"
          echo "- evidence may raise research/re-underwrite priority but cannot overwrite Formal actions" >> "$GITHUB_STEP_SUMMARY"
          echo "- tradeable scope: Shanghai/Shenzhen main boards only" >> "$GITHUB_STEP_SUMMARY"
