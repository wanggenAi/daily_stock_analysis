name: Repair V31 Predictability Parent Scope V2 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-v31-predictability-parent-scope-v2-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Apply minimal parent-company statement scope fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/strategies/genge_opportunity_discovery/evidence_collectors/multi_year_predictability.py')
          text = source_path.read_text(encoding='utf-8')
          helper_marker = '\n\ndef _nearby_header_unit('
          helper = '\n'.join([
              '',
              '_FINANCIAL_STATEMENT_SCOPE_RE = re.compile(',
              '    r"(?P<parent>母\\s*公\\s*司\\s*(?:利\\s*润\\s*表|现\\s*金\\s*流\\s*量\\s*表))|"',
              '    r"(?P<consolidated>合\\s*并\\s*(?:利\\s*润\\s*表|现\\s*金\\s*流\\s*量\\s*表))"',
              ')',
              '_PARENT_STATEMENT_LOOKBACK = 900',
              '',
              '',
              'def _metric_context_is_parent_company_statement(text: str, label_start: int) -> bool:',
              '    """Reject explicitly parent-company-only statement rows as consolidated evidence."""',
              '    before = text[max(0, label_start - _PARENT_STATEMENT_LOOKBACK):label_start]',
              '    matches = list(_FINANCIAL_STATEMENT_SCOPE_RE.finditer(before))',
              '    return bool(matches and matches[-1].group("parent"))',
          ])
          if '_metric_context_is_parent_company_statement' not in text:
              if helper_marker not in text:
                  raise SystemExit('helper insertion marker missing; refusing unsafe rewrite')
              text = text.replace(helper_marker, '\n' + helper + helper_marker, 1)

          old = '\n'.join([
              '            if _metric_context_is_quarterly(normalized, label_match.start()):',
              '                reasons.append("QUARTERLY_METRIC_NOT_ANNUAL")',
              '                continue',
              '            if _metric_context_is_scoped(normalized, label_match.start(), label_match.end()):',
          ])
          new = '\n'.join([
              '            if _metric_context_is_quarterly(normalized, label_match.start()):',
              '                reasons.append("QUARTERLY_METRIC_NOT_ANNUAL")',
              '                continue',
              '            if _metric_context_is_parent_company_statement(normalized, label_match.start()):',
              '                reasons.append("PARENT_COMPANY_STATEMENT_NOT_CONSOLIDATED")',
              '                continue',
              '            if _metric_context_is_scoped(normalized, label_match.start(), label_match.end()):',
          ])
          if 'PARENT_COMPANY_STATEMENT_NOT_CONSOLIDATED' not in text:
              if old not in text:
                  raise SystemExit('metric-scope insertion marker missing; refusing unsafe rewrite')
              text = text.replace(old, new, 1)
          source_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_v31_multi_year_predictability.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'test_parent_company_statement_rows_cannot_conflict_with_consolidated_metrics' not in tests:
              addition = '\n'.join([
                  '',
                  '',
                  'def test_parent_company_statement_rows_cannot_conflict_with_consolidated_metrics():',
                  '    text = """',
                  '    七、近三年主要会计数据和财务指标',
                  '    单位：元',
                  '    2025年 2024年',
                  '    营业收入 6,000.00 5,000.00',
                  '    归属于上市公司股东的净利润 800.00 700.00',
                  '    经营活动产生的现金流量净额 1,200.00 1,100.00',
                  '',
                  '    合并利润表',
                  '    单位：元',
                  '    2025年度 2024年度',
                  '    营业收入 6,000.00 5,000.00',
                  '',
                  '    母公司利润表',
                  '    单位：元',
                  '    2025年度 2024年度',
                  '    营业收入 600.00 500.00',
                  '',
                  '    合并现金流量表',
                  '    单位：元',
                  '    2025年度 2024年度',
                  '    经营活动产生的现金流量净额 1,200.00 1,100.00',
                  '',
                  '    母公司现金流量表',
                  '    单位：元',
                  '    2025年度 2024年度',
                  '    经营活动产生的现金流量净额 120.00 110.00',
                  '    """',
                  '    metrics = extract_report_metrics(text, 2025)',
                  '    assert metrics["revenue"] == 6000.0',
                  '    assert metrics["net_profit"] == 800.0',
                  '    assert metrics["operating_cash_flow"] == 1200.0',
                  '    assert metrics["metric_provenance"]["revenue"]["verified"] is True',
                  '    assert metrics["metric_provenance"]["operating_cash_flow"]["verified"] is True',
                  '',
                  '',
                  'def test_parent_company_only_statement_cannot_supply_consolidated_metric_evidence():',
                  '    text = """',
                  '    母公司利润表',
                  '    单位：元',
                  '    2025年度 2024年度',
                  '    营业收入 600.00 500.00',
                  '',
                  '    母公司现金流量表',
                  '    单位：元',
                  '    2025年度 2024年度',
                  '    经营活动产生的现金流量净额 120.00 110.00',
                  '    """',
                  '    metrics = extract_report_metrics(text, 2025)',
                  '    for metric in ("revenue", "operating_cash_flow"):',
                  '        assert metrics[metric] is None',
                  '        provenance = metrics["metric_provenance"][metric]',
                  '        assert provenance["verified"] is False',
                  '        assert provenance["reason"] == "PARENT_COMPANY_STATEMENT_NOT_CONSOLIDATED"',
                  '',
              ])
              tests += addition
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m py_compile src/strategies/genge_opportunity_discovery/evidence_collectors/multi_year_predictability.py tests/test_v31_multi_year_predictability.py
          git diff --check
          git diff -- src/strategies/genge_opportunity_discovery/evidence_collectors/multi_year_predictability.py tests/test_v31_multi_year_predictability.py

      - name: Run focused regression suite
        run: |
          python -m pytest -q \
            tests/test_v31_multi_year_predictability.py \
            tests/test_v31_company_announcement_fallback.py \
            tests/test_v31_deep_gap_closure.py

      - name: Commit repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-v31-predictability-parent-scope-once.yml
          git rm .github/workflows/repair-v31-predictability-parent-scope-v2-once.yml
          git add src/strategies/genge_opportunity_discovery/evidence_collectors/multi_year_predictability.py tests/test_v31_multi_year_predictability.py
          git diff --cached --check
          git commit -m "fix: reject parent-only statements in predictability evidence"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch complete Deep Calculation production run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run genge-v31-deep-calculation-lambda.yml --ref main -f trigger_source=PREDICTABILITY_PARENT_SCOPE_FIX
          echo "Deep Calculation dispatched from $(git rev-parse HEAD)"
