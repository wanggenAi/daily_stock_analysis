name: GenGe Winner Concentration Trim

on:
  pull_request:
    paths:
      - "src/strategies/genge_opportunity_discovery/winner_concentration_trim_backtest.py"
      - "src/strategies/genge_opportunity_discovery/historical_portfolio_risk_budget.py"
      - "src/strategies/genge_opportunity_discovery/drawdown_risk_policy.py"
      - "src/strategies/genge_opportunity_discovery/hard_logic_historical_backtest.py"
      - "src/strategies/genge_opportunity_discovery/all_a_full_scan.py"
      - "tests/test_winner_concentration_trim_backtest.py"
      - "config/genge_hard_logic_famous_cases.csv"
      - "config/board_risk_rules.yaml"
      - ".github/workflows/genge-winner-concentration-trim.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical replay start date"
        required: false
        default: "2018-01-01"
        type: string
      end_date:
        description: "Historical replay end date"
        required: false
        default: "2026-08-18"
        type: string

permissions:
  contents: read

concurrency:
  group: genge-winner-concentration-trim-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Validate winner concentration trim
        run: |
          python -m py_compile src/strategies/genge_opportunity_discovery/winner_concentration_trim_backtest.py
          python -m pytest -q tests/test_winner_concentration_trim_backtest.py

  public-data-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Cache historical public data
        uses: actions/cache@v4
        with:
          path: data/cache/hard_logic_history_backtest
          key: hard-logic-history-v3-${{ runner.os }}-${{ hashFiles('config/genge_hard_logic_famous_cases.csv') }}
      - name: Resolve replay dates
        shell: bash
        run: |
          echo "START_DATE=${{ inputs.start_date || '2018-01-01' }}" >> "$GITHUB_ENV"
          echo "END_DATE=${{ inputs.end_date || '2026-08-18' }}" >> "$GITHUB_ENV"
      - name: Run low-frequency winner-concentration trim comparison
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.winner_concentration_trim_backtest \
            --cases-file config/genge_hard_logic_famous_cases.csv \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --output-dir reports/winner_concentration_trim \
            --cache-dir data/cache/hard_logic_history_backtest \
            --board-rules-file config/board_risk_rules.yaml \
            --evaluation-stride 5 \
            --cost-bps-per-side 15
      - name: Validate output contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('reports/winner_concentration_trim')
          required = [
              root/'winner_concentration_trim_summary.json',
              root/'winner_concentration_trim.md',
              root/'winner_trim_comparison.csv',
              root/'winner_trim_events.csv',
              root/'data_failures.csv',
          ]
          for path in required:
              assert path.exists() and path.stat().st_size > 0, path
          summary = json.loads((root/'winner_concentration_trim_summary.json').read_text(encoding='utf-8'))
          assert summary['entry_signal_set_frozen'] is True
          assert summary['exit_signal_set_frozen'] is True
          assert summary['trim_only_profitable_concentration'] is True
          assert summary['trim_decision_after_close'] is True
          assert summary['trim_rebalance_cost_charged'] is True
          assert summary['ordinary_volatility_exit_added'] is False
          assert summary['famous_case_selection_bias_warning'] is True
          assert summary['survivorship_aware_all_a_required'] is True
          assert summary['production_deployment_allowed'] is False
          assert summary['frozen_event_count'] > 0
          assert summary['risk_geometry_audit']['risk_geometry_coverage_ratio'] > 0.50
          rows = list(csv.DictReader((root/'winner_trim_comparison.csv').open(encoding='utf-8')))
          assert len(rows) >= 2
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/winner_concentration_trim/winner_concentration_trim.md ]; then
            cat reports/winner_concentration_trim/winner_concentration_trim.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-winner-concentration-trim
          path: reports/winner_concentration_trim
          if-no-files-found: error
