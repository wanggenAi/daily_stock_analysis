name: GenGe Candidate Terminal Review

on:
  push:
    branches: [main]
    paths:
      - "src/strategies/genge_opportunity_discovery/candidate_terminal_decision.py"
      - "src/strategies/genge_opportunity_discovery/valuation_research_report.py"
      - "src/strategies/genge_opportunity_discovery/valuation_research_long_term_runner.py"
      - "src/strategies/genge_cycle_bottom/fundamentals.py"
      - "tests/test_genge_candidate_terminal_decision.py"
      - "tests/test_genge_candidate_terminal_workflow.py"
      - "tests/test_genge_fundamental_recovery.py"
      - "tests/test_genge_valuation_research_report.py"
      - "tests/test_genge_valuation_research_long_term_runner.py"
      - ".github/workflows/genge-candidate-terminal-review.yml"
  pull_request:
    paths:
      - "src/strategies/genge_opportunity_discovery/candidate_terminal_decision.py"
      - "src/strategies/genge_opportunity_discovery/valuation_research_report.py"
      - "src/strategies/genge_opportunity_discovery/valuation_research_long_term_runner.py"
      - "src/strategies/genge_cycle_bottom/fundamentals.py"
      - "tests/test_genge_candidate_terminal_decision.py"
      - "tests/test_genge_candidate_terminal_workflow.py"
      - "tests/test_genge_fundamental_recovery.py"
      - "tests/test_genge_valuation_research_report.py"
      - "tests/test_genge_valuation_research_long_term_runner.py"
      - ".github/workflows/genge-candidate-terminal-review.yml"
  workflow_run:
    workflows: ["GenGe Postscan Research Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Postscan Research Pipeline run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-candidate-terminal-${{ github.event.workflow_run.id || inputs.upstream_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  terminal-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Run terminal and evidence-recovery contract tests
        run: >-
          python -m pytest -q
          tests/test_genge_candidate_terminal_decision.py
          tests/test_genge_candidate_terminal_workflow.py
          tests/test_genge_fundamental_recovery.py
          tests/test_genge_valuation_research_report.py
          tests/test_genge_valuation_research_long_term_runner.py

  terminalize:
    needs: terminal-contract-tests
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve upstream postscan run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          preferred=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            preferred="${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            preferred="${{ inputs.upstream_run_id }}"
          fi

          upstream=""
          if [[ "$preferred" =~ ^[0-9]+$ ]]; then
            # A production/workflow_dispatch lineage is exact. Never fall back to
            # an older successful postscan, because that can turn current UNKNOWN
            # evidence into stale terminal REJECT decisions.
            run_meta="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${preferred}" \
                --jq '[.name,.status,.conclusion,.head_branch] | @tsv'
            )"
            IFS=$'\t' read -r run_name run_status run_conclusion run_branch <<< "$run_meta"
            [[ "$run_name" == "GenGe Postscan Research Pipeline" ]] || {
              echo "preferred run $preferred is not GenGe Postscan Research Pipeline: $run_name" >&2
              exit 1
            }
            [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]] || {
              echo "preferred postscan run $preferred is not successful: status=$run_status conclusion=$run_conclusion" >&2
              exit 1
            }
            [[ "$run_branch" == "main" ]] || {
              echo "preferred postscan run $preferred is not on main: branch=$run_branch" >&2
              exit 1
            }
            artifact_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${preferred}/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name == "genge-postscan-research" and .expired == false)][0].id // empty'
            )"
            [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
              echo "exact postscan run $preferred has no usable genge-postscan-research artifact; stale fallback forbidden" >&2
              exit 1
            }
            upstream="$preferred"
            echo "selected exact postscan run $preferred with artifact $artifact_id"
          else
            # Push-triggered code smoke has no production lineage. It may use the
            # newest successful main artifact solely to validate the implementation.
            mapfile -t completed_runs < <(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-postscan-research.yml/runs?branch=main&status=success&per_page=20" \
                --jq '.workflow_runs[].id'
            )
            for candidate in "${completed_runs[@]}"; do
              artifact_id="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.name == "genge-postscan-research" and .expired == false)][0].id // empty'
              )"
              if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
                upstream="$candidate"
                echo "selected smoke-validation postscan run $candidate with artifact $artifact_id"
                break
              fi
              echo "skip postscan run $candidate: usable genge-postscan-research artifact not found"
            done
          fi

          [[ "$upstream" =~ ^[0-9]+$ ]] || {
            echo "no valid main postscan artifact resolved" >&2
            exit 1
          }
          echo "UPSTREAM_RUN_ID=$upstream" >> "$GITHUB_ENV"
          echo "postscan run: $upstream"
      - name: Download postscan research artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-postscan-research
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}
      - name: Resolve broad and authoritative inputs
        shell: bash
        run: |
          set -euo pipefail

          master="$(find upstream -type f -name master_opportunity_ranking.csv -print -quit)"
          if [ -z "$master" ]; then
            master="$(find upstream -type f -name long_term_formal_buy_candidates.csv -print -quit)"
          fi
          if [ -z "$master" ]; then
            master="$(find upstream -type f -name long_term_second_pass_candidates.csv -print -quit)"
          fi
          if [ -z "$master" ]; then
            master="$(find upstream -type f -name valuation_research_queue.csv -print -quit)"
          fi
          [ -n "$master" ] || { echo "no surviving postscan candidate universe" >&2; exit 1; }

          formal="$(find upstream -type f -name long_term_formal_buy_candidates.csv -print -quit)"
          if [ -z "$formal" ]; then
            formal="upstream/empty_formal_candidates.csv"
            printf 'code,long_term_formal_buy_eligible,v31_buy_ready\n' > "$formal"
          fi

          production="$(find upstream -type f -name production_decisions.csv -print -quit)"
          if [ -z "$production" ]; then
            production="upstream/empty_production_decisions.csv"
            printf 'code,decision_scope,production_action,valuation_confidence,reason_codes\n' > "$production"
          fi

          echo "MASTER_CSV=$master" >> "$GITHUB_ENV"
          echo "FORMAL_CSV=$formal" >> "$GITHUB_ENV"
          echo "PRODUCTION_CSV=$production" >> "$GITHUB_ENV"
          echo "candidate source: $master"
          echo "formal source: $formal"
          echo "production source: $production"
      - name: Terminalize every surviving research candidate
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.candidate_terminal_decision \
            --master-csv "$MASTER_CSV" \
            --formal-csv "$FORMAL_CSV" \
            --production-csv "$PRODUCTION_CSV" \
            --output-dir reports/candidate_terminal_decision
      - name: Validate terminal review contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('reports/candidate_terminal_decision')
          rows = list(csv.DictReader((root/'candidate_terminal_decisions.csv').open(encoding='utf-8')))
          summary = json.loads((root/'candidate_terminal_summary.json').read_text(encoding='utf-8'))
          assert rows
          assert len(rows) == summary['candidate_count'] == summary['terminalized_count']
          assert summary['research_limbo_count'] == 0
          assert summary['unauthorized_buy_count'] == 0
          assert summary['wait_price_without_price_count'] == 0
          assert summary['formal_buy_is_mirror_only'] is True
          assert summary['formal_buy_max_price_to_neutral'] == 0.8
          assert summary['canonical_authority_unchanged'] is True
          assert summary['hard_gate_unknown_is_pass'] is False
          assert summary['no_auto_trade'] is True
          assert all(row['terminal_decision'] in {'BUY','WAIT_PRICE','REJECT'} for row in rows)
          assert all(row['decision_authority'] == 'RESEARCH_TERMINAL_VIEW' for row in rows)
          assert all(row['formal_signal_eligible'] == 'False' for row in rows)
          assert all(row['automatic_promotion_allowed'] == 'False' for row in rows)
          assert all(row['no_auto_trade'] == 'True' for row in rows)
          assert all(row['terminal_formal_buy_authorized'] == 'True' for row in rows if row['terminal_decision'] == 'BUY')
          assert all(row['source_production_action'] == 'BUY' for row in rows if row['terminal_decision'] == 'BUY')
          assert all(row['source_valuation_confidence'] == 'HIGH' for row in rows if row['terminal_decision'] == 'BUY')
          assert all(float(row['wait_price_max']) > 0 for row in rows if row['terminal_decision'] == 'WAIT_PRICE')
          assert all(row['wait_price_semantics'] == 'frozen_formal_buy_ceiling' for row in rows if row['terminal_decision'] == 'WAIT_PRICE')
          assert all(row['source_production_action'] == 'WAIT' for row in rows if row['terminal_decision'] == 'WAIT_PRICE')
          assert all(row['source_valuation_confidence'] == 'HIGH' for row in rows if row['terminal_decision'] == 'WAIT_PRICE')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Print terminal decisions to run log
        if: always()
        run: |
          if [ -f reports/candidate_terminal_decision/candidate_terminal_decisions.md ]; then
            cat reports/candidate_terminal_decision/candidate_terminal_decisions.md
          fi
      - name: Publish terminal summary
        if: always()
        run: |
          if [ -f reports/candidate_terminal_decision/candidate_terminal_decisions.md ]; then
            cat reports/candidate_terminal_decision/candidate_terminal_decisions.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload terminal decisions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-candidate-terminal-decisions
          path: reports/candidate_terminal_decision
          if-no-files-found: error
          retention-days: 14