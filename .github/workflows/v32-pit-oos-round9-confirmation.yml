name: V3.2 PIT OOS Round 9 Confirmation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v32-pit-oos-round9-confirmation
  cancel-in-progress: false

jobs:
  round9:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Verify Round 8 is complete
        run: test -s backtests/v32_pit_oos_round8_discovery/promotion_check.json
      - name: Run frozen candidate tests
        run: >-
          python -m pytest -q
          tests/test_genge_opportunity_discovery_selection_framework_v32.py
          tests/test_v32_pit_oos_runner.py
      - name: Run untouched Round 9 confirmation OOS
        run: PYTHONUNBUFFERED=1 python scripts/v32_pit_oos_round8_round9.py --round 9
      - name: Publish result artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-pit-oos-round9-confirmation
          path: artifacts/v32_pit_oos_round9_untouched_confirmation
      - name: Commit frozen Round 9 result
        if: success()
        run: |
          mkdir -p backtests
          rm -rf backtests/v32_pit_oos_round9_untouched_confirmation
          cp -R artifacts/v32_pit_oos_round9_untouched_confirmation backtests/v32_pit_oos_round9_untouched_confirmation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/v32_pit_oos_round9_untouched_confirmation
          git diff --cached --quiet && exit 0
          git commit -m "Store V3.2 Round 9 confirmation results"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
