name: GenGe Valuation Research Queue

on:
  workflow_run:
    workflows: ["GenGe Opportunity Discovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Opportunity Discovery run id containing genge-all-a-production-report"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-valuation-research-${{ github.event.workflow_run.id || inputs.upstream_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  valuation-research:
    name: Reverse valuation research queue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Resolve upstream run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_RUN_ID=${{ inputs.upstream_run_id }}" >> "$GITHUB_ENV"
          fi

      - name: Download All-A production report
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}

      - name: Restore reverse-valuation fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-valuation-research-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-valuation-research-${{ runner.os }}-${{ github.ref_name }}-
            genge-valuation-research-${{ runner.os }}-main-
            genge-valuation-research-${{ runner.os }}-

      - name: Run focused reverse-valuation tests
        run: |
          python -m pytest -q \
            tests/test_genge_valuation_research_report.py \
            tests/test_genge_valuation_research_production.py

      - name: Build reverse-valuation research queue
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_research_report \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/valuation_research_queue \
            --fundamental-cache-dir data/cache/valuation_research_fundamentals \
            --research-limit 80 \
            --relaxed-reserve 20 \
            --financial-review-limit 30 \
            --years 5 \
            --minimum-pe-samples 20 \
            --max-workers 6

      - name: Validate research-only contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("reports/valuation_research_queue")
          runs = sorted(path for path in root.iterdir() if path.is_dir()) if root.exists() else []
          assert runs, "no valuation research report generated"
          latest = runs[-1]
          required = {
              "valuation_research_queue.csv",
              "valuation_research_queue.md",
              "valuation_research_summary.json",
          }
          missing = sorted(name for name in required if not (latest / name).exists())
          assert not missing, f"missing valuation research outputs: {missing}"

          summary = json.loads((latest / "valuation_research_summary.json").read_text(encoding="utf-8"))
          assert summary["selected_count"] <= 80
          assert summary["relaxed_reserve"] == 20
          assert summary["relaxed_recovery_count"] <= summary["relaxed_reserve"]
          assert summary["financial_review_count"] <= 30
          assert summary["formal_signal_eligible"] is False
          assert summary["automatic_promotion_allowed"] is False
          assert summary["no_auto_trade"] is True

          with (latest / "valuation_research_queue.csv").open(encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == summary["selected_count"]
          assert all(row["formal_signal_eligible"] == "False" for row in rows)
          assert all(row["automatic_promotion_allowed"] == "False" for row in rows)
          assert all(row["no_auto_trade"] == "True" for row in rows)
          assert all(row["code"] for row in rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publish reverse-valuation summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("reports/valuation_research_queue")
          runs = sorted(path for path in root.iterdir() if path.is_dir()) if root.exists() else []
          target = Path(os.environ["GITHUB_STEP_SUMMARY"])
          content = (
              (runs[-1] / "valuation_research_queue.md").read_text(encoding="utf-8")
              if runs and (runs[-1] / "valuation_research_queue.md").exists()
              else "# Reverse-Valuation Research Queue\n\nNo report was generated; inspect the failed step and artifact.\n"
          )
          with target.open("a", encoding="utf-8") as stream:
              stream.write(content)
          PY

      - name: Save reverse-valuation fundamental cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-valuation-research-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload reverse-valuation research report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-valuation-research-queue
          path: reports/valuation_research_queue
          if-no-files-found: warn
