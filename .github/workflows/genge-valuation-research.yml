name: GenGe Valuation Research Queue

on:
  workflow_run:
    workflows: ["GenGe Opportunity Discovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Opportunity Discovery run id containing genge-all-a-production-report"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-valuation-research-${{ github.event.workflow_run.id || inputs.upstream_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  valuation-research:
    name: Reverse valuation research queue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Resolve upstream run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_RUN_ID=${{ inputs.upstream_run_id }}" >> "$GITHUB_ENV"
          fi

      - name: Download All-A production report
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}

      - name: Restore reverse-valuation fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-valuation-research-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-valuation-research-${{ runner.os }}-${{ github.ref_name }}-
            genge-valuation-research-${{ runner.os }}-main-
            genge-valuation-research-${{ runner.os }}-

      - name: Run focused reverse-valuation tests
        run: |
          python -m pytest -q \
            tests/test_genge_valuation_research_report.py \
            tests/test_genge_valuation_research_production.py \
            tests/test_genge_valuation_company_profiles.py \
            tests/test_genge_valuation_model_routing.py \
            tests/test_genge_resource_asset_valuation.py \
            tests/test_genge_industry_coverage.py \
            tests/test_genge_industry_valuation_bridge.py

      - name: Build every-industry Top 5 research map
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_coverage \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/industry_coverage \
            --per-industry 5

      - name: Build industry-aware valuation source
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_valuation_bridge \
            --all-a-report upstream/reports/all_a_full_scan \
            --industry-coverage reports/industry_coverage \
            --output-dir reports/industry_valuation_source \
            --global-limit 80 \
            --relaxed-reserve 20 \
            --per-industry 3

      - name: Validate industry valuation coverage
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          coverage = Path('reports/industry_coverage')
          source = Path('reports/industry_valuation_source')
          with (coverage / 'industry_top_candidates.csv').open(encoding='utf-8') as f:
              industry_rows = list(csv.DictReader(f))
          with (source / 'all_a_quant_screen.csv').open(encoding='utf-8') as f:
              source_rows = list(csv.DictReader(f))
          summary = json.loads((source / 'industry_valuation_source_summary.json').read_text(encoding='utf-8'))
          clean_industries = {
              r['industry'] for r in industry_rows
              if r['industry_candidate_state'] == 'RESEARCH_CANDIDATE'
          }
          valued_industries = {
              r.get('industry', '') for r in source_rows
              if r.get('valuation_source_channel') in {'INDUSTRY_CHAMPION', 'BOTH'}
          }
          missing = sorted(clean_industries - valued_industries)
          assert not missing, f'clean industries missing valuation representation: {missing}'
          assert summary['global_limit'] == 80
          assert summary['per_industry_valuation_slots'] == 3
          assert summary['formal_signal_eligible'] is False
          assert summary['automatic_promotion_allowed'] is False
          assert summary['no_auto_trade'] is True
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Build reverse-valuation research queue
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_research_report \
            --report-dir reports/industry_valuation_source \
            --output-dir reports/valuation_research_queue \
            --fundamental-cache-dir data/cache/valuation_research_fundamentals \
            --research-limit 320 \
            --relaxed-reserve 240 \
            --financial-review-limit 80 \
            --years 5 \
            --minimum-pe-samples 20 \
            --max-workers 8

      - name: Route valuation models
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_model_routing \
            --report-root reports/valuation_research_queue \
            --profile-config config/valuation_company_profiles.yaml

      - name: Validate research-only contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("reports/valuation_research_queue")
          runs = sorted(path for path in root.iterdir() if path.is_dir()) if root.exists() else []
          assert runs, "no valuation research report generated"
          latest = runs[-1]
          required = {
              "valuation_research_queue.csv",
              "valuation_research_queue.md",
              "valuation_research_summary.json",
              "valuation_research_routed.csv",
              "valuation_research_routed.md",
              "valuation_routing_summary.json",
          }
          missing = sorted(name for name in required if not (latest / name).exists())
          assert not missing, f"missing valuation research outputs: {missing}"

          summary = json.loads((latest / "valuation_research_summary.json").read_text(encoding="utf-8"))
          routing = json.loads((latest / "valuation_routing_summary.json").read_text(encoding="utf-8"))
          assert summary["selected_count"] <= 320
          assert summary["relaxed_reserve"] == 240
          assert summary["relaxed_recovery_count"] <= summary["relaxed_reserve"]
          assert summary["financial_review_count"] <= 80
          assert summary["formal_signal_eligible"] is False
          assert summary["automatic_promotion_allowed"] is False
          assert summary["no_auto_trade"] is True

          with (latest / "valuation_research_queue.csv").open(encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          with (latest / "valuation_research_routed.csv").open(encoding="utf-8") as stream:
              routed_rows = list(csv.DictReader(stream))
          assert len(rows) == summary["selected_count"]
          assert len(routed_rows) == len(rows) == routing["routed_count"]
          assert routing["ranking_changed"] is False
          assert routing["formal_signal_eligible"] is False
          assert routing["automatic_promotion_allowed"] is False
          assert routing["no_auto_trade"] is True
          assert all(row["formal_signal_eligible"] == "False" for row in rows)
          assert all(row["automatic_promotion_allowed"] == "False" for row in rows)
          assert all(row["no_auto_trade"] == "True" for row in rows)
          assert all(row["code"] for row in rows)
          assert all(row["formal_signal_eligible"] == "False" for row in routed_rows)
          assert all(row["automatic_promotion_allowed"] == "False" for row in routed_rows)
          assert all(row["no_auto_trade"] == "True" for row in routed_rows)
          assert all(
              row["valuation_primary_strategy_id"]
              or row["valuation_model_execution_state"] == "ROUTING_BLOCKED"
              for row in routed_rows
          )
          print(json.dumps({"valuation": summary, "routing": routing}, ensure_ascii=False, indent=2))
          PY

      - name: Publish routed valuation summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("reports/valuation_research_queue")
          runs = sorted(path for path in root.iterdir() if path.is_dir()) if root.exists() else []
          target = Path(os.environ["GITHUB_STEP_SUMMARY"])
          industry = Path('reports/industry_coverage/industry_top_candidates.md')
          if industry.exists():
              with target.open('a', encoding='utf-8') as stream:
                  stream.write(industry.read_text(encoding='utf-8'))
                  stream.write('\n')
          if runs and (runs[-1] / "valuation_research_routed.md").exists():
              content = (runs[-1] / "valuation_research_routed.md").read_text(encoding="utf-8")
          elif runs and (runs[-1] / "valuation_research_queue.md").exists():
              content = (runs[-1] / "valuation_research_queue.md").read_text(encoding="utf-8")
          else:
              content = "# Valuation Research Queue\n\nNo report was generated; inspect the failed step and artifact.\n"
          with target.open("a", encoding="utf-8") as stream:
              stream.write(content)
          PY

      - name: Save reverse-valuation fundamental cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-valuation-research-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload reverse-valuation research report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-valuation-research-queue
          path: |
            reports/industry_coverage
            reports/industry_valuation_source
            reports/valuation_research_queue
          if-no-files-found: warn
