name: GenGe Integrate Insurance Sidecar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-integrate-insurance-sidecar.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical Postscan workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/genge-postscan-research.yml')
          text = path.read_text(encoding='utf-8')

          old = """            tests/test_genge_specialized_valuation_execution.py \\\n            tests/test_genge_resource_asset_valuation.py \\\n            tests/test_genge_master_opportunity_ranking.py
"""
          new = """            tests/test_genge_specialized_valuation_execution.py \\\n            tests/test_genge_insurance_embedded_value_inputs.py \\\n            tests/test_genge_insurance_valuation_execution.py \\\n            tests/test_genge_insurance_valuation.py \\\n            tests/test_genge_resource_asset_valuation.py \\\n            tests/test_genge_master_opportunity_ranking.py
"""
          assert old in text, 'focused test insertion anchor missing'
          text = text.replace(old, new, 1)

          old = """            --maximum-annual-roe-samples 5

      - name: Build long-term Formal BUY review
"""
          new = """            --maximum-annual-roe-samples 5

      - name: Execute insurance reverse appraisal research
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.insurance_valuation_execution \\\n            --report-root reports/valuation_research_queue \\\n            --input-config config/insurance_embedded_value_inputs.yaml \\\n            --cache-dir data/cache/valuation_research_fundamentals \\\n            --years 3

      - name: Build long-term Formal BUY review
"""
          assert old in text, 'execution insertion anchor missing'
          text = text.replace(old, new, 1)

          old = """              'valuation_research_specialized.csv', 'valuation_research_specialized.md',
              'specialized_valuation_summary.json',
"""
          new = """              'valuation_research_specialized.csv', 'valuation_research_specialized.md',
              'specialized_valuation_summary.json',
              'insurance_valuation_execution.csv', 'insurance_valuation_execution.md',
              'insurance_valuation_execution_summary.json',
"""
          assert old in text, 'required output anchor missing'
          text = text.replace(old, new, 1)

          old = """          assert specialized['automatic_promotion_allowed'] is False
          assert specialized['no_auto_trade'] is True

          formal_path = Path('reports/long_term_formal_buy/long_term_formal_buy_candidates.csv')
"""
          new = """          assert specialized['automatic_promotion_allowed'] is False
          assert specialized['no_auto_trade'] is True

          insurance_rows = list(csv.DictReader((latest/'insurance_valuation_execution.csv').open(encoding='utf-8')))
          insurance = json.loads((latest/'insurance_valuation_execution_summary.json').read_text(encoding='utf-8'))
          expected_insurance = sum(
              (r.get('valuation_primary_strategy_id') or '') == 'insurance_embedded_value'
              for r in routed_rows
          )
          assert len(insurance_rows) == len(routed_rows) == insurance['row_count']
          assert insurance['insurance_selected_count'] == expected_insurance
          assert 0 <= insurance['insurance_executed_count'] <= expected_insurance
          assert 0 <= insurance['insurance_input_required_count'] <= expected_insurance
          assert insurance['insurance_executed_count'] + insurance['insurance_input_required_count'] == expected_insurance
          assert insurance['ranking_changed'] is False
          assert insurance['formal_buy_consumes_insurance_sidecar'] is False
          assert insurance['formal_signal_eligible'] is False
          assert insurance['automatic_promotion_allowed'] is False
          assert insurance['no_auto_trade'] is True
          assert all(r.get('formal_signal_eligible') == 'False' for r in insurance_rows)
          assert all(r.get('automatic_promotion_allowed') == 'False' for r in insurance_rows)
          assert all(r.get('no_auto_trade') == 'True' for r in insurance_rows)

          formal_path = Path('reports/long_term_formal_buy/long_term_formal_buy_candidates.csv')
"""
          assert old in text, 'final contract insertion anchor missing'
          text = text.replace(old, new, 1)

          old = """              'specialized_valuation': specialized,
              'master_opportunity_ranking': master_summary,
"""
          new = """              'specialized_valuation': specialized,
              'insurance_reverse_appraisal': insurance,
              'master_opportunity_ranking': master_summary,
"""
          assert old in text, 'contract summary anchor missing'
          text = text.replace(old, new, 1)

          old = """                  for name in ('valuation_research_routed.md', 'valuation_research_specialized.md'):
"""
          new = """                  for name in ('valuation_research_routed.md', 'valuation_research_specialized.md', 'insurance_valuation_execution.md'):
"""
          assert old in text, 'step summary anchor missing'
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/genge-postscan-research.yml
      - name: Commit canonical integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/genge-postscan-research.yml
          git commit -m "ci: execute insurance reverse appraisal in postscan"
          git push origin HEAD:main
