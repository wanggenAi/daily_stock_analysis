name: GenGe Postscan Force Dispatch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/GENGE_POSTSCAN_FORCE_TRIGGER.md"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Postscan against Fresh All-A
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run genge-postscan-research.yml \
            --repo "$REPO" \
            --ref main \
            -f upstream_run_id=32090231706
          echo "Dispatched GenGe Postscan Research Pipeline with upstream_run_id=32090231706"
