name: GenGe Risk-Capped Opportunity Discovery

on:
  schedule:
    # 18:40 Beijing time on weekdays (10:40 UTC), after the strict shadow scan.
    - cron: "40 10 * * 1-5"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: genge-risk-capped-opportunity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-tests:
    name: Risk-capped policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Run risk-capped, engine, and signal lifecycle tests
        run: |
          python -m pytest -q \
            tests/test_genge_risk_capped_buy_policy.py \
            tests/test_genge_complete_material_event_pagination.py \
            tests/test_genge_opportunity_engine_policy.py \
            tests/test_genge_opportunity_pipeline_policy.py \
            tests/test_genge_opportunity_queue_policy.py \
            tests/test_genge_opportunity_report_policy.py \
            tests/test_genge_real_world_signals.py \
            tests/test_genge_live_exit_policy.py

  production-report:
    name: Risk-capped All-A production report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Restore all-A public-data cache and observation state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-all-a-state-${{ runner.os }}-main-
            genge-all-a-state-${{ runner.os }}-

      - name: Prepare all-A research state
        run: |
          mkdir -p data/cache/all_a_full_scan data/cache/genge_fundamentals data/cache/opportunity_evidence
          mkdir -p data/opportunity_snapshots/all_a_state
          if [ ! -s data/opportunity_snapshots/exit_profile.csv ]; then
            cp data/opportunity_snapshots/exit_profile_seed.csv data/opportunity_snapshots/exit_profile.csv
          fi

      - name: Run risk-capped all-A production scan
        run: |
          PYTHONUNBUFFERED=1 timeout --signal=TERM 100m \
          python -m src.strategies.genge_opportunity_discovery.risk_capped_complete_event_scan \
            --max-workers 12 \
            --evidence-queue-size 80 \
            --deep-review-size 30 \
            --max-watchlist 15 \
            --fundamental-limit 30 \
            --industry-evidence-file data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence-file data/user_supplied/company_cycle_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --exit-profile-file data/opportunity_snapshots/exit_profile.csv

      - name: Validate risk-capped production contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("reports/all_a_full_scan")
          runs = sorted(
              path for path in root.iterdir()
              if path.is_dir() and (path / "run_summary.json").exists()
          )
          assert runs, "no all-A production report generated"
          latest = runs[-1]
          summary = json.loads((latest / "run_summary.json").read_text(encoding="utf-8"))

          with (latest / "strict_gate_audit.csv").open(encoding="utf-8") as handle:
              audit = {row["code"].zfill(6): row for row in csv.DictReader(handle)}
          with (latest / "strict_review_ready.csv").open(encoding="utf-8") as handle:
              strict_rows = {row["code"].zfill(6): row for row in csv.DictReader(handle)}
          with (latest / "buy_signals.csv").open(encoding="utf-8") as handle:
              buys = list(csv.DictReader(handle))
          with (latest / "actionable_execution_list.csv").open(encoding="utf-8") as handle:
              executions = list(csv.DictReader(handle))

          relaxable = {
              "exit_profile_passed",
              "exit_profile_sample_count",
              "exit_profile_recent_2y_samples",
              "exit_profile_confidence",
              "exit_profile_freshness",
              "exit_profile_rule_version",
              "exit_profile_data_traceable",
              "exit_profile_entry_mode_match",
              "exit_profile_validation_scope",
          }
          hard_gate_columns = {
              "quant_research_queue", "no_hard_risk", "opportunity_engine_eligible",
              "trend_medium", "above_ma60", "ma60_not_down", "not_falling_knife",
              "financial_passed", "valuation_not_failed", "industry_evidence",
              "company_evidence", "hard_logic_medium", "real_rr_1_8", "ready_plan",
              "strict_official_evidence", "market_regime_not_red",
              "industry_regime_available", "industry_regime_not_crisis",
              "event_risk_known", "event_risk_not_high",
              "price_volume_not_distribution", "execution_not_high",
              "value_trap_not_high", "price_mapping_ok",
          }
          valid_engines = {
              "VALLEY_REPAIR", "STRONG_TREND_PULLBACK", "EARNINGS_INFLECTION",
          }

          assert summary["actionable_execution_count"] == summary["buy_signal_count"]
          assert len(executions) == len(buys) == summary["buy_signal_count"]
          assert summary["market_regime_status"] in {"GREEN", "YELLOW", "RED"}

          for buy in buys:
              code = buy["code"].zfill(6)
              assert buy["signal_action"] == "BUY_IF_TRIGGERED"
              assert code in strict_rows and code in audit
              assert buy["exit_profile_status"] != "FAILED"
              assert buy["market_regime_status"] in {"GREEN", "YELLOW"}
              assert buy["event_scan_status"] == "OK"
              assert buy["event_risk_level"] != "HIGH"
              assert buy["price_volume_state"] not in {"DISTRIBUTION", "CAPITULATION_RISK"}
              assert buy["real_world_gate_passed"] == "True"
              assert float(buy["risk_budget_initial_position_pct"] or 0) > 0
              assert float(buy["risk_budget_max_position_pct"] or 0) > 0

              row = strict_rows[code]
              assert row["opportunity_engine"] in valid_engines, (code, row["opportunity_engine"])
              assert row["opportunity_engine_eligible"] == "True", code
              assert row["opportunity_engine_reason"], code
              assert row["factor_validity_status"] in {"VALID", "NEUTRAL", "UNKNOWN"}, code
              failed = {
                  name for name in str(row.get("strict_gate_failed") or "").split(";") if name
              }
              if buy["exit_profile_status"] != "PASSED":
                  assert failed and failed.issubset(relaxable), (code, failed)
                  assert buy["profile_validation_scope"].startswith("RISK_CAPPED_")
                  multiplier = float(buy["profile_position_multiplier"] or 0)
                  assert 0 < multiplier <= 0.25
                  gate_row = audit[code]
                  assert all(gate_row[name] == "True" for name in hard_gate_columns), code

          print(f"validated={latest}")
          print(
              f"market={summary['market_regime_status']} "
              f"strict_ready={summary['strict_review_ready_count']} "
              f"formal_buys={summary['buy_signal_count']}"
          )
          PY

      - name: Publish daily signal summary
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("reports/all_a_full_scan")
          reports = sorted(
              path for path in root.iterdir()
              if path.is_dir() and (path / "daily_signals.md").exists()
          ) if root.exists() else []
          target = Path(os.environ["GITHUB_STEP_SUMMARY"])
          content = (
              (reports[-1] / "daily_signals.md").read_text(encoding="utf-8")
              if reports else "# Risk-capped signals\n\nNo report generated.\n"
          )
          with target.open("a", encoding="utf-8") as stream:
              stream.write(content)
          PY

      - name: Save all-A public-data cache and observation state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload risk-capped production report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-risk-capped-all-a-production-report
          path: |
            reports/all_a_full_scan
            stock_pools/all_a_universe_*.csv
          if-no-files-found: warn
