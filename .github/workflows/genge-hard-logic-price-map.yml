name: GenGe Hard Logic Price Map

on:
  pull_request:
    paths:
      - "src/strategies/genge_opportunity_discovery/hard_logic_price_map.py"
      - "src/strategies/genge_opportunity_discovery/hard_logic_engine.py"
      - "src/strategies/genge_opportunity_discovery/hard_logic_research_runner.py"
      - "src/strategies/genge_opportunity_discovery/hard_logic_valuation_merge.py"
      - "src/strategies/genge_opportunity_discovery/forward_scenario_valuation.py"
      - "src/strategies/genge_opportunity_discovery/forward_scenario_postscan.py"
      - "src/strategies/genge_opportunity_discovery/strict_hard_logic_price_map.py"
      - "tests/test_genge_hard_logic_price_map.py"
      - "tests/test_genge_hard_logic_engine.py"
      - "tests/test_genge_hard_logic_research_runner.py"
      - "tests/test_genge_forward_scenario_valuation.py"
      - "tests/test_genge_forward_scenario_postscan.py"
      - ".github/workflows/genge-hard-logic-price-map.yml"
      - ".github/workflows/genge-postscan-research.yml"
      - "docs/hard-logic-price-map.md"
      - "docs/CHANGELOG.md"
  workflow_run:
    workflows: ["GenGe Postscan Research Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Postscan Research Pipeline run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-hard-logic-price-map-${{ github.event.pull_request.number || github.event.workflow_run.id || inputs.upstream_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Validate strict hard-logic research and price-map modules
        run: |
          python -m py_compile \
            src/strategies/genge_opportunity_discovery/hard_logic_price_map.py \
            src/strategies/genge_opportunity_discovery/hard_logic_engine.py \
            src/strategies/genge_opportunity_discovery/hard_logic_research_runner.py \
            src/strategies/genge_opportunity_discovery/hard_logic_valuation_merge.py \
            src/strategies/genge_opportunity_discovery/forward_scenario_valuation.py \
            src/strategies/genge_opportunity_discovery/forward_scenario_postscan.py \
            src/strategies/genge_opportunity_discovery/strict_hard_logic_price_map.py
          python -m pytest -q \
            tests/test_genge_hard_logic_price_map.py \
            tests/test_genge_hard_logic_engine.py \
            tests/test_genge_hard_logic_research_runner.py \
            tests/test_genge_forward_scenario_valuation.py \
            tests/test_genge_forward_scenario_postscan.py

  build-price-map:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Resolve upstream run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_RUN_ID=${{ inputs.upstream_run_id }}" >> "$GITHUB_ENV"
          fi

      - name: Download unified postscan research artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-postscan-research
          path: postscan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}

      - name: Restore forward-consensus cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/forward_scenario_consensus
          key: genge-forward-consensus-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-forward-consensus-${{ runner.os }}-${{ github.ref_name }}-
            genge-forward-consensus-${{ runner.os }}-main-
            genge-forward-consensus-${{ runner.os }}-

      - name: Validate strict hard-logic research and price-map modules
        run: |
          python -m py_compile \
            src/strategies/genge_opportunity_discovery/hard_logic_price_map.py \
            src/strategies/genge_opportunity_discovery/hard_logic_engine.py \
            src/strategies/genge_opportunity_discovery/hard_logic_research_runner.py \
            src/strategies/genge_opportunity_discovery/hard_logic_valuation_merge.py \
            src/strategies/genge_opportunity_discovery/forward_scenario_valuation.py \
            src/strategies/genge_opportunity_discovery/forward_scenario_postscan.py \
            src/strategies/genge_opportunity_discovery/strict_hard_logic_price_map.py
          python -m pytest -q \
            tests/test_genge_hard_logic_price_map.py \
            tests/test_genge_hard_logic_engine.py \
            tests/test_genge_hard_logic_research_runner.py \
            tests/test_genge_forward_scenario_valuation.py \
            tests/test_genge_forward_scenario_postscan.py

      - name: Build live analyst EPS and peer reasonable-PE scenarios
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.forward_scenario_postscan \
            --artifact-root postscan \
            --output-dir postscan/reports/forward_scenario_valuation \
            --cache-dir data/cache/forward_scenario_consensus \
            --min-target-institutions 3 \
            --min-peer-reports 2 \
            --min-peer-samples 6 \
            --max-workers 4

      - name: Validate forward-scenario contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('postscan/reports/forward_scenario_valuation')
          csv_path = root/'forward_scenario_valuation.csv'
          summary_path = root/'forward_scenario_valuation_summary.json'
          md_path = root/'forward_scenario_valuation.md'
          for path in (csv_path, summary_path, md_path):
              assert path.exists() and path.stat().st_size > 0, f'missing/empty forward output: {path}'
          rows = list(csv.DictReader(csv_path.open(encoding='utf-8')))
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          assert len(rows) == summary['row_count']
          assert summary['hard_logic_pass_output_count'] == summary['row_count']
          assert summary['historical_pe_used_for_reasonable_pe'] is False
          assert summary['analyst_consensus_is_live_not_historical_pit'] is True
          assert summary['historical_backtest_eligible'] is False
          assert summary['peer_price_source'] == 'postscan_raw_all_a_snapshot:raw_latest_close_first'
          assert summary['formal_signal_eligible'] is False
          assert summary['automatic_promotion_allowed'] is False
          assert summary['no_auto_trade'] is True
          assert all(r.get('historical_pe_used_for_reasonable_pe') == 'False' for r in rows)
          assert all(r.get('no_auto_trade') == 'True' for r in rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Build strict hard-logic price expectation map
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.strict_hard_logic_price_map \
            --artifact-root postscan \
            --output-dir reports/hard_logic_price_map

      - name: Validate production contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('reports/hard_logic_price_map')
          csv_path = root / 'hard_logic_price_map.csv'
          md_path = root / 'hard_logic_price_map.md'
          summary_path = root / 'hard_logic_price_map_summary.json'
          for path in (csv_path, md_path, summary_path):
              assert path.exists() and path.stat().st_size > 0, f'missing/empty output: {path}'

          rows = list(csv.DictReader(csv_path.open(encoding='utf-8')))
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          assert rows, 'hard-logic price map unexpectedly empty'
          assert len(rows) == summary['candidate_count']
          assert summary['global_top1_required'] is False
          assert summary['technical_context_is_non_veto'] is True
          assert summary['formal_signal_eligible'] is False
          assert summary['automatic_promotion_allowed'] is False
          assert summary['no_auto_trade'] is True
          assert all(row.get('no_auto_trade') == 'True' for row in rows)
          assert all(row.get('formal_signal_eligible') == 'False' for row in rows)
          assert all(row.get('automatic_promotion_allowed') == 'False' for row in rows)

          research_paths = sorted(Path('postscan').glob('**/hard_logic_research.csv'))
          if research_paths:
              research = list(csv.DictReader(research_paths[-1].open(encoding='utf-8')))
              pass_codes = {
                  r['selected_code'] for r in research
                  if r.get('research_state') == 'PASS'
                  and r.get('hard_logic_state') == 'PASS'
                  and r.get('selected_code')
              }
              by_code = {r['code']: r for r in rows}
              missing = sorted(pass_codes - set(by_code))
              assert not missing, f'hard-logic PASS names missing price-map rows: {missing}'
              for code in pass_codes:
                  row = by_code[code]
                  assert row.get('hard_logic_state') == 'PASS', (code, row.get('hard_logic_state'))
                  assert row.get('hard_logic_structural_driver'), f'{code} missing structural driver'
                  assert row.get('hard_logic_company_edge'), f'{code} missing company edge'
                  assert row.get('hard_logic_profit_transmission'), f'{code} missing profit transmission'
                  assert row.get('hard_logic_invalidation'), f'{code} missing invalidation'
                  assert row.get('hard_logic_evidence_sources'), f'{code} missing evidence sources'

          forward_rows = list(csv.DictReader(
              Path('postscan/reports/forward_scenario_valuation/forward_scenario_valuation.csv').open(encoding='utf-8')
          ))
          by_code = {r['code']: r for r in rows}
          for forward in forward_rows:
              code = forward.get('code')
              price_row = by_code.get(code)
              assert price_row is not None, f'forward scenario code missing price map: {code}'
              if forward.get('scenario_fair_price_base'):
                  assert price_row.get('valuation_framework') == 'FORWARD_SCENARIO', code
                  assert price_row.get('scenario_fair_price_base') == forward.get('scenario_fair_price_base'), code
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publish price-map summary
        if: always()
        run: |
          if [ -f postscan/reports/forward_scenario_valuation/forward_scenario_valuation.md ]; then
            cat postscan/reports/forward_scenario_valuation/forward_scenario_valuation.md >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/hard_logic_price_map/hard_logic_price_map.md ]; then
            cat reports/hard_logic_price_map/hard_logic_price_map.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save forward-consensus cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data/cache/forward_scenario_consensus
          key: genge-forward-consensus-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload hard-logic price map
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-hard-logic-price-map
          path: |
            reports/hard_logic_price_map
            postscan/reports/forward_scenario_valuation
          if-no-files-found: error
