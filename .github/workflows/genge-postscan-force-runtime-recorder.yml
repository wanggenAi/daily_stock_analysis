name: GenGe Postscan Force Runtime Recorder

on:
  workflow_run:
    workflows: ["GenGe Postscan Force Dispatch"]
    types: [requested, completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist force-dispatch runtime
        env:
          ACTION: ${{ github.event.action }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          STATUS: ${{ github.event.workflow_run.status }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > docs/GENGE_POSTSCAN_FORCE_RUNTIME.md <<EOF
          # GenGe Postscan Force Runtime

          action: ${ACTION}
          run_id: ${RUN_ID}
          status: ${STATUS}
          conclusion: ${CONCLUSION}
          url: ${URL}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_POSTSCAN_FORCE_RUNTIME.md
          git commit -m "docs: record Postscan force ${ACTION} ${RUN_ID} [skip ci]" || true
          git push origin HEAD:main
