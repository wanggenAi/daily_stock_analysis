name: GenGe Insurance Marketcap Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-insurance-marketcap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Probe historical valuation inputs
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from src.strategies.genge_cycle_bottom.fundamentals import PublicFundamentalLoader

          loader = PublicFundamentalLoader(cache_dir=Path('data/cache/insurance-marketcap-probe'))
          as_of = date(2026, 8, 17)
          for code in ('601628','601601'):
              frame, provider, errors, cache_hit = loader.load_valuation(code, years=3)
              local = frame.copy()
              local = local[local['date'] <= as_of].sort_values('date')
              row = local.dropna(subset=['market_cap']).iloc[-1]
              print({
                  'code': code,
                  'provider': provider,
                  'date': str(row['date']),
                  'market_cap_raw': float(row['market_cap']),
                  'pb': None if row['pb'] != row['pb'] else float(row['pb']),
                  'pe': None if row['pe'] != row['pe'] else float(row['pe']),
                  'errors': errors,
                  'cache_hit': cache_hit,
              })
          PY
