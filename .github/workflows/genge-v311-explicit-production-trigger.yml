name: GenGe V3.1.1 Explicit Production Trigger

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-production:
    if: contains(github.event.head_commit.message, '[run-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch fresh Opportunity Discovery production run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genge-opportunity-discovery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_legacy_report=false
