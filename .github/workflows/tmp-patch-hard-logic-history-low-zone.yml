name: Temporary Patch Hard Logic History Low Zone

on:
  push:
    branches:
      - feat/hard-logic-price-expectation-map

permissions:
  contents: write

jobs:
  patch-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/hard-logic-price-expectation-map
          fetch-depth: 0

      - name: Apply valuation low-zone entry rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/strategies/genge_opportunity_discovery/hard_logic_historical_backtest.py')
          text = path.read_text(encoding='utf-8')

          old = 'DEFAULT_STRIDE = 5\nBUY_DECISIONS = {"BUY_DEEP_VALUE", "BUYABLE", "BUYABLE_WITH_SUPPORTED_GROWTH"}\n'
          new = 'DEFAULT_STRIDE = 5\nMAX_ENTRY_PE_PERCENTILE = 50.0\nBUY_DECISIONS = {"BUY_DEEP_VALUE", "BUYABLE", "BUYABLE_WITH_SUPPORTED_GROWTH"}\n'
          if old not in text:
              raise SystemExit('constant anchor not found')
          text = text.replace(old, new, 1)

          old = '''        pmap = _price_map(data, day, close, valuation, logic)\n        if position is None and logic["state"] == "PASS" and pmap["price_decision"] in BUY_DECISIONS:\n            ceiling = _finite(pmap.get("buyable_price_ceiling"))\n            if ceiling is not None and close <= ceiling:\n'''
          new = '''        pmap = _price_map(data, day, close, valuation, logic)\n        decision = str(pmap.get("price_decision") or "")\n        pe_percentile = _finite(valuation.get("historical_pe_percentile"))\n        low_zone_ok = bool(\n            decision == "BUY_DEEP_VALUE"\n            or (pe_percentile is not None and pe_percentile <= MAX_ENTRY_PE_PERCENTILE)\n        )\n        if position is None and logic["state"] == "PASS" and decision in BUY_DECISIONS and low_zone_ok:\n            ceiling = _finite(pmap.get("buyable_price_ceiling"))\n            if ceiling is not None and close <= ceiling:\n'''
          if old not in text:
              raise SystemExit('entry anchor not found')
          text = text.replace(old, new, 1)

          old = '''        "evaluation_stride_sessions": evaluation_stride,\n        "cost_bps_per_side": cost_bps_per_side,\n        "point_in_time_financials": True,\n'''
          new = '''        "evaluation_stride_sessions": evaluation_stride,\n        "cost_bps_per_side": cost_bps_per_side,\n        "valuation_low_zone_entry_required": True,\n        "max_entry_pe_percentile": MAX_ENTRY_PE_PERCENTILE,\n        "deep_value_bypasses_pe_percentile_gate": True,\n        "point_in_time_financials": True,\n'''
          if old not in text:
              raise SystemExit('summary anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-patch-hard-logic-history-low-zone.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/strategies/genge_opportunity_discovery/hard_logic_historical_backtest.py .github/workflows/tmp-patch-hard-logic-history-low-zone.yml
          git commit -m 'fix: require valuation low zone for historical entries'
          git push origin HEAD:feat/hard-logic-price-expectation-map
