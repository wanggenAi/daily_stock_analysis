name: GenGe City Gas Profile Validation Locator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-city-gas-profile-validation-locator.yml"

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record validation run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 8
          gh run list --repo "${{ github.repository }}" --workflow genge-city-gas-profile-validation.yml --limit 3 --json databaseId,status,conclusion,headSha,url > docs/GENGE_CITY_GAS_PROFILE_VALIDATION_LOCATOR.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_CITY_GAS_PROFILE_VALIDATION_LOCATOR.json
          git commit -m "chore: record city gas profile validation" || exit 0
          git push origin HEAD:main
