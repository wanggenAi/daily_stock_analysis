name: TEMP Final Terminal Reconcile

on:
  push:
    branches:
      - validation/final-terminal-reconcile
    paths:
      - ".github/workflows/tmp-final-terminal-reconcile.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch formal Deep Terminal Reconciler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run genge-deep-terminal-reconciler.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
