name: GenGe Today Postscan Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-today-postscan-dispatch.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch fresh Postscan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genge-postscan-research.yml --repo "${{ github.repository }}" --ref main -f upstream_run_id=32192658758
          sleep 10
          gh run list --repo "${{ github.repository }}" --workflow genge-postscan-research.yml --limit 5 --json databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url > docs/GENGE_TODAY_POSTSCAN.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_TODAY_POSTSCAN.json
          git commit -m "ops: record fresh premarket postscan" || exit 0
          git push origin HEAD:main
