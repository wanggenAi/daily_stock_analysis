name: GenGe V3.1.1 Price-Date Fix Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genge-v311-price-date-fix-once.yml

permissions:
  contents: write

concurrency:
  group: genge-v311-price-date-fix-once
  cancel-in-progress: false

jobs:
  migrate-price-date-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install repository CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Apply guarded source migration
        run: python scripts/patch_v311_price_date_provenance.py

      - name: Reject fabricated price dates
        run: |
          ! grep -F '"price_date": as_of.isoformat()' src/strategies/genge_opportunity_discovery/v311_current_expectation_inputs.py
          grep -F 'PRICE_DATE_UNVERIFIED' src/strategies/genge_opportunity_discovery/v311_current_expectation_inputs.py
          grep -F 'PRICE_DATE_AFTER_DECISION_DATE' src/strategies/genge_opportunity_discovery/v311_current_expectation_inputs.py

      - name: Run focused provenance regression tests
        run: pytest -q tests/test_v311_price_date_provenance.py

      - name: Compile patched production module
        run: python -m py_compile src/strategies/genge_opportunity_discovery/v311_current_expectation_inputs.py

      - name: Commit verified production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/strategies/genge_opportunity_discovery/v311_current_expectation_inputs.py
          if git diff --cached --quiet; then
            echo 'guarded migration produced no source diff' >&2
            exit 1
          fi
          git commit -m "Preserve verified V3.1.1 price observation dates"
          git push origin HEAD:main
