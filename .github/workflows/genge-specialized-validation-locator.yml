name: GenGe Specialized Validation Locator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-specialized-validation-locator.yml"

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record focused validation run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow genge-specialized-validation.yml \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url \
            > docs/GENGE_SPECIALIZED_VALIDATION_LOCATOR.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_SPECIALIZED_VALIDATION_LOCATOR.json
          git commit -m "chore: record specialized validation run" || exit 0
          git push origin HEAD:main
