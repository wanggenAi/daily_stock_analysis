name: GenGe V3.1.1 Evidence Slow Lane

on:
  schedule:
    # Heavy policy/competition evidence stays continuously fresh every four hours, including premarket.
    # GitHub cron is UTC; this cadence is timezone-independent.
    - cron: "35 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-evidence-slow-lane.yml"
      - "config/research_security_profiles.json"
      - "config/competition_peer_map.json"
      - "config/industry_alias_map.yaml"
      - "src/strategies/genge_opportunity_discovery/research_mapping_coverage.py"
      - "src/strategies/genge_opportunity_discovery/regulatory_policy_evidence_collector.py"
      - "src/strategies/genge_opportunity_discovery/competition_peer_evidence_feeder.py"
      - "src/strategies/genge_opportunity_discovery/competition_change_collector.py"
      - "src/strategies/genge_opportunity_discovery/evidence_source_registry.py"
      - "tests/test_genge_slow_lane_evidence.py"
      - "tests/test_genge_competition_peer_evidence_feeder.py"
      - "tests/test_genge_research_mapping_coverage.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: genge-v311-evidence-slow-lane
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  collect-slow-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install slow-lane dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            "requests>=2.31.0" "beautifulsoup4>=4.12.0" "PyYAML>=6.0" "pypdf>=5.0.0" \
            pandas pytest anyio fastapi httpx starlette

      - name: Resolve latest explicit All-A industry metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/all-a-industry-source"
          rm -rf "$root"
          mkdir -p "$root"
          echo "ALL_A_INDUSTRY_SOURCE_CSV=" >> "$GITHUB_ENV"
          echo "ALL_A_INDUSTRY_SOURCE_RUN_ID=" >> "$GITHUB_ENV"

          mapfile -t successful_runs < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-opportunity-discovery.yml/runs?branch=main&status=success&per_page=12" \
              --jq '.workflow_runs[].id'
          )
          for run_id in "${successful_runs[@]}"; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "genge-all-a-production-report" and .expired == false)][0].id // empty')"
            if [[ ! "$artifact_id" =~ ^[0-9]+$ ]]; then
              continue
            fi
            rm -rf "$root/unpacked"
            mkdir -p "$root/unpacked"
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$root/report.zip"; then
              echo "industry metadata artifact download degraded for run ${run_id}" >&2
              continue
            fi
            if ! unzip -q -o "$root/report.zip" -d "$root/unpacked"; then
              echo "industry metadata artifact unzip degraded for run ${run_id}" >&2
              continue
            fi
            source_file="$(find "$root/unpacked" -type f -name all_a_quant_screen.csv -not -path '*/_deep_review/*' -print | sort | tail -1)"
            if [ -z "$source_file" ]; then
              continue
            fi
            echo "ALL_A_INDUSTRY_SOURCE_CSV=$source_file" >> "$GITHUB_ENV"
            echo "ALL_A_INDUSTRY_SOURCE_RUN_ID=$run_id" >> "$GITHUB_ENV"
            echo "resolved explicit All-A industry metadata from run ${run_id}: ${source_file}"
            exit 0
          done

          echo "No usable successful All-A industry artifact found; static reviewed mapping remains authoritative and unresolved names stay gaps" >&2
          exit 0

      - name: Collect and persist slow-lane evidence with optimistic replay
        run: |
          set -euo pipefail
          git config user.name "genge-v311-evidence-slow-lane-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            echo "slow-lane replay attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            git clean -fdx -- data/evidence_events data/research_mapping

            python -m pytest -q \
              tests/test_genge_slow_lane_evidence.py \
              tests/test_genge_evidence_event_store.py \
              tests/test_genge_research_mapping_coverage.py \
              tests/test_genge_competition_peer_evidence_feeder.py

            industry_args=()
            if [ -n "${ALL_A_INDUSTRY_SOURCE_CSV:-}" ] && [ -f "$ALL_A_INDUSTRY_SOURCE_CSV" ]; then
              industry_args=(
                --industry-source-csv "$ALL_A_INDUSTRY_SOURCE_CSV"
                --industry-source-label "github-actions:genge-opportunity-discovery:${ALL_A_INDUSTRY_SOURCE_RUN_ID}"
              )
            fi
            python -m src.strategies.genge_opportunity_discovery.research_mapping_coverage \
              "${industry_args[@]}" \
              --coverage-output data/research_mapping/coverage.json \
              --industry-csv-output data/research_mapping/company_industry_map.csv

            if [ -f data/hourly_deep_overlay/latest.json ]; then
              python -m src.strategies.genge_opportunity_discovery.regulatory_policy_evidence_collector \
                --hourly-overlay data/hourly_deep_overlay/latest.json \
                --company-cycle-evidence data/research_mapping/company_industry_map.csv \
                --industry-alias-map config/industry_alias_map.yaml \
                --evidence-root data/evidence_events \
                --status-output data/evidence_events/policy_collector_status.json || echo "policy collector degraded; preserving fail-soft research semantics" >&2
            else
              python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('data/evidence_events/policy_collector_status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'NO_PERSISTED_HOURLY_WORKSET',
              'formal_action_eligible': False,
              'no_auto_trade': True,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            fi

            python -m src.strategies.genge_opportunity_discovery.competition_peer_evidence_feeder \
              --peer-map config/competition_peer_map.json \
              --cache-dir data/evidence_cache/competition_peers \
              --evidence-root data/evidence_events \
              --status-output data/evidence_events/competition_peer_feeder_status.json || echo "peer evidence feeder degraded; preserving fail-soft research semantics" >&2

            python -m src.strategies.genge_opportunity_discovery.competition_change_collector \
              --peer-map config/competition_peer_map.json \
              --evidence-root data/evidence_events \
              --status-output data/evidence_events/competition_collector_status.json \
              --lookback-hours 168

            python -m src.strategies.genge_opportunity_discovery.evidence_source_registry \
              --evidence-root data/evidence_events \
              --collector-status data/evidence_events/collector_status.json \
              --industry-status data/evidence_events/industry_collector_status.json \
              --commodity-status data/evidence_events/commodity_collector_status.json \
              --policy-status data/evidence_events/policy_collector_status.json \
              --competition-status data/evidence_events/competition_collector_status.json \
              --output data/evidence_events/source_registry.json

            python - <<'PY'
          import json, os
          from pathlib import Path
          registry = json.loads(Path('data/evidence_events/source_registry.json').read_text(encoding='utf-8'))
          coverage = json.loads(Path('data/research_mapping/coverage.json').read_text(encoding='utf-8'))
          assert registry['contract_version'] == 'GEN_GE_EVIDENCE_SOURCE_REGISTRY_V3'
          assert registry['formal_action_eligible'] is False
          assert registry['no_auto_trade'] is True
          assert registry['lane_semantics'] == 'FAST_LANE_MUST_NOT_DEPEND_ON_SLOW_LANE_SUCCESS'
          assert registry['registered_sources']['REGULATORY_POLICY']['implemented'] is True
          assert registry['registered_sources']['COMPETITIVE_CHANGE']['implemented'] is True
          assert registry['registered_sources']['REGULATORY_POLICY']['lane'] == 'EVIDENCE_SLOW'
          assert registry['registered_sources']['COMPETITIVE_CHANGE']['mapping_is_evidence_gated'] is True
          assert coverage['contract_version'] == 'GEN_GE_RESEARCH_MAPPING_COVERAGE_V4_PRODUCTION_INDUSTRY_METADATA'
          assert coverage['formal_action_eligible'] is False
          assert coverage['formal_action_recomputed'] is False
          assert coverage['changes_thresholds'] is False
          assert coverage['no_auto_trade'] is True
          assert coverage['industry_source_may_infer_commodity_or_peers'] is False
          assert coverage['industry_mapping_origin_counts'].get('REVIEWED_STATIC_PROFILE', 0) >= 0
          if os.environ.get('ALL_A_INDUSTRY_SOURCE_CSV'):
              assert coverage['industry_source_input_available'] is True
              assert coverage['industry_source_resolved_security_count'] > 0
          PY

            git add -f data/evidence_events data/research_mapping
            if git diff --cached --quiet; then
              echo "No slow-lane evidence change to persist"
              exit 0
            fi
            git commit -m "Persist V3.1.1 slow-lane evidence [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push race detected; replaying slow-lane evidence from newest origin/main" >&2
          done

          echo "slow-lane persistence failed after 4 optimistic replay attempts" >&2
          exit 1

      - name: Upload slow-lane evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-evidence-slow-lane-${{ github.run_id }}
          path: |
            data/evidence_events
            data/research_mapping
          if-no-files-found: warn
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          echo "# GenGe V3.1.1 Evidence Slow Lane" >> "$GITHUB_STEP_SUMMARY"
          echo "- persistence: optimistic replay on newest main" >> "$GITHUB_STEP_SUMMARY"
          echo "- official regulatory/policy evidence is collected outside the hourly fast lane" >> "$GITHUB_STEP_SUMMARY"
          echo "- reviewed static industry mappings have precedence; latest successful All-A explicit industry metadata fills only unresolved industry gaps" >> "$GITHUB_STEP_SUMMARY"
          echo "- conflicting or missing production industry metadata fails closed and cannot infer commodity or peer mappings" >> "$GITHUB_STEP_SUMMARY"
          echo "- explicit peer mappings receive their own official material-event feed before competition bridging" >> "$GITHUB_STEP_SUMMARY"
          echo "- slow-lane fetch failures cannot block or mutate Formal actions" >> "$GITHUB_STEP_SUMMARY"
          echo "- all outputs are research-only Evidence Events" >> "$GITHUB_STEP_SUMMARY"
