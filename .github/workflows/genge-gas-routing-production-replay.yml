name: GenGe Gas Routing Production Replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-gas-routing-production-replay.yml"

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Download validated Postscan artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-postscan-research
          path: replay
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32109532494
      - name: Reroute with PIT company profile
        run: |
          python -m src.strategies.genge_opportunity_discovery.valuation_model_routing \
            --report-root replay/valuation_research_queue \
            --profile-config config/valuation_company_profiles.yaml
      - name: Execute specialized sidecar after reroute
        run: |
          python -m src.strategies.genge_opportunity_discovery.specialized_valuation_execution \
            --report-root replay/valuation_research_queue \
            --cache-dir data/cache/gas-routing-specialized \
            --years 7
      - name: Validate routing replay
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('replay/valuation_research_queue')
          runs = sorted(p for p in root.iterdir() if p.is_dir())
          assert runs
          latest = runs[-1]
          routed = list(csv.DictReader((latest/'valuation_research_routed.csv').open(encoding='utf-8')))
          special = list(csv.DictReader((latest/'valuation_research_specialized.csv').open(encoding='utf-8')))
          r = next(x for x in routed if x['code'] == '603393')
          assert r['valuation_profile_status'] == 'FOUND'
          assert r['valuation_profile_used_for_routing'] == 'True'
          assert r['valuation_disabled_strategy_ids'] == 'yield_asset'
          assert r['valuation_strategy_ids'] == 'capacity_cycle_normalizer;general_reverse_earnings'
          assert r['valuation_primary_strategy_id'] == 'general_reverse_earnings'
          assert r['valuation_model_execution_state'] == 'NORMALIZATION_REQUIRED_BEFORE_GENERIC_VALUATION'
          s = next(x for x in special if x['code'] == '603393')
          assert s['specialized_model_execution_state'] == 'NOT_SPECIALIZED_ROUTE'
          summary = json.loads((latest/'valuation_specialized_summary.json').read_text(encoding='utf-8'))
          assert summary['capital_markets_selected_count'] == 3
          assert summary['capital_markets_executed_count'] == 3
          assert summary['formal_buy_consumes_specialized_sidecar'] is False
          assert summary['no_auto_trade'] is True
          print(json.dumps({'603393': r, 'specialized_summary': summary}, ensure_ascii=False, indent=2))
          PY
