name: GenGe V3.1.1 Event-Driven Deep Review

on:
  workflow_run:
    workflows:
      - "GenGe V3.1.1 Research Learning"
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-v311-event-driven-deep-review.yml"
      - ".github/workflows/genge-v311-event-driven-authority-handoff.yml"
      - "src/strategies/genge_opportunity_discovery/event_driven_deep_review_trigger.py"
      - "tests/test_genge_event_driven_deep_review_trigger.py"
      - "tests/test_genge_event_driven_authority_handoff.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: genge-v311-event-driven-deep-review
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  evaluate-and-dispatch:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install production-compatible trigger dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Validate event-driven trigger and authority-handoff contracts
        run: |
          python -m pytest -q \
            tests/test_genge_event_driven_deep_review_trigger.py \
            tests/test_genge_event_driven_authority_handoff.py

      - name: Build event-driven Deep Review decision
        id: decision
        run: |
          set -euo pipefail
          python -m src.strategies.genge_opportunity_discovery.event_driven_deep_review_trigger \
            --priority data/research_priority/latest.json \
            --hourly data/hourly_research_state/latest.json \
            --output reports/event_driven_deep_review/decision.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          d = json.loads(Path('reports/event_driven_deep_review/decision.json').read_text(encoding='utf-8'))
          assert d['formal_action_source'] == 'FINALIZED_CANONICAL_ONLY'
          assert d['formal_action_recomputed'] is False
          assert d['formal_action_eligible'] is False
          assert d['direct_formal_action_change_allowed'] is False
          assert d['no_auto_trade'] is True
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f"dispatch_required={str(bool(d['dispatch_required'])).lower()}\n")
              out.write(f"signal_digest={d['signal_digest']}\n")
              out.write(f"trigger_codes={','.join(d['trigger_codes'])}\n")
              out.write(f"holding_trigger_count={d['holding_trigger_count']}\n")
              out.write(f"external_trigger_count={d['external_trigger_count']}\n")
          PY

      - name: Restore exact-signal dispatch marker
        id: dedupe
        if: steps.decision.outputs.dispatch_required == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .event-driven-deep-review-cache
          key: genge-v311-event-deep-review-v2-${{ steps.decision.outputs.signal_digest }}

      - name: Dispatch explicit event-driven authority chain
        id: dispatch
        if: >-
          steps.decision.outputs.dispatch_required == 'true' &&
          steps.dedupe.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          handoff_runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v311-event-driven-authority-handoff.yml/runs?per_page=20")
          active_handoff=$(printf '%s' "$handoff_runs" | jq '[
            .workflow_runs[]
            | select(.status == "queued" or .status == "in_progress")
          ] | length')
          if [ "$active_handoff" -gt 0 ]; then
            echo "An event-driven authority handoff is already active; defer this signal."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            echo "dispatch_path=ACTIVE_HANDOFF_DEFER" >> "$GITHUB_OUTPUT"
            echo "upstream_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          industry_runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v31-industry-research.yml/runs?per_page=30")
          active_industry=$(printf '%s' "$industry_runs" | jq '[
            .workflow_runs[]
            | select((.event == "workflow_dispatch" or .event == "workflow_run")
                     and (.status == "queued" or .status == "in_progress"))
          ] | length')
          if [ "$active_industry" -gt 0 ]; then
            echo "A production Every-Industry Deep Review is already active; defer this signal."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            echo "dispatch_path=ACTIVE_DEEP_REVIEW_DEFER" >> "$GITHUB_OUTPUT"
            echo "upstream_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          discovery_runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-opportunity-discovery.yml/runs?status=success&per_page=30")
          upstream_run_id=""
          while IFS= read -r candidate_run_id; do
            test -n "$candidate_run_id" || continue
            artifacts=$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts?per_page=100")
            artifact_count=$(printf '%s' "$artifacts" | jq '[
              .artifacts[]
              | select(.name == "genge-all-a-production-report" and .expired == false)
            ] | length')
            if [ "$artifact_count" -eq 1 ]; then
              upstream_run_id="$candidate_run_id"
              break
            fi
          done < <(printf '%s' "$discovery_runs" | jq -r '
            .workflow_runs[]
            | select((.event == "schedule" or .event == "workflow_dispatch") and .conclusion == "success")
            | .id')

          if [ -n "$upstream_run_id" ]; then
            gh workflow run genge-v311-event-driven-authority-handoff.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f discovery_run_id="$upstream_run_id"
            dispatch_path="REUSE_DISCOVERY_THEN_FULL_AUTHORITY_CHAIN"
          else
            all_discovery_runs=$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-opportunity-discovery.yml/runs?per_page=30")
            discovery_active=$(printf '%s' "$all_discovery_runs" | jq '[
              .workflow_runs[]
              | select((.event == "schedule" or .event == "workflow_dispatch")
                       and (.status == "queued" or .status == "in_progress"))
            ] | length')
            if [ "$discovery_active" -gt 0 ]; then
              echo "No reusable artifact and a production Discovery scan is already active; defer."
              echo "dispatched=false" >> "$GITHUB_OUTPUT"
              echo "deferred=true" >> "$GITHUB_OUTPUT"
              echo "dispatch_path=ACTIVE_DISCOVERY_DEFER" >> "$GITHUB_OUTPUT"
              echo "upstream_run_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh workflow run genge-v311-event-driven-authority-handoff.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
            dispatch_path="FULL_DISCOVERY_AND_AUTHORITY_FALLBACK"
          fi

          mkdir -p .event-driven-deep-review-cache
          cp reports/event_driven_deep_review/decision.json \
            .event-driven-deep-review-cache/decision.json
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          echo "dispatch_path=${dispatch_path}" >> "$GITHUB_OUTPUT"
          echo "upstream_run_id=${upstream_run_id}" >> "$GITHUB_OUTPUT"

      - name: Save exact-signal dispatch marker
        if: steps.dispatch.outputs.dispatched == 'true'
        uses: actions/cache/save@v4
        with:
          path: .event-driven-deep-review-cache
          key: genge-v311-event-deep-review-v2-${{ steps.decision.outputs.signal_digest }}

      - name: Upload trigger decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-event-driven-deep-review-${{ github.run_id }}
          path: reports/event_driven_deep_review/decision.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish event-driven summary
        if: always()
        run: |
          echo "# GenGe V3.1.1 Event-Driven Deep Review" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger codes: \`${{ steps.decision.outputs.trigger_codes }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- holding triggers: \`${{ steps.decision.outputs.holding_trigger_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- external triggers: \`${{ steps.decision.outputs.external_trigger_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- signal digest: \`${{ steps.decision.outputs.signal_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- duplicate signal cache hit: \`${{ steps.dedupe.outputs.cache-hit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- authority-chain dispatch: \`${{ steps.dispatch.outputs.dispatched }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dispatch path: \`${{ steps.dispatch.outputs.dispatch_path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reused All-A upstream run: \`${{ steps.dispatch.outputs.upstream_run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- deferred because another production research/handoff cycle is already active: \`${{ steps.dispatch.outputs.deferred }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- downstream: Every-Industry -> Production Finalizer -> Holding Continuity -> Hourly Refresh -> Operating Ledger" >> "$GITHUB_STEP_SUMMARY"
          echo "- holdings and external candidates share bounded urgent-signal triggers; ordinary priority alone does not trigger" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hourly/Learning remain research-only and can never authorize a Formal action" >> "$GITHUB_STEP_SUMMARY"
