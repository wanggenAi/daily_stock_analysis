name: GenGe V3.1.1 Event-Driven Deep Review

on:
  workflow_run:
    workflows:
      - "GenGe V3.1.1 Research Learning"
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-v311-event-driven-deep-review.yml"
      - "src/strategies/genge_opportunity_discovery/event_driven_deep_review_trigger.py"
      - "tests/test_genge_event_driven_deep_review_trigger.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: genge-v311-event-driven-deep-review
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  evaluate-and-dispatch:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install production-compatible trigger dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Validate event-driven trigger contract
        run: |
          python -m pytest -q tests/test_genge_event_driven_deep_review_trigger.py

      - name: Build event-driven Deep Review decision
        id: decision
        run: |
          set -euo pipefail
          python -m src.strategies.genge_opportunity_discovery.event_driven_deep_review_trigger \
            --priority data/research_priority/latest.json \
            --hourly data/hourly_research_state/latest.json \
            --output reports/event_driven_deep_review/decision.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          d = json.loads(Path('reports/event_driven_deep_review/decision.json').read_text(encoding='utf-8'))
          assert d['formal_action_source'] == 'FINALIZED_CANONICAL_ONLY'
          assert d['formal_action_recomputed'] is False
          assert d['formal_action_eligible'] is False
          assert d['direct_formal_action_change_allowed'] is False
          assert d['no_auto_trade'] is True
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f"dispatch_required={str(bool(d['dispatch_required'])).lower()}\n")
              out.write(f"signal_digest={d['signal_digest']}\n")
              out.write(f"trigger_codes={','.join(d['trigger_codes'])}\n")
              out.write(f"holding_trigger_count={d['holding_trigger_count']}\n")
              out.write(f"external_trigger_count={d['external_trigger_count']}\n")
          PY

      - name: Check durable exact-signal dispatch marker
        id: dedupe
        if: steps.decision.outputs.dispatch_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          marker_name="genge-v311-event-deep-review-marker-${{ steps.decision.outputs.signal_digest }}"
          markers=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker_name}&per_page=30")
          marker_count=$(printf '%s' "$markers" | jq '[.artifacts[] | select(.expired == false)] | length')

          if [ "$marker_count" -eq 0 ]; then
            echo "marker_hit=false" >> "$GITHUB_OUTPUT"
            echo "marker_state=none" >> "$GITHUB_OUTPUT"
            echo "finalizer_repair_source_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A marker is only an attempted dispatch. Exact-signal completion means
          # the successful Every-Industry source run has itself reached an
          # authoritative Canonical artifact. Research success without finalization
          # is repaired by dispatching the existing successful source run directly
          # to Production Finalizer; it must not force another heavy research cycle.
          industry_runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v31-industry-research.yml/runs?per_page=50")

          while IFS=$'\t' read -r marker_created marker_head_sha; do
            test -n "$marker_created" || continue
            test -n "$marker_head_sha" || continue

            success_run_id=$(printf '%s' "$industry_runs" | jq -r \
              --arg created "$marker_created" \
              --arg sha "$marker_head_sha" \
              '[.workflow_runs[]
                | select((.event == "workflow_dispatch" or .event == "workflow_run")
                         and .head_sha == $sha
                         and .created_at >= $created
                         and .conclusion == "success")
              ] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$success_run_id" ]; then
              authoritative_name="genge-v311-authoritative-canonical-${success_run_id}"
              authoritative=$(gh api -X GET \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${authoritative_name}&per_page=10")
              authoritative_count=$(printf '%s' "$authoritative" | jq '[.artifacts[] | select(.expired == false)] | length')
              if [ "$authoritative_count" -gt 0 ]; then
                echo "marker_hit=true" >> "$GITHUB_OUTPUT"
                echo "marker_state=downstream_finalized" >> "$GITHUB_OUTPUT"
                echo "finalizer_repair_source_run_id=" >> "$GITHUB_OUTPUT"
                echo "Exact signal already produced an Authorized Canonical; skip duplicate heavy research."
                exit 0
              fi

              finalizer_runs=$(gh api -X GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v311-production-finalizer.yml/runs?event=workflow_dispatch&per_page=30")
              active_finalizer=$(printf '%s' "$finalizer_runs" | jq '[
                .workflow_runs[]
                | select(.status == "queued" or .status == "in_progress")
              ] | length')
              if [ "$active_finalizer" -gt 0 ]; then
                echo "marker_hit=true" >> "$GITHUB_OUTPUT"
                echo "marker_state=finalizer_active_defer" >> "$GITHUB_OUTPUT"
                echo "finalizer_repair_source_run_id=${success_run_id}" >> "$GITHUB_OUTPUT"
                echo "A Production Finalizer is already active; defer exact-signal repair without restarting heavy research."
                exit 0
              fi

              gh workflow run genge-v311-production-finalizer.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f source_run_id="$success_run_id" \
                -f source_workflow="GenGe V3.1.1 Every-Industry Research"
              echo "marker_hit=true" >> "$GITHUB_OUTPUT"
              echo "marker_state=finalizer_repair_dispatched" >> "$GITHUB_OUTPUT"
              echo "finalizer_repair_source_run_id=${success_run_id}" >> "$GITHUB_OUTPUT"
              echo "Successful research lacked Authorized Canonical; dispatched Production Finalizer repair for source run ${success_run_id}."
              exit 0
            fi

            active_count=$(printf '%s' "$industry_runs" | jq \
              --arg created "$marker_created" \
              --arg sha "$marker_head_sha" \
              '[.workflow_runs[]
                | select((.event == "workflow_dispatch" or .event == "workflow_run")
                         and .head_sha == $sha
                         and .created_at >= $created
                         and (.status == "queued" or .status == "in_progress"))
              ] | length')
            if [ "$active_count" -gt 0 ]; then
              echo "marker_hit=true" >> "$GITHUB_OUTPUT"
              echo "marker_state=downstream_active" >> "$GITHUB_OUTPUT"
              echo "finalizer_repair_source_run_id=" >> "$GITHUB_OUTPUT"
              echo "Exact-signal downstream Every-Industry run is still active; skip duplicate heavy research."
              exit 0
            fi
          done < <(printf '%s' "$markers" | jq -r '
            .artifacts[]
            | select(.expired == false)
            | [.created_at, (.workflow_run.head_sha // "")]
            | @tsv')

          echo "marker_hit=false" >> "$GITHUB_OUTPUT"
          echo "marker_state=retryable_failed_or_abandoned" >> "$GITHUB_OUTPUT"
          echo "finalizer_repair_source_run_id=" >> "$GITHUB_OUTPUT"
          echo "Prior exact-signal dispatch marker exists but no matching successful/active Every-Industry run remains; allow retry."

      - name: Dispatch immediate production Deep Review
        id: dispatch
        if: >-
          steps.decision.outputs.dispatch_required == 'true' &&
          steps.dedupe.outputs.marker_hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Avoid parallel Deep Review storms. An active Every-Industry run will
          # itself reach Production Finalizer, so retry this exact signal on the
          # next Learning heartbeat instead of overlapping it.
          industry_runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v31-industry-research.yml/runs?per_page=30")
          active_industry=$(printf '%s' "$industry_runs" | jq '[
            .workflow_runs[]
            | select((.event == "workflow_dispatch" or .event == "workflow_run")
                     and (.status == "queued" or .status == "in_progress"))
          ] | length')
          if [ "$active_industry" -gt 0 ]; then
            echo "A production Every-Industry Deep Review is already active; defer this signal to the next research-learning heartbeat."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            echo "dispatch_path=ACTIVE_DEEP_REVIEW_DEFER" >> "$GITHUB_OUTPUT"
            echo "upstream_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fast path: hourly signals concern securities already present in the
          # current research/Canonical workset. Reuse the newest successful,
          # non-expired All-A production artifact and immediately execute the
          # existing full V3.1 Every-Industry Deep Review.
          discovery_runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-opportunity-discovery.yml/runs?status=success&per_page=30")
          upstream_run_id=""
          while IFS= read -r candidate_run_id; do
            test -n "$candidate_run_id" || continue
            artifacts=$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts")
            artifact_count=$(printf '%s' "$artifacts" | jq '[
              .artifacts[]
              | select(.name == "genge-all-a-production-report" and .expired == false)
            ] | length')
            if [ "$artifact_count" -gt 0 ]; then
              upstream_run_id="$candidate_run_id"
              break
            fi
          done < <(printf '%s' "$discovery_runs" | jq -r '
            .workflow_runs[]
            | select((.event == "schedule" or .event == "workflow_dispatch") and .conclusion == "success")
            | .id')

          if [ -n "$upstream_run_id" ]; then
            gh workflow run genge-v31-industry-research.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f upstream_run_id="$upstream_run_id" \
              -f explicit_finalizer=true
            dispatch_path="FAST_EXISTING_DISCOVERY_TO_FULL_V31_REVIEW"
          else
            # Fail-safe fallback: if no validated All-A artifact is available,
            # start normal production Discovery rather than weakening provenance.
            all_discovery_runs=$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-opportunity-discovery.yml/runs?per_page=30")
            discovery_active=$(printf '%s' "$all_discovery_runs" | jq '[
              .workflow_runs[]
              | select((.event == "schedule" or .event == "workflow_dispatch")
                       and (.status == "queued" or .status == "in_progress"))
            ] | length')
            if [ "$discovery_active" -gt 0 ]; then
              echo "No reusable artifact and a production Discovery scan is already active; defer."
              echo "dispatched=false" >> "$GITHUB_OUTPUT"
              echo "deferred=true" >> "$GITHUB_OUTPUT"
              echo "dispatch_path=ACTIVE_DISCOVERY_DEFER" >> "$GITHUB_OUTPUT"
              echo "upstream_run_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh workflow run genge-opportunity-discovery.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f run_legacy_report=false
            dispatch_path="FULL_DISCOVERY_FALLBACK"
          fi

          mkdir -p .event-driven-deep-review-marker
          cp reports/event_driven_deep_review/decision.json \
            .event-driven-deep-review-marker/decision.json
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          echo "dispatch_path=${dispatch_path}" >> "$GITHUB_OUTPUT"
          echo "upstream_run_id=${upstream_run_id}" >> "$GITHUB_OUTPUT"

      - name: Save durable exact-signal dispatch marker
        if: steps.dispatch.outputs.dispatched == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-event-deep-review-marker-${{ steps.decision.outputs.signal_digest }}
          path: .event-driven-deep-review-marker/decision.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload trigger decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-event-driven-deep-review-${{ github.run_id }}
          path: reports/event_driven_deep_review/decision.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish event-driven summary
        if: always()
        run: |
          echo "# GenGe V3.1.1 Event-Driven Deep Review" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger codes: \`${{ steps.decision.outputs.trigger_codes }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- holding triggers: \`${{ steps.decision.outputs.holding_trigger_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- external triggers: \`${{ steps.decision.outputs.external_trigger_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- signal digest: \`${{ steps.decision.outputs.signal_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- duplicate signal durable marker hit: \`${{ steps.dedupe.outputs.marker_hit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- durable marker state: \`${{ steps.dedupe.outputs.marker_state }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- finalizer repair source run: \`${{ steps.dedupe.outputs.finalizer_repair_source_run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- production dispatch: \`${{ steps.dispatch.outputs.dispatched }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dispatch path: \`${{ steps.dispatch.outputs.dispatch_path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reused All-A upstream run: \`${{ steps.dispatch.outputs.upstream_run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- deferred because another production research cycle is already active: \`${{ steps.dispatch.outputs.deferred }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- downstream authority: Every-Industry Research -> Production Finalizer" >> "$GITHUB_STEP_SUMMARY"
          echo "- exact-signal completion requires an authoritative Canonical artifact, not research success alone" >> "$GITHUB_STEP_SUMMARY"
          echo "- failed/cancelled exact-signal dispatches are retryable; successful-but-unfinalized research is repaired without restarting heavy research" >> "$GITHUB_STEP_SUMMARY"
          echo "- holdings and external candidates share the urgent-signal trigger bar; ordinary holding priority alone does not trigger" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hourly/Learning remain research-only and can never authorize a Formal action" >> "$GITHUB_STEP_SUMMARY"
