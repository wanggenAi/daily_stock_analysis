name: GenGe V3.1.1 Operating Ledger

on:
  workflow_run:
    workflows: ["GenGe V3.1.1 Production Finalizer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      finalizer_run_id:
        description: "Successful Production Finalizer run id"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: genge-v311-operating-ledger
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  persist-operating-ledger:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Finalizer run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FINALIZER_RUN_ID=${{ inputs.finalizer_run_id }}" >> "$GITHUB_ENV"
          else
            echo "FINALIZER_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          fi

      - name: Download finalized authoritative artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p finalized
          gh run download "$FINALIZER_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir finalized
          SNAPSHOT=$(find finalized -path '*/canonical_snapshot/latest.json' -print -quit)
          AUTH_ROOT=$(dirname "$(dirname "$SNAPSHOT")")
          test -n "$SNAPSHOT"
          test -f "$AUTH_ROOT/production_authority.json"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"
          echo "AUTH_ROOT=$AUTH_ROOT" >> "$GITHUB_ENV"

      - name: Run operating-state tests
        run: |
          python -m pytest -q \
            tests/test_genge_transaction_ledger.py \
            tests/test_genge_evidence_event_store.py \
            tests/test_genge_hourly_research_state.py \
            tests/test_genge_production_observability.py \
            tests/test_genge_research_mapping_coverage.py

      - name: Append immutable Formal Decision history
        run: |
          python -m src.strategies.genge_opportunity_discovery.formal_decision_history \
            --snapshot "$SNAPSHOT" \
            --history data/formal_decision_history/history.jsonl \
            --summary data/formal_decision_history/latest_summary.json

      - name: Build transaction-ledger holdings projection
        run: |
          python -m src.strategies.genge_opportunity_discovery.transaction_ledger \
            --ledger data/transactions/ledger.jsonl \
            --output data/transactions/holdings_projection.json

      - name: Build reviewed research mapping coverage
        run: |
          python -m src.strategies.genge_opportunity_discovery.research_mapping_coverage \
            --coverage-output data/research_mapping/coverage.json \
            --industry-csv-output data/research_mapping/company_industry_map.csv

      - name: Build production health dashboard
        run: |
          python -m src.strategies.genge_opportunity_discovery.production_status_dashboard \
            --authoritative-root "$AUTH_ROOT" \
            --main-sha "$(git rev-parse HEAD)" \
            --json-output data/production_status/latest.json \
            --md-output PRODUCTION_STATUS.md

      - name: Build production observability snapshot
        run: |
          python -m src.strategies.genge_opportunity_discovery.production_observability \
            --root . \
            --output data/production_observability/latest.json

      - name: Assert parallel-state boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/transactions/holdings_projection.json').read_text(encoding='utf-8'))
          m = json.loads(Path('data/research_mapping/coverage.json').read_text(encoding='utf-8'))
          assert p['production_source_of_truth'] is False
          assert p['migration_required_before_production_use'] is True
          assert p['no_auto_trade'] is True
          assert p['holding_count'] >= 0
          assert m['formal_action_eligible'] is False
          assert m['no_auto_trade'] is True
          assert m['mapping_policy'] == 'MISSING_APPLICABLE_MAPPING_IS_A_VISIBLE_RESEARCH_GAP_NOT_A_GUESS'
          assert m['applicability_policy'] == 'NOT_APPLICABLE_IS_NOT_A_COVERAGE_GAP'
          PY

      - name: Persist operating state to main
        run: |
          git config user.name "genge-v311-production-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add \
            data/formal_decision_history \
            data/transactions/holdings_projection.json \
            data/research_mapping \
            data/production_status/latest.json \
            data/production_observability/latest.json \
            PRODUCTION_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          sid=$(python - <<'PY'
          import json, os
          from pathlib import Path
          print(json.loads(Path(os.environ['SNAPSHOT']).read_text(encoding='utf-8'))['snapshot_id'])
          PY
          )
          git commit -m "Persist V3.1.1 operating ledger ${sid} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload operating ledger artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-v311-operating-ledger-${{ github.run_id }}
          path: |
            PRODUCTION_STATUS.md
            data/production_status
            data/production_observability
            data/formal_decision_history
            data/transactions/holdings_projection.json
            data/research_mapping
          if-no-files-found: warn
          retention-days: 30
