name: Diagnose V31 Revenue Quarter Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-v31-revenue-quarter-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install --prefer-binary -r .github/requirements-ci.txt --quiet
      - name: Trace candidate selection
        run: |
          python - <<'PY'
          import requests
          from src.strategies.genge_opportunity_discovery.evidence_collectors import multi_year_predictability as m
          url='https://static.cninfo.com.cn/finalpage/2026-04-30/1225257886.PDF'
          r=requests.get(url,headers=m.REQUEST_HEADERS,timeout=30); r.raise_for_status()
          text,method=m.extract_text_from_response(r.content,r.headers.get('Content-Type',''),url)
          original=m._choose_metric_candidate
          def traced(candidates,reasons):
              print('METHOD',method,'TEXT_LEN',len(text))
              print('CANDIDATES',[(p,{k:v for k,v in x.items() if k in ('value_yuan','raw_value','unit','unit_source','extraction_mode','excerpt')}) for p,x in candidates])
              print('REASONS',reasons)
              return original(candidates,reasons)
          m._choose_metric_candidate=traced
          print('FINAL',m._metric_measurement(text,m._METRIC_LABELS['revenue'],2025))
          PY
