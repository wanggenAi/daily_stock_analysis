name: Temporary Canonical Source Patch Runner

on:
  push:
    branches:
      - fix/canonical-holding-add-propagation-20260907
    paths:
      - .github/tmp_apply_canonical_holding_add_patch.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-holding-add-propagation-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requirements-ci.txt
      - name: Apply source patch
        run: python .github/tmp_apply_canonical_holding_add_patch.py
      - name: Targeted regression tests
        run: |
          python -m compileall -q src/strategies/genge_opportunity_discovery/canonical_snapshot.py
          python -m pytest -q tests/test_genge_canonical_snapshot.py tests/test_genge_canonical_holding_add_propagation.py
      - name: Commit source and tests only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/strategies/genge_opportunity_discovery/canonical_snapshot.py tests/test_genge_canonical_holding_add_propagation.py
          git commit -m "fix: preserve holding staged-add advisory in Canonical"
          git push origin HEAD:fix/canonical-holding-add-propagation-20260907
