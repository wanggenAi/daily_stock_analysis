name: GenGe Investor Decision Brief

on:
  workflow_run:
    workflows:
      - "GenGe V3.1.1 Hourly Deep Overlay"
      - "GenGe V3.1.1 Event-Driven Deep Review"
      - "GenGe Candidate Terminal Review"
    types: [completed]
  schedule:
    - cron: "20 8 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-investor-decision-dashboard.yml"
      - "src/strategies/genge_opportunity_discovery/investor_decision_dashboard.py"
      - "CURRENT_HOLDINGS.md"
      - "CURRENT_FUNDS.md"
      - "CURRENT_CAPITAL.json"
      - "data/hourly_deep_overlay/**"
      - "data/research_priority/**"
  pull_request:
    paths:
      - ".github/workflows/genge-investor-decision-dashboard.yml"
      - "src/strategies/genge_opportunity_discovery/investor_decision_dashboard.py"
      - "CURRENT_HOLDINGS.md"
      - "CURRENT_FUNDS.md"
      - "CURRENT_CAPITAL.json"
      - "tests/test_genge_investor_decision_dashboard.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: genge-investor-decision-dashboard
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  dashboard-contract:
    name: Investor dashboard contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test investor-facing decision and capital contract
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
          python -m pytest -q tests/test_genge_investor_decision_dashboard.py

  publish-investor-brief:
    name: Publish investor decision brief
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: dashboard-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve brief mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mode="MANUAL"
          [ "$EVENT_NAME" = "schedule" ] && mode="DAILY"
          [ "$EVENT_NAME" = "push" ] && mode="PRODUCTION_REFRESH"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            case "$TRIGGER_WORKFLOW" in
              "GenGe V3.1.1 Hourly Deep Overlay") mode="HOURLY" ;;
              "GenGe V3.1.1 Event-Driven Deep Review") mode="EVENT" ;;
              "GenGe Candidate Terminal Review") mode="TERMINAL_REFRESH" ;;
              *) mode="FOLLOWUP" ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "trigger_run_id=${TRIGGER_RUN_ID:-}" >> "$GITHUB_OUTPUT"

      - name: Locate latest successful authorized Canonical
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf incoming-authority; mkdir incoming-authority
          runs=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-v311-production-finalizer.yml/runs?status=success&per_page=40")
          selected=""
          for run_id in $(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.conclusion == "success") | .id'); do
            artifacts=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")
            if [ "$(printf '%s' "$artifacts" | jq '[.artifacts[] | select(.expired == false and (.name | startswith("genge-v311-authoritative-canonical-")))] | length')" -gt 0 ]; then
              selected="$run_id"; break
            fi
          done
          test -n "$selected"
          gh run download "$selected" --repo "$GITHUB_REPOSITORY" --dir incoming-authority
          canonical=$(find incoming-authority -path '*/canonical_snapshot/latest.json' -print -quit)
          authority=$(find incoming-authority -name production_authority.json -print -quit)
          test -n "$canonical"; test -n "$authority"
          CANONICAL="$canonical" AUTHORITY="$authority" python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path(os.environ['AUTHORITY']).read_text(encoding='utf-8'))
          c=json.loads(Path(os.environ['CANONICAL']).read_text(encoding='utf-8'))
          assert a['authorized'] is True
          assert a['canonical_snapshot_id'] == c['snapshot_id']
          assert str(a['canonical_source_run_id']) == str(c['source_run_id'])
          PY
          echo "CANONICAL=$canonical" >> "$GITHUB_ENV"
          echo "FINALIZER_RUN_ID=$selected" >> "$GITHUB_ENV"

      - name: Download latest usable Terminal BUY WAIT_PRICE REJECT truth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf incoming-terminal; mkdir incoming-terminal
          selected=""
          runs=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-candidate-terminal-review.yml/runs?status=success&per_page=40")
          for run_id in $(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.conclusion == "success") | .id'); do
            artifacts=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")
            if [ "$(printf '%s' "$artifacts" | jq '[.artifacts[] | select(.expired == false and .name == "genge-candidate-terminal-decisions")] | length')" -gt 0 ]; then
              selected="$run_id"; break
            fi
          done
          if [ -n "$selected" ]; then
            gh run download "$selected" --repo "$GITHUB_REPOSITORY" --name genge-candidate-terminal-decisions --dir incoming-terminal
          fi
          terminal=$(find incoming-terminal -name candidate_terminal_decisions.csv -print -quit || true)
          summary=$(find incoming-terminal -name candidate_terminal_summary.json -print -quit || true)
          echo "TERMINAL_DECISIONS=${terminal}" >> "$GITHUB_ENV"
          echo "TERMINAL_SUMMARY=${summary}" >> "$GITHUB_ENV"
          echo "TERMINAL_RUN_ID=${selected}" >> "$GITHUB_ENV"

      - name: Download latest full-A market context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf incoming-market; mkdir incoming-market
          selected=""
          runs=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-opportunity-discovery.yml/runs?status=success&per_page=40")
          for run_id in $(printf '%s' "$runs" | jq -r '.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and .conclusion == "success") | .id'); do
            artifacts=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")
            if [ "$(printf '%s' "$artifacts" | jq '[.artifacts[] | select(.expired == false and .name == "genge-all-a-production-report")] | length')" -gt 0 ]; then selected="$run_id"; break; fi
          done
          [ -z "$selected" ] || gh run download "$selected" --repo "$GITHUB_REPOSITORY" --dir incoming-market
          echo "MARKET_REGIME=$(find incoming-market -name market_regime.json -print -quit || true)" >> "$GITHUB_ENV"
          echo "INDUSTRY_REGIMES=$(find incoming-market -name industry_regimes.csv -print -quit || true)" >> "$GITHUB_ENV"

      - name: Download event context when applicable
        if: steps.mode.outputs.mode == 'EVENT'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ steps.mode.outputs.trigger_run_id }}
        run: |
          rm -rf incoming-event; mkdir incoming-event
          [ -z "${TRIGGER_RUN_ID:-}" ] || gh run download "$TRIGGER_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir incoming-event || true
          echo "EVENT_DECISION=$(find incoming-event -name decision.json -print -quit || true)" >> "$GITHUB_ENV"

      - name: Build and persist investor-first action dashboard
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "genge-investor-brief-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main; git reset --hard origin/main
            args=(--canonical "$CANONICAL" --holdings CURRENT_HOLDINGS.md --funds CURRENT_FUNDS.md --capital CURRENT_CAPITAL.json
                  --json-output data/investor_decision_dashboard/latest.json --markdown-output INVESTOR_DECISION_DASHBOARD.md --mode "$MODE")
            [ -z "${TERMINAL_DECISIONS:-}" ] || [ ! -s "$TERMINAL_DECISIONS" ] || args+=(--terminal-decisions "$TERMINAL_DECISIONS")
            [ ! -s data/hourly_deep_overlay/latest.json ] || args+=(--hourly data/hourly_deep_overlay/latest.json)
            [ ! -s data/research_priority/latest.json ] || args+=(--research-priority data/research_priority/latest.json)
            [ -z "${MARKET_REGIME:-}" ] || [ ! -s "$MARKET_REGIME" ] || args+=(--market-regime "$MARKET_REGIME")
            [ -z "${INDUSTRY_REGIMES:-}" ] || [ ! -s "$INDUSTRY_REGIMES" ] || args+=(--industry-regimes "$INDUSTRY_REGIMES")
            [ -z "${EVENT_DECISION:-}" ] || [ ! -s "$EVENT_DECISION" ] || args+=(--event-decision "$EVENT_DECISION")
            python -m src.strategies.genge_opportunity_discovery.investor_decision_dashboard "${args[@]}"
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/investor_decision_dashboard/latest.json').read_text(encoding='utf-8'))
          assert p['formal_action_source'] == 'FINALIZED_CANONICAL_ONLY'
          assert p['formal_action_recomputed'] is False and p['no_auto_trade'] is True
          assert p['presentation_contract']['section_order'][:6] == ['market','stock_portfolio','terminal_buy_now','terminal_wait_price','capital_deployment','final_operation_table']
          c=p['capital_deployment']; assert c['automatic_order_allowed'] is False and c['no_auto_trade'] is True
          assert c['planned_immediate_cash_cny'] <= c['deployment_budget_cny'] <= c['available_cash_cny']
          assert all(x['source'] in {'AUTHORIZED_CANONICAL_HOLDING_ACTION','TERMINAL_FORMAL_BUY_MIRROR'} for x in c['operations'])
          assert all(x['action']=='WAIT_PRICE' and x['immediate_execution_eligible'] is False for x in c['wait_price_reservations'])
          PY
            git add -f data/investor_decision_dashboard/latest.json; git add INVESTOR_DECISION_DASHBOARD.md
            if git diff --cached --quiet; then break; fi
            git commit -m "Persist investor decision brief [skip ci]"
            if git push origin HEAD:main; then break; fi
            [ "$attempt" -lt 4 ] || exit 1
          done

      - name: Publish investor-first summary
        if: always()
        run: |
          if [ -f INVESTOR_DECISION_DASHBOARD.md ]; then cat INVESTOR_DECISION_DASHBOARD.md >> "$GITHUB_STEP_SUMMARY"; else echo "本轮未生成可用投资摘要" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload investor decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-investor-decision-brief-${{ github.run_id }}
          path: |
            INVESTOR_DECISION_DASHBOARD.md
            data/investor_decision_dashboard/latest.json
          if-no-files-found: warn
          retention-days: 30
