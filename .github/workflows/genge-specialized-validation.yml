name: GenGe Specialized Valuation Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-specialized-validation.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Syntax
        run: |
          python -m py_compile \
            src/strategies/genge_opportunity_discovery/specialized_valuation_execution.py \
            tests/test_genge_specialized_valuation_execution.py
      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_genge_specialized_valuation_execution.py \
            tests/test_genge_capital_markets_valuation.py \
            tests/test_genge_valuation_model_routing.py \
            tests/test_genge_valuation_research_long_term_runner.py
