name: V3.1 PIT 48-stock stress audit

# Frozen broad-sample audit. Do not tune symbols or V3.1 thresholds after first result.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v31_pit_stress_48.py'
      - 'scripts/v31_pit_sector_backtest.py'
      - 'scripts/v31_pit_sector_backtest_resilient.py'
      - '.github/workflows/v31-pit-stress-48.yml'
  pull_request:
    paths:
      - 'scripts/v31_pit_stress_48.py'
      - 'scripts/v31_pit_sector_backtest.py'
      - 'scripts/v31_pit_sector_backtest_resilient.py'
      - '.github/workflows/v31-pit-stress-48.yml'

permissions:
  contents: read

jobs:
  stress-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'akshare>=1.12.0' 'pandas>=2.0.0' 'numpy>=1.24.0' tabulate 'yfinance>=0.2.0'
      - name: Run frozen 48-stock V3.1 PIT stress audit
        working-directory: scripts
        run: python v31_pit_stress_48.py
      - name: Upload full stress audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-pit-stress-48
          path: scripts/artifacts/v31_pit_stress_48/
          if-no-files-found: warn
