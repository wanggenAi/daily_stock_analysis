name: GenGe Long Term Second Pass

on:
  workflow_run:
    workflows: ["GenGe Opportunity Discovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Opportunity Discovery run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  long-term-second-pass:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Resolve upstream run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_RUN_ID=${{ inputs.upstream_run_id }}" >> "$GITHUB_ENV"
          fi
      - name: Download All-A production report
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}
      - name: Test long-term second pass
        run: python -m pytest -q tests/test_genge_long_term_second_pass.py
      - name: Build long-term second-pass candidates
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_second_pass \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/long_term_second_pass
      - name: Validate second-pass contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('reports/long_term_second_pass')
          rows = list(csv.DictReader((root/'long_term_second_pass_candidates.csv').open(encoding='utf-8')))
          summary = json.loads((root/'long_term_second_pass_summary.json').read_text(encoding='utf-8'))
          assert len(rows) == summary['candidate_count']
          for row in rows:
              assert row['formal_signal_eligible'] == 'False'
              assert row['automatic_promotion_allowed'] == 'False'
              assert row['requires_valuation_review'] == 'True'
              assert row['requires_fundamental_review'] == 'True'
              assert row['medium_horizon_exit_profile_limitation'] == 'True'
              assert not str(row.get('hard_blockers') or '').strip()
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish second-pass summary
        if: always()
        run: |
          if [ -f reports/long_term_second_pass/long_term_second_pass.md ]; then
            cat reports/long_term_second_pass/long_term_second_pass.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload second-pass report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-long-term-second-pass
          path: reports/long_term_second_pass
          if-no-files-found: error
