name: GenGe V3.1.1 Current-Main Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genge-v31-current-main-dispatch-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Finalizer for completed refreshed Every-Industry run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run genge-v311-production-finalizer.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f source_run_id=33134227778 \
            -f source_workflow="GenGe V3.1.1 Every-Industry Research"
          echo "Dispatched production Finalizer for successful Every-Industry run 33134227778."

# Finalizer dispatch marker: 2026-08-28 refreshed production cycle.
