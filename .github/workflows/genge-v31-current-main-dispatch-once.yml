name: GenGe V3.1.1 Current-Main Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genge-v31-current-main-dispatch-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Validate native Candidate Terminal on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESEARCH_RUN_ID: "34121720531"
          FINALIZER_RUN_ID: "34123280521"
        shell: bash
        run: |
          set -euo pipefail

          before="$(gh run list \
            --repo "$REPO" \
            --workflow genge-candidate-terminal-review.yml \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId' | tr '\n' ' ')"

          gh workflow run genge-candidate-terminal-review.yml \
            --repo "$REPO" \
            --ref main \
            -f research_run_id="$RESEARCH_RUN_ID" \
            -f finalizer_run_id="$FINALIZER_RUN_ID"

          run_id=""
          for _ in $(seq 1 60); do
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if ! grep -qw "$candidate" <<<"$before"; then
                run_id="$candidate"
                break
              fi
            done < <(gh run list \
              --repo "$REPO" \
              --workflow genge-candidate-terminal-review.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId')
            [ -n "$run_id" ] && break
            sleep 2
          done

          [ -n "$run_id" ] || { echo "Unable to resolve Candidate Terminal run" >&2; exit 1; }
          echo "# Current-main Candidate Terminal validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- research: $RESEARCH_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- authoritative Finalizer: $FINALIZER_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate Terminal: $run_id" >> "$GITHUB_STEP_SUMMARY"
          echo "CANDIDATE_TERMINAL_RUN_ID=$run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 5

          echo "Native Candidate Terminal completed successfully on current main."

# Post-#106 runtime validation marker: Every-Industry 34121720531 / Finalizer 34123280521.
