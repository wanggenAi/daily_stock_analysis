name: Optimize Opportunity Discovery Trigger Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-opportunity-trigger-once.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build optimized Opportunity Discovery workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/genge-opportunity-discovery.yml')
          text = path.read_text(encoding='utf-8')

          old_push = '''  push:\n    branches: [main]\n\npermissions:\n'''
          new_push = '''  push:\n    branches: [main]\n    paths:\n      - ".github/workflows/genge-opportunity-discovery.yml"\n      - ".github/requirements-ci.txt"\n      - "requirements.txt"\n      - "src/strategies/genge_opportunity_discovery/**"\n      - "config/**"\n      - "tests/**"\n\npermissions:\n'''
          if text.count(old_push) != 1:
              raise SystemExit('unexpected push trigger shape; refusing rewrite')
          text = text.replace(old_push, new_push, 1)

          expression = '$' + "{{ github.event_name == 'push' || github.event_name == 'pull_request' }}"
          old_cancel = '  cancel-in-progress: false\n\njobs:\n'
          new_cancel = (
              '  # Code-validation bursts only need the newest push/PR. Never cancel a scheduled\n'
              '  # or manually requested production research run.\n'
              f'  cancel-in-progress: {expression}\n\njobs:\n'
          )
          if text.count(old_cancel) != 1:
              raise SystemExit('unexpected concurrency cancel line; refusing rewrite')
          text = text.replace(old_cancel, new_cancel, 1)

          required = [
              'schedule:',
              'workflow_dispatch:',
              'push:',
              'src/strategies/genge_opportunity_discovery/**',
              'tests/**',
              "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'",
              'no_auto_trade',
              'no_broker_integration',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing preserved contract marker: {marker}')
          if '  push:\n    branches: [main]\n\npermissions:' in text:
              raise SystemExit('broad push trigger still present')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax and trigger contract
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/genge-opportunity-discovery.yml')
          text = path.read_text(encoding='utf-8')
          payload = yaml.safe_load(text)
          assert isinstance(payload, dict)
          assert 'jobs' in payload
          assert {'fixture-opportunity-smoke','daily-opportunity-report','all-a-production-report'} <= set(payload['jobs'])
          assert 'src/strategies/genge_opportunity_discovery/**' in text
          assert 'tests/**' in text
          assert 'cancel-in-progress:' in text
          assert "github.event_name == 'push'" in text
          assert "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'" in text
          PY

      - name: Stage validated workflow as ordinary blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .workflow_tmp
          cp .github/workflows/genge-opportunity-discovery.yml .workflow_tmp/genge-opportunity-discovery.yml
          git checkout -- .github/workflows/genge-opportunity-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow_tmp/genge-opportunity-discovery.yml
          git diff --cached --check
          git commit -m "Stage optimized Opportunity Discovery workflow [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
