name: TEMP 603055 Final Deep Validation

on:
  push:
    branches:
      - validation/final-603055-deep
    paths:
      - ".github/workflows/tmp-final-603055-deep.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 603055 through formal production Deep workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run genge-v31-deep-calculation-lambda.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f requested_codes=603055 \
            -f trigger_source=FINAL_ACCEPTANCE_603055
