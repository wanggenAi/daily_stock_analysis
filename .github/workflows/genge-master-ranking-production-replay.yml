name: GenGe Master Ranking Production Replay

on:
  push:
    branches: ["agent/master-ranking-postscan-integration"]
    paths:
      - ".github/workflows/genge-master-ranking-production-replay.yml"
      - "src/strategies/genge_opportunity_discovery/master_opportunity_ranking.py"
      - "tests/test_genge_master_opportunity_ranking.py"
      - "docs/GENGE_MASTER_RANKING_REPLAY_TRIGGER.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Run Master Ranking tests
        run: python -m pytest -q tests/test_genge_master_opportunity_ranking.py

      - name: Download validated canonical Postscan artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-postscan-research
          path: upstream_postscan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "32102437218"

      - name: Build Master Opportunity Ranking
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.master_opportunity_ranking \
            --industry-coverage upstream_postscan/industry_coverage \
            --valuation-root upstream_postscan/valuation_research_queue \
            --long-term-formal-buy upstream_postscan/long_term_formal_buy \
            --output-dir reports/master_opportunity

      - name: Validate production replay contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('reports/master_opportunity')
          required = {
              'master_opportunity_ranking.csv',
              'every_industry_top5_enriched.csv',
              'actionable_long_term_candidates.csv',
              'master_opportunity_summary.json',
              'master_opportunity_ranking.md',
          }
          missing = sorted(name for name in required if not (root / name).exists())
          assert not missing, f'missing Master Ranking outputs: {missing}'

          summary = json.loads((root / 'master_opportunity_summary.json').read_text(encoding='utf-8'))
          master = list(csv.DictReader((root / 'master_opportunity_ranking.csv').open(encoding='utf-8')))
          industry = list(csv.DictReader((root / 'every_industry_top5_enriched.csv').open(encoding='utf-8')))
          actionable = list(csv.DictReader((root / 'actionable_long_term_candidates.csv').open(encoding='utf-8')))

          assert summary['ranking_semantics'] == 'research_priority_not_trade_score'
          assert summary['no_auto_trade'] is True
          assert summary['formal_signal_eligible'] is False
          assert summary['automatic_promotion_allowed'] is False
          assert summary['master_count'] == len(master)
          assert summary['industry_map_count'] == len(industry)
          assert summary['actionable_long_term_count'] == len(actionable)
          assert summary['represented_industry_count'] >= 80
          assert summary['clean_industry_count'] >= 80
          assert len(master) >= 350

          master_by_code = {row['code']: row for row in master}
          actionable_codes = {row['code'] for row in actionable}
          assert '603369' in master_by_code
          assert master_by_code['603369']['long_term_classification'] == 'LONG_TERM_BUY_READY'
          assert '603369' in actionable_codes
          assert '688687' in master_by_code
          assert master_by_code['688687']['long_term_classification'] == 'LONG_TERM_REVIEW_BLOCKED'
          assert '688687' not in actionable_codes
          assert all(row.get('no_auto_trade') == 'True' for row in master)
          assert all(row.get('no_auto_trade') == 'True' for row in actionable)

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print('actionable_codes=', sorted(actionable_codes))
          PY

      - name: Publish replay summary
        if: always()
        run: |
          if [ -f reports/master_opportunity/master_opportunity_ranking.md ]; then
            cat reports/master_opportunity/master_opportunity_ranking.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Master Ranking replay artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-master-ranking-production-replay
          path: reports/master_opportunity
          if-no-files-found: error
