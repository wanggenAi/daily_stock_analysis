name: GenGe V2 Clean A-Share Decision

on:
  workflow_dispatch:
    inputs:
      skip_full_scan:
        description: "Skip fresh full-A scan and rebuild from committed fallback only"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "20 0 * * 1-5"
    - cron: "20 7 * * 1-5"
  push:
    branches:
      - main
      - "v2-*"
    paths:
      - "stock_v2/**"
      - "tests/test_stock_v2.py"
      - ".github/workflows/genge-v2-clean.yml"
      - "V2_README.md"

permissions:
  contents: write

concurrency:
  group: genge-v2-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: V2 unit tests
        run: python -m unittest tests.test_stock_v2 -v

      - name: Fresh all-A facts and price plans
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_full_scan != true }}
        timeout-minutes: 102
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout --signal=TERM 100m \
          python -m stock_v2.all_a_runner \
            --max-workers 12 \
            --evidence-queue-size 80 \
            --deep-review-size 30 \
            --max-watchlist 15 \
            --fundamental-limit 30 \
            --industry-evidence-file data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence-file data/user_supplied/company_cycle_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --exit-profile-file data/opportunity_snapshots/exit_profile.csv

      - name: Build single-truth V2 dashboard
        run: python -m stock_v2.pipeline --top 30 --industry-cap 3

      - name: Validate V2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/v2/latest_run.json").read_text(encoding="utf-8"))
          assert str(payload["schema_version"]).startswith("v2."), payload["schema_version"]
          assert payload["source"]["mode"] == "LIVE_SCAN", payload["source"]
          assert payload["source"].get("degraded") is False, payload["source"]
          assert payload["stats"]["visible_pool"] >= 10, payload["stats"]
          assert len(payload["candidates"]) == payload["stats"]["visible_pool"]
          assert all(row["state"] in {"BUY", "NEAR_BUY", "WATCH"} for row in payload["candidates"])
          assert "global" in payload["market"]
          assert Path("V2_DASHBOARD.md").exists()
          print(json.dumps(payload["stats"], ensure_ascii=False))
          PY

      - name: Persist only V2 investor outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/genge-v2/data/v2
          cp V2_DASHBOARD.md /tmp/genge-v2/V2_DASHBOARD.md
          cp data/v2/latest_run.json /tmp/genge-v2/data/v2/latest_run.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "V2 persist attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/genge-v2/V2_DASHBOARD.md V2_DASHBOARD.md
            mkdir -p data/v2
            cp /tmp/genge-v2/data/v2/latest_run.json data/v2/latest_run.json
            git add V2_DASHBOARD.md data/v2/latest_run.json
            if git diff --cached --quiet; then
              echo "No V2 output change"
              exit 0
            fi
            git commit -m "Persist GenGe V2 clean decision output [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
          done
          echo "V2 output persistence failed after optimistic retries" >&2
          exit 1
