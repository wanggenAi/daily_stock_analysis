name: GenGe Jev Shadow Evaluation

run-name: >-
  GenGe Jev Shadow Evaluation / ${{ inputs.continuation_deep_run_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      continuation_deep_run_id:
        description: 'Optional exact Deep run id when this evaluation continues an autonomous research cycle'
        required: false
        type: string
      scope:
        description: 'Which persisted stock states should Jev inspect?'
        required: true
        default: combined
        type: choice
        options:
          - combined
          - holdings
          - unresolved
      max_entities:
        description: 'Maximum entities for this shadow experiment'
        required: true
        default: '25'
        type: choice
        options:
          - '4'
          - '10'
          - '25'
          - '50'
          - '100'
  pull_request:
    paths:
      - 'src/strategies/genge_opportunity_discovery/jev_shadow.py'
      - 'src/strategies/genge_opportunity_discovery/jev_routing_bridge.py'
      - 'tools/run_jev_shadow.py'
      - 'tools/build_jev_routing_bridge.py'
      - 'tests/test_jev_shadow.py'
      - 'tests/test_jev_routing_bridge.py'
      - '.github/workflows/genge-jev-shadow-evaluation.yml'
      - 'docs/JEV_SHADOW_DECISION_LAYER.md'
      - 'docs/JEV_ROUTING_BRIDGE.md'
  push:
    branches: [main]
    paths:
      - 'src/strategies/genge_opportunity_discovery/jev_shadow.py'
      - 'src/strategies/genge_opportunity_discovery/jev_routing_bridge.py'
      - 'tools/run_jev_shadow.py'
      - 'tools/build_jev_routing_bridge.py'
      - 'tests/test_jev_shadow.py'
      - 'tests/test_jev_routing_bridge.py'
      - '.github/workflows/genge-jev-shadow-evaluation.yml'
      - 'docs/JEV_SHADOW_DECISION_LAYER.md'
      - 'docs/JEV_ROUTING_BRIDGE.md'
      - 'data/research_priority/**'

concurrency:
  group: genge-jev-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies and pinned TypeSafe SDK
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install -r .github/requirements-ci.txt
          python -m pip install 'typesafe-sdk==0.7.0'
      - name: Validate TypeSafe SDK surface without network
        shell: bash
        run: |
          python - <<'PY'
          from typesafe_sdk import Choice, Noul, TypeSafeClient

          yes_no = Noul(instructions="Is more verified evidence required?")
          route = Choice(
              instructions="Choose a research route.",
              criteria={"NO_ESCALATION": None, "EVIDENCE_REFRESH": None},
          )
          assert yes_no.type == "noul"
          assert route.type == "choice"
          assert set(route.criteria) == {"NO_ESCALATION", "EVIDENCE_REFRESH"}
          client = TypeSafeClient(
              api_key="contract-test-not-a-real-key",
              model="jev-latest",
              timeout=3.0,
          )
          client.close()
          PY
      - name: Validate Jev runner entrypoints and advisory guardrails without network
        run: |
          python tools/run_jev_shadow.py --help > /dev/null
          python tools/build_jev_routing_bridge.py --help > /dev/null
          python -m pytest -q tests/test_jev_shadow.py tests/test_jev_routing_bridge.py

  live-shadow:
    # Same-repository PRs get a bounded live smoke. Fork PRs never receive the secret
    # and are excluded explicitly rather than relying only on GitHub secret behavior.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      JEV_ENABLED: 'true'
      JEV_SHADOW_MODE: 'true'
      JEV_MODEL: 'jev-latest'
      JEV_TIMEOUT_SECONDS: '3'
      JEV_MAX_RETRIES: '1'
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned TypeSafe SDK
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install 'typesafe-sdk==0.7.0'
      - name: Run Jev shadow evaluation
        run: |
          python tools/run_jev_shadow.py \
            --scope '${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'combined' }}' \
            --max-entities '${{ github.event_name == 'workflow_dispatch' && inputs.max_entities || github.event_name == 'push' && '25' || '4' }}' \
            --output-dir .artifacts/jev-shadow \
            --require-success
      - name: Build Jev advisory routing bridge
        run: |
          python tools/build_jev_routing_bridge.py \
            --shadow-json .artifacts/jev-shadow/jev_shadow.json \
            --output-json .artifacts/jev-shadow/jev_routing.json \
            --output-md .artifacts/jev-shadow/jev_routing.md \
            --require-success
      - name: Publish Jev shadow summary
        if: always()
        shell: bash
        run: |
          if [[ -f .artifacts/jev-shadow/jev_shadow.md ]]; then
            cat .artifacts/jev-shadow/jev_shadow.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# GenGe Jev Shadow Decision Layer' >> "$GITHUB_STEP_SUMMARY"
            echo 'No shadow artifact was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Jev shadow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-jev-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/jev-shadow/
          if-no-files-found: warn
          retention-days: 30

  persist-routing-advisory:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: live-shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download this run's Jev artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-jev-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/jev-shadow

      - name: Stamp exact Jev workflow lineage
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          CONTINUATION_DEEP_RUN_ID: ${{ inputs.continuation_deep_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          for name in ('jev_shadow.json', 'jev_routing.json'):
              path = Path('/tmp/jev-shadow') / name
              payload = json.loads(path.read_text(encoding='utf-8'))
              payload['source_workflow_run_id'] = str(os.environ['SOURCE_RUN_ID'])
              payload['source_workflow_run_attempt'] = str(os.environ['SOURCE_RUN_ATTEMPT'])
              payload['source_workflow_head_sha'] = str(os.environ['SOURCE_HEAD_SHA'])
              payload['source_workflow_event'] = str(os.environ['SOURCE_EVENT'])
              continuation_deep_run_id = str(os.environ.get('CONTINUATION_DEEP_RUN_ID') or '').strip()
              if continuation_deep_run_id.isdigit():
                  payload['continuation_from_deep_run_id'] = continuation_deep_run_id
              path.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Validate persisted advisory contract
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s /tmp/jev-shadow/jev_shadow.json
          test -s /tmp/jev-shadow/jev_routing.json
          test -s /tmp/jev-shadow/jev_routing.md
          python - <<'PY'
          import json, os
          from pathlib import Path

          shadow=json.loads(Path('/tmp/jev-shadow/jev_shadow.json').read_text(encoding='utf-8'))
          routing=json.loads(Path('/tmp/jev-shadow/jev_routing.json').read_text(encoding='utf-8'))

          assert shadow['source_workflow_run_id'] == os.environ['SOURCE_RUN_ID']
          assert routing['source_workflow_run_id'] == os.environ['SOURCE_RUN_ID']

          assert shadow['execution_status'] == 'SUCCESS'
          assert shadow['authority'] == 'SHADOW_ONLY'
          assert shadow['formal_trading_authority'] is False
          assert shadow['mutates_authoritative_decision'] is False
          assert shadow['unknown_is_pass'] is False
          assert shadow['no_auto_trade'] is True

          assert routing['contract'] == 'GEN_GE_JEV_ROUTING_BRIDGE_V1'
          assert routing['execution_status'] == 'SUCCESS'
          assert routing['authority'] == 'ADVISORY_RESEARCH_ROUTING_ONLY'
          assert routing['automatic_dispatch_allowed'] is False
          assert routing['automatic_formal_buy_allowed'] is False
          assert routing['formal_trading_authority'] is False
          assert routing['mutates_authoritative_decision'] is False
          assert routing['may_suppress_existing_research'] is False
          assert routing['may_create_or_mutate_formal_action'] is False
          assert routing['unknown_is_pass'] is False
          assert routing['no_auto_trade'] is True
          PY

      - name: Persist latest Jev advisory with optimistic replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'genge-jev-routing-bot'
          git config user.email '31836791+wanggenAi@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/jev_shadow
            cp /tmp/jev-shadow/jev_shadow.json data/jev_shadow/latest.json
            cp /tmp/jev-shadow/jev_routing.json data/jev_shadow/latest_routing.json
            cp /tmp/jev-shadow/jev_routing.md JEV_RESEARCH_ROUTING.md
            git add -f data/jev_shadow/latest.json data/jev_shadow/latest_routing.json
            git add JEV_RESEARCH_ROUTING.md
            if git diff --cached --quiet; then
              echo 'Latest Jev advisory is already persisted.'
              exit 0
            fi
            git commit -m 'Persist Jev research routing advisory [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'main moved while persisting Jev advisory; replaying.' >&2
          done
          echo 'Jev advisory persistence failed after 4 optimistic replay attempts.' >&2
          exit 1

      - name: Dispatch deterministic research orchestrator for persisted Jev lineage
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/genge-jev-research-orchestrator.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs[] | select(.display_title == \"GenGe Jev Research Orchestrator / $SOURCE_RUN_ID\") | .id" \
              | head -1
          )"
          if [ -n "$existing" ]; then
            echo "Deterministic orchestrator already exists for Jev source $SOURCE_RUN_ID: $existing"
            exit 0
          fi
          gh workflow run genge-jev-research-orchestrator.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_run_id="$SOURCE_RUN_ID" \
            -f max_dispatch=12

      - name: Publish persistence summary
        if: always()
        run: |
          echo '# Jev Research Routing Persistence' >> "$GITHUB_STEP_SUMMARY"
          echo '- source run: `${{ github.run_id }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- persisted: `data/jev_shadow/latest.json`, `data/jev_shadow/latest_routing.json`, `JEV_RESEARCH_ROUTING.md`' >> "$GITHUB_STEP_SUMMARY"
          echo '- authority: advisory research routing only; automatic dispatch=false; Formal authority unchanged; UNKNOWN != PASS; no_auto_trade=true' >> "$GITHUB_STEP_SUMMARY"
