name: V3.1 PIT sector backtest

# Locked-rule audit run. Do not tune strategy thresholds after seeing results.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v31_pit_sector_backtest.py'
      - '.github/workflows/v31-pit-sector-backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'akshare>=1.12.0' 'pandas>=2.0.0' 'numpy>=1.24.0' tabulate
      - name: Run V3.1 PIT test
        run: python scripts/v31_pit_sector_backtest.py
      - name: Upload full audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-pit-sector-backtest
          path: artifacts/v31_pit_backtest/
          if-no-files-found: warn
