name: GenGe Global Market Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/era_radar/global_market_pulse.py'
      - 'tools/run_global_market_pulse.py'
      - 'config/commodity_research_benchmarks.json'
      - '.github/workflows/genge-global-market-pulse.yml'
  pull_request:
    paths:
      - 'src/era_radar/global_market_pulse.py'
      - 'tools/run_global_market_pulse.py'
      - 'tests/test_global_market_pulse.py'
      - 'config/commodity_research_benchmarks.json'
      - '.github/workflows/genge-global-market-pulse.yml'

concurrency:
  group: genge-global-market-pulse-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install -r .github/requirements-ci.txt
      - name: Validate global pulse contracts without network
        run: |
          python -m pytest -q tests/test_global_market_pulse.py
      - name: Verify global clock safety contract
        run: |
          python - <<'PY'
          from src.era_radar.global_market_pulse import DEFAULT_INSTRUMENTS
          ids={row['id'] for row in DEFAULT_INSTRUMENTS}
          assert {'SP500','NASDAQ','VIX','US10Y','DXY','COPPER','WTI'} <= ids
          PY

  live-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install -r .github/requirements-ci.txt
      - name: Collect and persist global pulse with optimistic replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'genge-global-market-bot'
          git config user.email '31836791+wanggenAi@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            echo "Global pulse replay ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main

            set +e
            python tools/run_global_market_pulse.py | tee /tmp/global_market_pulse_result.json
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 2 ]; then
              echo 'Global pulse source coverage unavailable; refusing false-fresh publication.' >&2
              exit 1
            fi
            test "$rc" -eq 0
            test -f data/global_market_pulse/latest.json

            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/global_market_pulse/latest.json').read_text(encoding='utf-8'))
          assert p['contract_version'] == 'GEN_GE_GLOBAL_MARKET_PULSE_V1'
          assert p['clock'] == 'GLOBAL_MARKET_INDEPENDENT_OF_A_SHARE_CALENDAR'
          assert p['a_share_market_open_required'] is False
          assert p['coverage']['status'] in {'OK','PARTIAL'}
          assert p['formal_trading_authority'] is False
          assert p['formal_action_mutation_allowed'] is False
          assert p['automatic_promotion_allowed'] is False
          assert p['no_auto_trade'] is True
          PY

            git add -f data/global_market_pulse
            if git diff --cached --quiet; then
              echo 'No semantic global market change to persist.'
              exit 0
            fi

            git commit -m 'Persist global market pulse [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'main moved while persisting global pulse; replaying from newest main.' >&2
          done

          echo 'Global pulse persistence failed after 4 optimistic replay attempts.' >&2
          exit 1

      - name: Upload global pulse audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-market-pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/global_market_pulse_result.json
            data/global_market_pulse/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          echo '# GenGe Global Market Pulse' >> "$GITHUB_STEP_SUMMARY"
          echo '- schedule: hourly, every day; independent of A-share exchange holidays' >> "$GITHUB_STEP_SUMMARY"
          echo '- factors: US/global equities, volatility, US rates, USD/CNH, commodities, Asia/Europe, crypto risk appetite' >> "$GITHUB_STEP_SUMMARY"
          echo '- company transmission: only explicit evidence-backed commodity mappings are allowed' >> "$GITHUB_STEP_SUMMARY"
          echo '- authority: RESEARCH_ONLY; Formal action unchanged; no auto-trade' >> "$GITHUB_STEP_SUMMARY"
