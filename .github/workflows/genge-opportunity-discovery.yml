name: GenGe Opportunity Discovery

on:
  schedule:
    # 18:30 Beijing time on weekdays (10:30 UTC). Public data may still lag; reports audit gaps.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      run_legacy_report:
        description: "Also run the legacy opportunity report"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: genge-opportunity-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-opportunity-smoke:
    name: Fixture opportunity smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Run opportunity discovery tests
        run: |
          python -m pytest \
            tests/test_genge_opportunity_discovery_*.py \
            tests/test_genge_all_a_full_scan.py \
            tests/test_genge_real_world_signals.py

      - name: Run fixture opportunity CLI smoke
        run: |
          python -m src.strategies.genge_opportunity_discovery.cli \
            --codes 000001,000002 \
            --years 5 \
            --benchmark 000300 \
            --price-data-dir tests/fixtures/genge_cycle_bottom/prices \
            --valuation-data-dir tests/fixtures/genge_cycle_bottom/valuation \
            --financial-data-dir tests/fixtures/genge_cycle_bottom/financial \
            --stock-industry-map tests/fixtures/genge_cycle_bottom/stock_industry_map.csv \
            --industry-evidence-file tests/fixtures/genge_cycle_bottom/industry_evidence.csv \
            --company-evidence-file tests/fixtures/genge_cycle_bottom/company_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --as-of-date 2024-04-18 \
            --run-mode full \
            --auto-evidence-limit 0 \
            --output-dir reports/opportunity_discovery_ci_smoke \
            --forward-ledger-file reports/opportunity_discovery_ci_smoke/forward_observation_ledger.csv \
            --exit-profile-file reports/opportunity_discovery_ci_smoke/exit_profile.csv \
            --state-dir reports/opportunity_discovery_ci_smoke/state \
            --evidence-cache-dir reports/opportunity_discovery_ci_smoke/evidence_cache \
            --fixture-smoke-passed \
            --ci-passed

      - name: Validate fixture opportunity report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports/opportunity_discovery_ci_smoke")
          runs = sorted(path for path in root.iterdir() if path.is_dir() and (path / "daily_opportunity_report.json").exists())
          assert runs, "no opportunity discovery report directory generated"
          latest = runs[-1]
          payload = json.loads((latest / "daily_opportunity_report.json").read_text(encoding="utf-8"))
          summary = payload["summary"]
          run_mode = summary.get("run_mode")
          required = [
              "quant_screen_all.csv",
              "priority_research_queue.csv",
              "secondary_research_queue.csv",
              "data_quality_audit.csv",
              "daily_opportunity_report.json",
          ]
          if run_mode in {"quant-evidence", "full"}:
              required.extend(
                  [
                      "tier_a_candidates.csv",
                      "tier_b_watchlist.csv",
                      "tier_c_evidence_incomplete.csv",
                      "evidence_gap_report.csv",
                      "evidence_inventory.csv",
                      "auto_evidence_audit.csv",
                      "industry_research_tasks.json",
                      "company_research_tasks.json",
                  ]
              )
          if run_mode == "full":
              required.append("forward_observation_ledger.csv")
          for filename in required:
              assert (latest / filename).exists(), f"missing {filename}"

          assert summary["no_auto_trade"] is True
          assert summary["no_broker_integration"] is True
          assert summary["acceptance_enum"] in {
              "FAIL_CURRENT_SNAPSHOT",
              "PASS_CURRENT_SNAPSHOT_PIPELINE_READY",
              "PASS_QUANT_RESEARCH_QUEUE_GENERATED",
              "PASS_EVIDENCE_TASKS_GENERATED",
              "PASS_AUTO_EVIDENCE_COLLECTION_READY",
              "PASS_OPPORTUNITY_DISCOVERY_RESEARCH_READY",
              "PASS_TIER_A_CANDIDATE_GENERATED",
              "PASS_FORWARD_OBSERVATION_READY",
          }
          PY

      - name: Upload fixture opportunity report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-opportunity-discovery-fixture-report
          path: reports/opportunity_discovery_ci_smoke
          if-no-files-found: warn

  daily-opportunity-report:
    name: Daily opportunity report
    if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Restore opportunity state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/opportunity_snapshots
            data/cache/opportunity_evidence
            data/cache/shenzhen_full_scan
            data/cache/genge_fundamentals
          key: genge-opportunity-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-opportunity-state-${{ runner.os }}-${{ github.ref_name }}-
            genge-opportunity-state-${{ runner.os }}-main-
            genge-opportunity-state-${{ runner.os }}-

      - name: Prepare opportunity state directories
        run: |
          mkdir -p data/opportunity_snapshots data/cache/opportunity_evidence data/cache/shenzhen_full_scan data/cache/genge_fundamentals
          if [ ! -s data/opportunity_snapshots/exit_profile.csv ]; then
            cp data/opportunity_snapshots/exit_profile_seed.csv data/opportunity_snapshots/exit_profile.csv
          fi

      - name: Run Shenzhen mainboard full scan
        run: |
          python -m src.strategies.genge_opportunity_discovery.shenzhen_full_scan \
            --max-workers 16 \
            --evidence-queue-size 80 \
            --deep-review-size 30 \
            --max-watchlist 12 \
            --fundamental-limit 30 \
            --industry-evidence-file data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence-file data/user_supplied/company_cycle_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --exit-profile-file data/opportunity_snapshots/exit_profile.csv

      - name: Validate Shenzhen full scan report
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("reports/shenzhen_full_scan")
          runs = sorted(path for path in root.iterdir() if path.is_dir() and (path / "run_summary.json").exists())
          assert runs, "no Shenzhen full scan report generated"
          latest = runs[-1]
          summary = json.loads((latest / "run_summary.json").read_text(encoding="utf-8"))
          required = [
              "shenzhen_universe.csv",
              "universe_exclusion_audit.csv",
              "shenzhen_quant_screen_all.csv",
              "sector_summary.csv",
              "technology_sector_screen.csv",
              "technology_sector_review.md",
              "top80_evidence_queue.csv",
              "top30_deep_review.csv",
              "buy_ready.csv",
              "near_ready.csv",
              "deep_watch.csv",
              "tomorrow_watchlist_top12.csv",
              "buy_sell_price_plan.csv",
              "buy_sell_price_plan.json",
              "evidence_review.md",
              "rejection_summary.csv",
              "run_summary.json",
              "tomorrow_watchlist.md",
          ]
          missing = [name for name in required if not (latest / name).exists()]
          assert not missing, f"missing report files: {missing}"
          assert summary["effective_scan_count"] > 100
          assert summary["actual_scanned_count"] == summary["effective_scan_count"]
          assert summary["data_fetch_failure_count"] == 0
          assert summary["listing_source"] == "SZSE ShowReport CATALOGID=1110 TABKEY=tab1" or summary[
              "listing_source"
          ].startswith("repository_snapshot:")
          assert summary["listing_fallback_age_days"] <= 7
          assert summary["industry_enrichment_status"] in {"OK", "SNAPSHOT_FALLBACK"}
          assert summary["industry_enriched_count"] > 1000
          assert summary["technology_core_count"] > 100
          assert summary["technology_extended_count"] > 0
          assert summary["industry_evidence_file"] == "data/user_supplied/industry_cycle_evidence.csv"
          assert summary["company_evidence_file"] == "data/user_supplied/company_cycle_evidence.csv"
          assert summary["price_adjustment"] == "unadjusted/tencent_kline"
          assert summary["no_auto_trade"] is True
          assert summary["no_broker_integration"] is True

          with (latest / "buy_sell_price_plan.csv").open(encoding="utf-8") as file:
              plans = list(csv.DictReader(file))
          with (latest / "top30_deep_review.csv").open(encoding="utf-8") as file:
              deep_rows = list(csv.DictReader(file))
          assert len(deep_rows) == 30
          assert all(row["actionability_score"] for row in deep_rows)
          assert all(row["industry_evidence_status"] for row in deep_rows)
          assert all(row["company_evidence_status"] for row in deep_rows)
          for row in plans:
              assert not row["code"].startswith("3"), row["code"]
              assert row["latest_trade_date"] <= summary["as_of_date"]
              if row["pullback_entry_low"]:
                  entry = float(row["pullback_entry_high"])
                  stop = float(row["pullback_stop_price"])
                  target = float(row["pullback_target_1"])
                  assert stop < float(row["pullback_entry_low"]) <= entry < target
                  assert float(row["pullback_real_reward_risk"]) == round((target - entry) / (entry - stop), 2)
              if row["breakout_trigger_price"]:
                  entry = float(row["breakout_trigger_price"])
                  stop = float(row["breakout_stop_price"])
                  target = float(row["breakout_target_1"])
                  assert stop < entry < target
                  assert float(row["breakout_real_reward_risk"]) == round((target - entry) / (entry - stop), 2)
              preferred = row["preferred_plan"]
              assert preferred in {"pullback", "breakout"}
              assert row["real_resistance_target_1"] == row[f"{preferred}_target_1"]
              assert row["real_resistance_target_2"] == row[f"{preferred}_target_2"]
              assert row["real_reward_risk_ratio"] == row[f"{preferred}_real_reward_risk"]
              if row["classification"] != "BUY_READY":
                  for key in (
                      "pullback_initial_position_pct",
                      "pullback_max_position_pct",
                      "breakout_initial_position_pct",
                      "breakout_max_position_pct",
                  ):
                      assert float(row[key] or 0) == 0.0, (row["code"], key)
          forbidden = ("必买", "必卖", "肯定上涨", "稳赚", "保证上涨", "确定买入", "自动下单")
          for path in latest.glob("*"):
              if path.suffix.lower() in {".md", ".csv", ".json"}:
                  text = path.read_text(encoding="utf-8")
                  assert not any(term in text for term in forbidden), path
          print(f"validated={latest}")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Save opportunity state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/opportunity_snapshots
            data/cache/opportunity_evidence
            data/cache/shenzhen_full_scan
            data/cache/genge_fundamentals
          key: genge-opportunity-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Shenzhen full scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-shenzhen-full-scan-report
          path: |
            reports/shenzhen_full_scan
            stock_pools/shenzhen_mainboard_a_full_*.csv
          if-no-files-found: warn

  all-a-production-report:
    name: All-A production research report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fixture-opportunity-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # longbridge 0.2.74 has a Linux wheel for 3.11; on 3.12 pip falls
          # back to a Rust source build that is incompatible with current runners.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      # The repository-wide offline suite already runs in the PR CI backend
      # gate.  Re-running it here delays (and has previously stalled) the
      # scheduled production scan before any market data is fetched.
      - name: Run production strategy tests
        run: |
          python -m pytest -q \
            tests/test_genge_opportunity_discovery_*.py \
            tests/test_genge_all_a_full_scan.py \
            tests/test_genge_live_exit_policy.py \
            tests/test_genge_real_world_signals.py

      - name: Restore all-A public-data cache and observation state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-
            genge-all-a-state-${{ runner.os }}-main-
            genge-all-a-state-${{ runner.os }}-

      - name: Prepare all-A research state
        run: |
          mkdir -p data/cache/all_a_full_scan data/cache/genge_fundamentals data/cache/opportunity_evidence
          mkdir -p data/opportunity_snapshots/all_a_state
          if [ ! -s data/opportunity_snapshots/exit_profile.csv ]; then
            cp data/opportunity_snapshots/exit_profile_seed.csv data/opportunity_snapshots/exit_profile.csv
          fi

      - name: Run unified all-A production scan with progress
        run: |
          PYTHONUNBUFFERED=1 timeout --signal=TERM 100m \
          python -m src.strategies.genge_opportunity_discovery.all_a_progress_runner \
            --max-workers 12 \
            --evidence-queue-size 80 \
            --deep-review-size 30 \
            --max-watchlist 15 \
            --fundamental-limit 30 \
            --industry-evidence-file data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence-file data/user_supplied/company_cycle_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --exit-profile-file data/opportunity_snapshots/exit_profile.csv

      - name: Validate all-A report contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("reports/all_a_full_scan")
          runs = sorted(path for path in root.iterdir() if path.is_dir() and (path / "run_summary.json").exists())
          assert runs, "no all-A production report generated"
          latest = runs[-1]
          summary = json.loads((latest / "run_summary.json").read_text(encoding="utf-8"))
          required = {
              "all_a_universe.csv", "universe_exclusion_audit.csv", "universe_source_audit.json",
              "board_distribution.csv", "price_mapping_audit.csv", "all_a_quant_screen.csv",
              "market_regime.json", "industry_regimes.csv", "real_world_signal_audit.csv",
              "top80_evidence_queue.csv", "active_signal_review_queue.csv",
              "exit_profile_exploration_queue.csv",
              "top30_deep_review.csv", "strict_gate_audit.csv", "strict_review_ready.csv",
              "condition_watch.csv", "research_watch.csv", "tomorrow_watchlist.csv",
              "daily_candidate_top5.csv", "daily_candidate_top5.md",
              "exit_profile_validation_reference.csv",
              "daily_signals.csv", "daily_signals.json", "daily_signals.md",
              "buy_signals.csv", "sell_signals.csv",
              "actionable_execution_list.csv", "actionable_execution_list.json", "actionable_execution_list.md",
              "opportunity_changes.csv", "evidence_changes.csv", "candidate_upgrade_report.md",
              "candidate_downgrade_report.md", "tomorrow_watchlist.md", "data_quality_audit.csv",
              "run_summary.json", "report_manifest.json",
          }
          missing = sorted(name for name in required if not (latest / name).exists())
          assert not missing, f"missing report files: {missing}"
          deep_root = latest / "_deep_review"
          deep_runs = sorted(
              path for path in deep_root.iterdir()
              if path.is_dir() and (path / "daily_opportunity_report.json").exists()
          ) if deep_root.exists() else []
          assert deep_runs, "no timestamped deep-review report generated"
          deep_latest = deep_runs[-1]
          for name in ("auto_evidence_audit.csv", "evidence_inventory.csv"):
              assert (deep_latest / name).exists(), f"missing deep-review file: {name}"
          assert summary["official_universe_count"] > 5000
          assert summary["effective_scan_count"] > 1000
          assert summary["fatal_data_failure_count"] == 0
          assert summary["recoverable_price_failure_count"] >= 0
          assert 0.95 <= float(summary["price_data_coverage_ratio"]) <= 1.0
          assert summary["no_auto_trade"] is True
          assert summary["no_broker_integration"] is True
          assert 0 <= summary["evidence_queue_count"] <= 80
          assert 0 <= summary["exit_profile_exploration_count"] <= 40
          assert summary["analysis_candidate_count_including_active_review"] >= (
              summary["evidence_queue_count"]
              + summary["exit_profile_exploration_count"]
          )
          assert 0 <= summary["deep_review_count"] <= summary["analysis_candidate_count_including_active_review"]
          assert summary["active_signal_review_refreshed_count"] <= summary["active_signal_review_count"]
          assert summary["exit_profile_exploration_selection_version"] == "weekly_industry_rotation_v1"
          with (latest / "top80_evidence_queue.csv").open(encoding="utf-8") as handle:
              top80_codes = {row["code"] for row in csv.DictReader(handle)}
          with (latest / "active_signal_review_queue.csv").open(encoding="utf-8") as handle:
              active_review_codes = {row["code"] for row in csv.DictReader(handle)}
          with (latest / "exit_profile_exploration_queue.csv").open(encoding="utf-8") as handle:
              exploration_rows = list(csv.DictReader(handle))
          exploration_codes = {row["code"] for row in exploration_rows}
          assert len(exploration_rows) == summary["exit_profile_exploration_count"]
          assert len(exploration_codes) == len(exploration_rows)
          assert exploration_codes.isdisjoint(top80_codes)
          assert exploration_codes.isdisjoint(active_review_codes)
          assert all(
              row["quant_status"] in {"PRIORITY_RESEARCH", "SECONDARY_RESEARCH"}
              for row in exploration_rows
          )
          assert all(
              row["exit_profile_exploration_reason"] in {
                  "PRIOR_VALIDATED_PROFILE_REFRESH",
                  "WEEKLY_INDUSTRY_ROTATION",
                  "WEEKLY_ROTATION_FILL",
              }
              for row in exploration_rows
          )
          assert sum(
              row["exit_profile_exploration_reason"]
              == "PRIOR_VALIDATED_PROFILE_REFRESH"
              for row in exploration_rows
          ) == summary["exit_profile_exploration_prior_validated_count"]
          assert len({
              row.get("industry") or "UNRESOLVED" for row in exploration_rows
          }) == summary["exit_profile_exploration_industry_count"]
          if exploration_rows:
              assert {
                  row["exit_profile_exploration_rotation_bucket"]
                  for row in exploration_rows
              } == {summary["exit_profile_exploration_rotation_bucket"]}
              assert {
                  row["exit_profile_exploration_selection_version"]
                  for row in exploration_rows
              } == {summary["exit_profile_exploration_selection_version"]}
          assert summary["signal_state_continuity_status"] in {
              "VALID", "MISSING_INITIALIZED_SAFE", "CORRUPT_REINITIALIZED_SAFE"
          }
          if summary["signal_state_continuity_status"] != "VALID":
              assert summary["buy_signal_count"] == 0
          assert summary["exit_profile_refresh"]["candidate_count"] == summary["analysis_candidate_count_including_active_review"]
          assert summary["exit_profile_refresh"]["sample_spacing_sessions"] == 61
          assert summary["exit_profile_refresh"]["exit_execution_lag_sessions"] == 1
          assert summary["exit_profile_refresh"]["exit_execution_timing"] == "NEXT_TRADE_SESSION_OPEN"
          assert summary["exit_profile_refresh"]["minimum_profile_sample_count"] == 12
          assert summary["exit_profile_refresh"]["minimum_recent_2y_sample_count"] == 3
          assert summary["exit_profile_refresh"]["minimum_cohort_codes_per_period"] == 3
          assert summary["exit_profile_refresh"]["validation_reference_count"] == summary["exit_profile_validation_reference_count"]
          assert sum(summary["exit_profile_refresh"]["validation_scope_distribution"].values()) == summary["analysis_candidate_count_including_active_review"]
          assert summary["exit_profile_priority_candidate_count"] == summary["exit_profile_refresh"]["candidate_distribution"].get("PASSED", 0)
          assert len(summary["exit_profile_priority_codes"]) == summary["exit_profile_priority_candidate_count"]
          assert len(set(summary["exit_profile_priority_codes"])) == len(summary["exit_profile_priority_codes"])
          assert summary["deep_priority_queue_size"] >= summary["exit_profile_priority_candidate_count"]
          assert summary["exit_profile_priority_deep_reviewed_count"] == summary["exit_profile_priority_candidate_count"]
          exit_health = summary["exit_profile_strategy_health"]
          assert exit_health["status"] in {
              "CANDIDATE_VALIDATED_EDGE_AVAILABLE",
              "REFERENCE_COHORT_VALIDATED_EDGE_AVAILABLE",
              "NO_VALIDATED_EXIT_EDGE",
          }
          assert exit_health["candidate_passed_count"] == summary["exit_profile_priority_candidate_count"]
          assert exit_health["cohort_count"] == len(summary["exit_profile_refresh"]["cohort_validations"])
          assert sum(exit_health["cohort_status_distribution"].values()) == exit_health["cohort_count"]
          if exit_health["status"] == "NO_VALIDATED_EXIT_EDGE":
              assert exit_health["candidate_passed_count"] == 0
              assert exit_health["cohort_passed_count"] == 0
              assert summary["strict_review_ready_count"] == 0
              assert summary["buy_signal_count"] == 0
          assert summary["exit_profile_history_fetch"]["requested_count"] == summary["exit_profile_history_fetch"]["unique_history_request_count"]
          assert summary["exit_profile_history_fetch"]["exploration_candidate_requested_count"] == summary["exit_profile_exploration_count"]
          assert summary["exit_profile_history_fetch"]["requested_count"] <= (
              summary["analysis_candidate_count_including_active_review"]
              + summary["exit_profile_validation_reference_count"]
          )
          assert 0 <= summary["exit_profile_history_fetch"]["success_count"] <= summary["exit_profile_history_fetch"]["requested_count"]
          assert summary["exit_profile_history_data_quality"] in {"OK", "DEGRADED"}
          assert 0 <= float(summary["exit_profile_candidate_history_coverage_ratio"]) <= 1
          assert 0 <= float(summary["exit_profile_reference_history_coverage_ratio"]) <= 1
          if summary["exit_profile_history_data_quality"] == "DEGRADED":
              assert summary["buy_signal_count"] == 0
          assert summary["strict_gate_feasibility"]["audited_candidate_count"] == summary["deep_review_count"]
          if summary["evidence_queue_count"] == 0:
              assert summary["deep_review_count"] == 0
              assert summary["strict_review_ready_count"] == 0
              assert summary["buy_signal_count"] == 0
          assert summary["actionable_execution_count"] == summary["buy_signal_count"]
          assert summary["actionable_execution_count"] <= summary["strict_review_ready_count"]
          assert summary["execution_suppressed_count"] == (
              summary["strict_review_ready_count"] - summary["actionable_execution_count"]
          )
          assert summary["market_regime_status"] in {"GREEN", "YELLOW", "RED"}
          assert 0 <= float(summary["market_regime_score"]) <= 100
          assert float(summary["market_position_multiplier"]) in {0.0, 0.5, 1.0}
          assert summary["external_risk_level"] in {"LOW", "MEDIUM", "HIGH", "UNKNOWN"}
          assert summary["external_context_date"] >= summary["as_of_date"]
          assert summary["external_market_available_count"] >= 0
          assert summary["external_market_data_quality"] in {"OK", "PARTIAL"}
          assert summary["market_signal_data_quality"] in {"OK", "PARTIAL"}
          assert summary["industry_regime_data_quality"] in {"OK", "PARTIAL"}
          assert summary["industry_regime_count"] >= 0
          assert summary["event_scan_ok_count"] >= 0
          assert summary["daily_candidate_top5_count"] == 5
          assert summary["buy_signal_count"] >= 0
          assert summary["sell_signal_count"] >= 0
          assert summary["cancel_buy_review_count"] >= 0
          if summary["market_regime_status"] == "RED":
              assert summary["strict_review_ready_count"] == 0
              assert summary["actionable_execution_count"] == 0
              assert summary["buy_signal_count"] == 0
          assert summary["acceptance_enum"] in {
              "PASS_ALL_A_PRODUCTION_RESEARCH_READY", "PASS_STRICT_REVIEW_CANDIDATE_GENERATED"
          }
          assert summary["industry_evidence_file"] == "data/user_supplied/industry_cycle_evidence.csv"
          assert summary["company_evidence_file"] == "data/user_supplied/company_cycle_evidence.csv"
          for filename in ("strict_review_ready.csv", "condition_watch.csv", "research_watch.csv"):
              with (latest / filename).open(encoding="utf-8") as handle:
                  for row in csv.DictReader(handle):
                      if row["user_visible_level"] != "STRICT_REVIEW_READY":
                          assert float(row.get("risk_budget_initial_position_pct") or 0) == 0
                          assert float(row.get("risk_budget_max_position_pct") or 0) == 0
          with (latest / "daily_signals.csv").open(encoding="utf-8") as handle:
              signals = list(csv.DictReader(handle))
          assert len({row["code"] for row in signals}) == len(signals)
          assert sum(row["signal_action"] == "BUY_IF_TRIGGERED" for row in signals) == summary["buy_signal_count"]
          assert sum(row["signal_action"] == "HOLD_REVIEW" for row in signals) == summary["hold_signal_count"]
          assert sum(row["signal_action"] == "SELL_EXIT" for row in signals) == summary["sell_signal_count"]
          assert sum(row["signal_action"] == "CANCEL_BUY_REVIEW" for row in signals) == summary["cancel_buy_review_count"]
          assert sum(row["signal_action"] == "WATCH_ONLY" for row in signals) == summary["watch_signal_count"]
          for row in signals:
              assert row["signal_action"] in {"BUY_IF_TRIGGERED", "HOLD_REVIEW", "SELL_EXIT", "CANCEL_BUY_REVIEW", "WATCH_ONLY"}
              assert row["no_auto_trade"] == "True"
              if row["signal_action"] == "BUY_IF_TRIGGERED":
                  assert row["current_level"] == "STRICT_REVIEW_READY"
                  assert row["entry_low"] and row["entry_high"] and row["stop_price"]
                  assert row["current_lifecycle_state"] in {
                      "ENTRY_PENDING", "BREAKOUT_CONFIRMED_ENTRY_PENDING"
                  }
                  assert row["plan_id"].startswith("plan:")
                  assert row["plan_rule_version"]
                  assert row["real_reward_risk_ratio"]
                  if row["current_lifecycle_state"] == "BREAKOUT_CONFIRMED_ENTRY_PENDING":
                      assert row["preferred_plan"] == "breakout"
                      assert row["signal_reason"] == "breakout_close_confirmed_next_open_pending"
                      assert row["breakout_confirmation_observed_today"] == "True"
                  else:
                      assert row["preferred_plan"] == "pullback"
                  assert row["market_regime_status"] in {"GREEN", "YELLOW"}
                  assert row["industry_regime_status"] not in {"UNKNOWN", "CRISIS"}
                  assert int(row["industry_regime_sample_count"]) >= 5
                  assert row["event_scan_status"] == "OK"
                  assert row["event_risk_level"] != "HIGH"
                  assert row["price_volume_state"] not in {"DISTRIBUTION", "CAPITULATION_RISK"}
                  assert row["real_world_gate_passed"] == "True"
              if row["signal_action"] == "SELL_EXIT":
                  sell_reason = row["signal_reason"]
                  balanced_prefix = "balanced_exit_triggered:"
                  balanced_exit_reason = (
                      sell_reason.removeprefix(balanced_prefix)
                      if sell_reason.startswith(balanced_prefix) else ""
                  )
                  same_day_prefix = "entry_and_exit_same_day_t1:"
                  same_day_exit_reason = (
                      sell_reason.removeprefix(same_day_prefix)
                      if sell_reason.startswith(same_day_prefix) else ""
                  )
                  assert sell_reason in {
                      "previous_stop_or_invalidation_breached",
                      "previous_stop_or_invalidation_breached_with_run_gap",
                      "previous_logic_invalidation_breached",
                      "frozen_protective_stop_breached_live_state_unavailable",
                      "balanced_or_frozen_hard_exit_with_run_gap",
                      "run_gap_possible_entry_and_frozen_threshold_breached",
                      "exit_confirmation_required_after_threshold_breach",
                  } or balanced_exit_reason in {
                      "STOP_LOSS", "TREND_BREAK_CONFIRMED", "TAKE_PROFIT_TRAIL",
                      "NO_REPAIR_40D", "TIME_EXIT_60D", "LOGIC_INVALIDATION",
                  } or same_day_exit_reason in {
                      "STOP_LOSS", "LOGIC_INVALIDATION",
                  }
                  assert row["previous_lifecycle_state"] in {
                      "ENTRY_PENDING", "BREAKOUT_CONFIRMED_ENTRY_PENDING",
                      "ENTRY_TRIGGER_OBSERVED", "POSITION_REVIEW", "EXIT_THRESHOLD_BREACHED"
                  }
                  assert row["position_confirmation_required"] == "True"
                  latest_price = float(row["latest_price"])
                  observation_price = float(row["threshold_observation_price"])
                  stop_price = float(row["stop_price"]) if row.get("stop_price") else None
                  invalidation_price = (
                      float(row["logic_invalidation_price"])
                      if row.get("logic_invalidation_price") else None
                  )
                  effective_stop = (
                      float(row["live_exit_effective_stop_price"])
                      if row.get("live_exit_effective_stop_price") else None
                  )
                  if sell_reason == "previous_logic_invalidation_breached":
                      assert invalidation_price is not None and latest_price <= invalidation_price
                  elif sell_reason == "frozen_protective_stop_breached_live_state_unavailable":
                      assert stop_price is not None and observation_price <= stop_price
                  elif sell_reason in {
                      "balanced_or_frozen_hard_exit_with_run_gap",
                      "run_gap_possible_entry_and_frozen_threshold_breached",
                  }:
                      assert "RUN_GAP" in row["signal_data_status"]
                      assert (
                          (stop_price is not None and observation_price <= stop_price)
                          or (effective_stop is not None and observation_price <= effective_stop)
                          or (invalidation_price is not None and latest_price <= invalidation_price)
                      )
                  elif sell_reason.startswith(balanced_prefix):
                      assert row["live_exit_policy_status"] == "EXIT_TRIGGERED"
                      assert row["live_exit_policy_reason"] == balanced_exit_reason
                      if balanced_exit_reason == "STOP_LOSS":
                          assert effective_stop is not None and observation_price <= effective_stop
                  elif sell_reason.startswith(same_day_prefix):
                      assert row["live_exit_policy_status"] == "EXIT_TRIGGERED"
                      assert row["live_exit_policy_reason"] == same_day_exit_reason
                  elif sell_reason != "exit_confirmation_required_after_threshold_breach":
                      assert (
                          (stop_price is not None and observation_price <= stop_price)
                          or (invalidation_price is not None and latest_price <= invalidation_price)
                      )
              if row["signal_action"] in {"WATCH_ONLY", "SELL_EXIT", "CANCEL_BUY_REVIEW"}:
                  assert float(row.get("risk_budget_initial_position_pct") or 0) == 0
                  assert float(row.get("risk_budget_max_position_pct") or 0) == 0
          with (latest / "buy_signals.csv").open(encoding="utf-8") as handle:
              buy_signals = list(csv.DictReader(handle))
          with (latest / "sell_signals.csv").open(encoding="utf-8") as handle:
              sell_signals = list(csv.DictReader(handle))
          assert all(row["signal_action"] == "BUY_IF_TRIGGERED" for row in buy_signals)
          assert all(row["signal_action"] == "SELL_EXIT" for row in sell_signals)
          assert len(buy_signals) == summary["buy_signal_count"]
          assert len(sell_signals) == summary["sell_signal_count"]
          with (latest / "actionable_execution_list.csv").open(encoding="utf-8") as handle:
              execution_rows = list(csv.DictReader(handle))
          buy_codes = {row["code"] for row in signals if row["signal_action"] == "BUY_IF_TRIGGERED"}
          exit_codes = {
              row["code"] for row in signals
              if row["signal_action"] in {"SELL_EXIT", "CANCEL_BUY_REVIEW"}
          }
          execution_codes = {row["code"] for row in execution_rows}
          assert len(execution_rows) == summary["actionable_execution_count"]
          assert execution_codes == buy_codes
          assert execution_codes.isdisjoint(exit_codes)
          for row in execution_rows:
              assert row["execution_action"] == "BUY_IF_TRIGGERED"
              assert row["market_regime_status"] in {"GREEN", "YELLOW"}
              assert row["industry_regime_status"] not in {"UNKNOWN", "CRISIS"}
              assert int(row["industry_regime_sample_count"]) >= 5
              assert row["event_scan_status"] == "OK"
              assert row["event_risk_level"] != "HIGH"
              assert row["real_world_gate_passed"] == "True"
              assert row["exit_profile_entry_mode"] == row["preferred_plan"]
              assert row["profile_validation_scope"] in {
                  "STOCK_SPECIFIC", "ENTRY_MODE_COHORT_INDEPENDENT_REFERENCE"
              }
              if row["profile_validation_scope"] == "ENTRY_MODE_COHORT_INDEPENDENT_REFERENCE":
                  assert 0 < float(row["profile_position_multiplier"]) <= 0.5

          market = json.loads((latest / "market_regime.json").read_text(encoding="utf-8"))
          assert market["status"] == summary["market_regime_status"]
          assert float(market["score"]) == float(summary["market_regime_score"])
          with (latest / "industry_regimes.csv").open(encoding="utf-8") as handle:
              industries = list(csv.DictReader(handle))
          assert all(row["status"] in {"CRISIS", "WEAK", "NEUTRAL", "STRONG"} for row in industries)
          assert all(0 <= float(row["score"]) <= 100 for row in industries)
          assert len(industries) == summary["industry_regime_count"]
          if not industries:
              assert summary["industry_regime_data_quality"] == "PARTIAL"
              assert summary["strict_review_ready_count"] == 0
              assert summary["buy_signal_count"] == 0
          with (latest / "real_world_signal_audit.csv").open(encoding="utf-8") as handle:
              real_world_rows = list(csv.DictReader(handle))
          assert len(real_world_rows) == summary["strict_gate_feasibility"]["audited_candidate_count"]
          assert set(summary["exit_profile_priority_codes"]).issubset({
              row["code"] for row in real_world_rows
          })
          assert all(row["market_regime_status"] and row["industry_regime_status"] for row in real_world_rows)
          assert sum(row["event_scan_status"] == "OK" for row in real_world_rows) == summary["event_scan_ok_count"]
          if summary["event_scan_ok_count"] == 0:
              assert summary["buy_signal_count"] == 0

          with (latest / "daily_candidate_top5.csv").open(encoding="utf-8") as handle:
              top5 = list(csv.DictReader(handle))
          assert len(top5) == 5
          assert len({row["code"] for row in top5}) == 5
          assert [int(row["candidate_rank"]) for row in top5] == [1, 2, 3, 4, 5]
          for row in top5:
              assert row["candidate_action"] in {
                  "BUY_IF_TRIGGERED", "HOLD_REVIEW", "SELL_EXIT", "CANCEL_BUY_REVIEW", "WATCH_ONLY"
              }
              if row["candidate_action"] == "BUY_IF_TRIGGERED":
                  assert row["formal_buy_eligible"] == "True"
                  assert row["user_visible_level"] == "STRICT_REVIEW_READY"
              else:
                  assert row["formal_buy_eligible"] == "False"
                  assert float(row.get("risk_budget_initial_position_pct") or 0) == 0
                  assert float(row.get("risk_budget_max_position_pct") or 0) == 0
                  if row.get("strict_gate_failed"):
                      assert row["missing_conditions"] == row["strict_gate_failed"]
          forbidden = ("必买", "必卖", "保证上涨", "确定买入", "自动下单")
          for path in latest.iterdir():
              if path.suffix in {".md", ".csv", ".json"}:
                  text = path.read_text(encoding="utf-8")
                  assert not any(term in text for term in forbidden), path
          print(f"validated={latest}")
          PY

      - name: Publish daily signal summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("reports/all_a_full_scan")
          reports = sorted(path for path in root.iterdir() if path.is_dir() and (path / "daily_signals.md").exists()) if root.exists() else []
          target = Path(os.environ["GITHUB_STEP_SUMMARY"])
          content = (
              (reports[-1] / "daily_signals.md").read_text(encoding="utf-8")
              if reports
              else "# 每日买入/卖出研究信号\n\n本次运行未生成信号报告，请查看失败步骤和上传的诊断产物。\n"
          )
          with target.open("a", encoding="utf-8") as stream:
              stream.write(content)
          PY

      - name: Save all-A public-data cache and observation state
        uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload all-A production report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-all-a-production-report
          path: |
            reports/all_a_full_scan
            stock_pools/all_a_universe_*.csv
          if-no-files-found: warn
