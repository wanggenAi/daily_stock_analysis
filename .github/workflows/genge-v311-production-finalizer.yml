name: GenGe V3.1.1 Production Finalizer

on:
  workflow_run:
    workflows:
      - "GenGe V3.1.1 Every-Industry Research"
      - "GenGe All-A V3.1.1 One Shot"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed canonical producer run id"
        required: true
        type: string
      source_workflow:
        description: "Canonical producer workflow"
        required: true
        type: choice
        options:
          - "GenGe V3.1.1 Every-Industry Research"
          - "GenGe All-A V3.1.1 One Shot"

permissions:
  contents: write
  actions: read

concurrency:
  group: genge-v311-production-finalizer-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  finalize-v311-canonical:
    name: Authorize one canonical V3.1.1 production truth
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authority code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install authority dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Resolve authoritative source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
          MANUAL_WORKFLOW: ${{ inputs.source_workflow }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_ID="$MANUAL_RUN_ID"
            SOURCE_WORKFLOW="$MANUAL_WORKFLOW"
            HEAD_SHA="manual-source-run"
          else
            RUN_ID="$WORKFLOW_RUN_ID"
            SOURCE_WORKFLOW="$WORKFLOW_NAME"
            HEAD_SHA="$WORKFLOW_HEAD_SHA"
          fi
          test -n "$RUN_ID"
          case "$SOURCE_WORKFLOW" in
            "GenGe V3.1.1 Every-Industry Research")
              ARTIFACT_NAME="genge-v31-every-industry-research"
              SOURCE_KIND="every-industry"
              ;;
            "GenGe All-A V3.1.1 One Shot")
              ARTIFACT_NAME="genge-all-a-v31-one-shot"
              SOURCE_KIND="GenGe All-A V3.1.1 One Shot"
              ;;
            *)
              echo "unsupported canonical producer: $SOURCE_WORKFLOW" >&2
              exit 1
              ;;
          esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "workflow=$SOURCE_WORKFLOW" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_kind=$SOURCE_KIND" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "authority_code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download exact canonical producer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: incoming
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate unique native canonical snapshot
        id: canonical
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          matches = [
              path for path in Path("incoming").rglob("latest.json")
              if path.parent.name == "canonical_snapshot"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one canonical_snapshot/latest.json; found {len(matches)}"
              )
          snapshot = matches[0]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"snapshot={snapshot}\n")
          print(f"canonical_snapshot={snapshot}")
          PY

      - name: Run canonical authority, consumer, and lifecycle tests
        run: |
          python -m pytest -q \
            tests/test_genge_canonical_snapshot.py \
            tests/test_genge_canonical_operating_view.py \
            tests/test_genge_canonical_authority.py \
            tests/test_genge_canonical_authorized_consumer.py \
            tests/test_genge_canonical_holdings_reconciliation.py \
            tests/test_genge_candidate_lifecycle_state.py \
            tests/test_genge_candidate_lifecycle_scope.py \
            tests/test_genge_candidate_lifecycle_persistence.py \
            tests/test_genge_industry_valuation_lifecycle_memory.py \
            tests/test_v311_price_date_provenance.py

      - name: Finalize canonical production authority
        run: |
          python -m src.strategies.genge_opportunity_discovery.canonical_authority \
            --snapshot "${{ steps.canonical.outputs.snapshot }}" \
            --output-dir authoritative \
            --expected-source-run-id "${{ steps.source.outputs.run_id }}" \
            --source-workflow "${{ steps.source.outputs.workflow }}" \
            --expected-source-kind "${{ steps.source.outputs.source_kind }}" \
            --source-head-sha "${{ steps.source.outputs.head_sha }}" \
            --finalizer-run-id "${GITHUB_RUN_ID}" \
            --finalizer-code-sha "${{ steps.source.outputs.authority_code_sha }}"

      - name: Reconcile current confirmed holdings with canonical holding actions
        run: |
          python -m src.strategies.genge_opportunity_discovery.canonical_holdings_reconciliation \
            --snapshot authoritative/canonical_snapshot/latest.json \
            --holdings-md CURRENT_HOLDINGS.md \
            --output authoritative/holdings_reconciliation.json

      - name: Preserve pre-state-machine candidate research notes once
        run: |
          if [ ! -s data/opportunity_snapshots/candidate_lifecycle_state.json ] && \
             [ -s V31_CANDIDATE_LEDGER.md ] && \
             [ ! -e V31_CANDIDATE_RESEARCH_NOTES_LEGACY.md ]; then
            cp V31_CANDIDATE_LEDGER.md V31_CANDIDATE_RESEARCH_NOTES_LEGACY.md
          fi

      - name: Apply finalized snapshot to durable candidate lifecycle
        run: |
          mkdir -p data/opportunity_snapshots authoritative/candidate_lifecycle
          python -m src.strategies.genge_opportunity_discovery.candidate_lifecycle_persistence \
            --snapshot authoritative/canonical_snapshot/latest.json \
            --state data/opportunity_snapshots/candidate_lifecycle_state.json \
            --legacy-ledger V31_CANDIDATE_LEDGER.md \
            --projection authoritative/candidate_lifecycle/V31_CANDIDATE_LEDGER.md \
            --events authoritative/candidate_lifecycle/snapshot_events.json \
            --summary authoritative/candidate_lifecycle/summary.json
          cp data/opportunity_snapshots/candidate_lifecycle_state.json \
            authoritative/candidate_lifecycle/candidate_lifecycle_state.json

      - name: Validate sole-truth consumer and lifecycle contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.strategies.genge_opportunity_discovery.canonical_authorized_consumer import (
              load_authorized_view,
          )
          from src.strategies.genge_opportunity_discovery.canonical_operating_view import (
              DAILY_SETTLEMENT,
              HOURLY_MONITOR,
          )
          from src.strategies.genge_opportunity_discovery.candidate_lifecycle_state import (
              LIFECYCLE_CONTRACT_VERSION,
              load_state,
          )

          root = Path("authoritative")
          hourly_bundle = load_authorized_view(root, mode=HOURLY_MONITOR)
          daily_bundle = load_authorized_view(root, mode=DAILY_SETTLEMENT)
          holdings = json.loads((root / "holdings_reconciliation.json").read_text(encoding="utf-8"))
          lifecycle = load_state(Path("data/opportunity_snapshots/candidate_lifecycle_state.json"))
          lifecycle_summary = json.loads(
              (root / "candidate_lifecycle/summary.json").read_text(encoding="utf-8")
          )
          lifecycle_events = json.loads(
              (root / "candidate_lifecycle/snapshot_events.json").read_text(encoding="utf-8")
          )

          authority = hourly_bundle["authority"]
          hourly = hourly_bundle["view"]
          daily = daily_bundle["view"]
          sid = hourly_bundle["canonical_snapshot_id"]

          assert sid == daily_bundle["canonical_snapshot_id"]
          assert hourly_bundle["canonical_source_run_id"] == daily_bundle["canonical_source_run_id"]
          assert hourly_bundle["canonical_source_run_id"] == "${{ steps.source.outputs.run_id }}"
          assert hourly_bundle["source_kind"] == "${{ steps.source.outputs.source_kind }}"
          assert hourly_bundle["source_workflow"] == "${{ steps.source.outputs.workflow }}"
          assert holdings["canonical_snapshot_id"] == sid
          assert holdings["canonical_source_run_id"] == hourly_bundle["canonical_source_run_id"]
          assert holdings["candidate_formal_actions_affected_by_holdings_mismatch"] is False
          if holdings["in_sync"]:
              assert holdings["formal_holding_actions_currently_usable"] is True
          else:
              assert holdings["status"] == "HOLDINGS_OUT_OF_SYNC"
              assert holdings["formal_holding_actions_currently_usable"] is False

          assert lifecycle["contract_version"] == LIFECYCLE_CONTRACT_VERSION
          assert lifecycle["latest_applied_snapshot_id"] == sid
          assert lifecycle["last_persisted_snapshot_id"] == sid
          assert lifecycle["last_persisted_source_run_id"] == hourly_bundle["canonical_source_run_id"]
          assert lifecycle["discovery_is_filtered_by_lifecycle"] is False
          assert lifecycle["no_auto_trade"] is True
          assert lifecycle_summary["canonical_snapshot_id"] == sid
          assert lifecycle_summary["discovery_is_filtered_by_lifecycle"] is False

          meaningful_actions = {"BUY", "ADD", "REDUCE", "EXIT"}
          for event in lifecycle_events:
              if event.get("event") != "NEW":
                  continue
              if event.get("observed_scope") == "PRODUCTION_REUNDERWRITE":
                  assert str(event.get("formal_action") or "").upper() in meaningful_actions, event

          assert authority["consumer_contract"]["one_formal_truth_per_production_cycle"] is True
          assert authority["consumer_contract"]["canonical_is_only_formal_decision_truth"] is True
          assert authority["consumer_contract"]["consumer_may_recompute_formal_action"] is False
          assert authority["consumer_contract"]["overlay_may_overwrite_formal_action"] is False
          print(json.dumps({
              "authorized": authority["authorized"],
              "snapshot_id": sid,
              "source_workflow": hourly_bundle["source_workflow"],
              "source_kind": hourly_bundle["source_kind"],
              "source_run_id": hourly_bundle["canonical_source_run_id"],
              "upstream_run_id": authority["upstream_run_id"],
              "latest_trade_date": hourly_bundle["latest_trade_date"],
              "holdings_status": holdings["status"],
              "holding_actions_usable": holdings["formal_holding_actions_currently_usable"],
              "candidate_lifecycle_count": len(lifecycle["candidates"]),
              "candidate_lifecycle_events": lifecycle_summary["snapshot_event_count"],
              "hourly_mode": hourly["mode"],
              "daily_mode": daily["mode"],
              "digest_verified": True,
              "generic_hold_review_lifecycle_inflation_blocked": True,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish canonical authority summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          authority = json.loads(Path("authoritative/production_authority.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path("authoritative/canonical_snapshot/latest.json").read_text(encoding="utf-8"))
          holdings = json.loads(Path("authoritative/holdings_reconciliation.json").read_text(encoding="utf-8"))
          lifecycle = json.loads(Path("authoritative/candidate_lifecycle/summary.json").read_text(encoding="utf-8"))
          counts = snapshot.get("production", {}).get("action_counts", {})
          target = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with target.open("a", encoding="utf-8") as out:
              out.write("# GenGe V3.1.1 Canonical Production Authority\n\n")
              out.write(f"- authorized: `{authority['authorized']}`\n")
              out.write(f"- snapshot_id: `{authority['canonical_snapshot_id']}`\n")
              out.write(f"- source workflow: `{authority['source_workflow']}`\n")
              out.write(f"- source kind: `{authority['canonical_source_kind']}`\n")
              out.write(f"- canonical source run: `{authority['canonical_source_run_id']}`\n")
              out.write(f"- upstream run: `{authority['upstream_run_id']}`\n")
              out.write(f"- latest trade date: `{authority['latest_trade_date']}`\n")
              out.write(f"- holdings reconciliation: `{holdings['status']}`\n")
              out.write(f"- holding Formal actions usable: `{holdings['formal_holding_actions_currently_usable']}`\n")
              out.write(f"- candidate lifecycle active: `{lifecycle['active_count']}`\n")
              out.write(f"- candidate lifecycle inactive: `{lifecycle['inactive_count']}`\n")
              out.write(f"- candidate lifecycle new events: `{lifecycle['snapshot_event_count']}`\n")
              out.write(f"- action counts: `{counts}`\n")
              out.write("- canonical SHA256 and consumer views validated before publication\n")
              out.write("- generic production-only HOLD_REVIEW rows cannot inflate durable lifecycle memory\n")
              out.write("- candidate lifecycle is downstream state; broad Discovery remains ledger-independent\n")
              out.write("- V31_CANDIDATE_LEDGER.md is a generated projection, not the lifecycle truth\n")
              out.write("- formal decisions: canonical snapshot only within this production cycle\n")
              out.write("- holdings mismatch fails closed for holding actions only; candidate actions remain canonical\n")
              out.write("- hourly/daily: same snapshot, different read-only jobs\n")
              out.write("- overlays cannot overwrite a formal action\n")
          PY

      - name: Persist lifecycle JSON and generated ledger to main
        run: |
          cp authoritative/candidate_lifecycle/V31_CANDIDATE_LEDGER.md V31_CANDIDATE_LEDGER.md
          git config user.name "genge-v311-production-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"
          git add data/opportunity_snapshots/candidate_lifecycle_state.json V31_CANDIDATE_LEDGER.md
          if [ -e V31_CANDIDATE_RESEARCH_NOTES_LEGACY.md ]; then
            git add V31_CANDIDATE_RESEARCH_NOTES_LEGACY.md
          fi
          if git diff --cached --quiet; then
            echo "candidate lifecycle already persisted for this snapshot"
            exit 0
          fi
          CANONICAL_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('authoritative/canonical_snapshot/latest.json').read_text(encoding='utf-8'))['snapshot_id'])
          PY
          )
          git commit -m "Persist V3.1.1 candidate lifecycle ${CANONICAL_ID} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload authoritative canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-authoritative-canonical-${{ steps.source.outputs.run_id }}
          path: authoritative
          if-no-files-found: error
