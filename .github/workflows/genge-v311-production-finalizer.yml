name: GenGe V3.1.1 Production Finalizer

on:
  workflow_run:
    workflows: ["GenGe V3.1.1 Every-Industry Research"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed GenGe V3.1.1 Every-Industry Research run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-v311-production-finalizer-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  finalize-v311-canonical:
    name: Authorize one canonical V3.1.1 production truth
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authority code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install authority dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Resolve authoritative source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_ID="$MANUAL_RUN_ID"
            HEAD_SHA="manual-source-run"
          else
            RUN_ID="$WORKFLOW_RUN_ID"
            HEAD_SHA="$WORKFLOW_HEAD_SHA"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "authority_code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download exact every-industry artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-v31-every-industry-research
          path: incoming
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate unique native canonical snapshot
        id: canonical
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          matches = [
              path for path in Path("incoming").rglob("latest.json")
              if path.parent.name == "canonical_snapshot"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one canonical_snapshot/latest.json; found {len(matches)}"
              )
          snapshot = matches[0]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"snapshot={snapshot}\n")
          print(f"canonical_snapshot={snapshot}")
          PY

      - name: Run canonical authority tests
        run: |
          python -m pytest -q \
            tests/test_genge_canonical_snapshot.py \
            tests/test_genge_canonical_authority.py

      - name: Finalize canonical production authority
        run: |
          python -m src.strategies.genge_opportunity_discovery.canonical_authority \
            --snapshot "${{ steps.canonical.outputs.snapshot }}" \
            --output-dir authoritative \
            --expected-source-run-id "${{ steps.source.outputs.run_id }}" \
            --source-workflow "GenGe V3.1.1 Every-Industry Research" \
            --source-head-sha "${{ steps.source.outputs.head_sha }}" \
            --finalizer-run-id "${GITHUB_RUN_ID}" \
            --finalizer-code-sha "${{ steps.source.outputs.authority_code_sha }}"

      - name: Validate sole-truth consumer contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.strategies.genge_opportunity_discovery.canonical_authority import validate_authority
          from src.strategies.genge_opportunity_discovery.canonical_snapshot import validate_snapshot

          root = Path("authoritative")
          snapshot = json.loads((root / "canonical_snapshot/latest.json").read_text(encoding="utf-8"))
          authority = json.loads((root / "production_authority.json").read_text(encoding="utf-8"))
          hourly = json.loads((root / "operating_views/hourly.json").read_text(encoding="utf-8"))
          daily = json.loads((root / "operating_views/daily.json").read_text(encoding="utf-8"))

          validate_snapshot(snapshot, expected_source_run_id="${{ steps.source.outputs.run_id }}")
          validate_authority(authority, snapshot, hourly_view=hourly, daily_view=daily)
          assert authority["canonical_snapshot_id"] == hourly["canonical_snapshot_id"] == daily["canonical_snapshot_id"]
          assert authority["consumer_contract"]["canonical_is_only_formal_decision_truth"] is True
          assert authority["consumer_contract"]["consumer_may_recompute_formal_action"] is False
          assert authority["consumer_contract"]["overlay_may_overwrite_formal_action"] is False
          print(json.dumps({
              "authorized": authority["authorized"],
              "snapshot_id": authority["canonical_snapshot_id"],
              "source_run_id": authority["canonical_source_run_id"],
              "upstream_run_id": authority["upstream_run_id"],
              "latest_trade_date": authority["latest_trade_date"],
              "hourly_mode": hourly["mode"],
              "daily_mode": daily["mode"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish canonical authority summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          authority = json.loads(Path("authoritative/production_authority.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path("authoritative/canonical_snapshot/latest.json").read_text(encoding="utf-8"))
          counts = snapshot.get("production", {}).get("action_counts", {})
          target = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with target.open("a", encoding="utf-8") as out:
              out.write("# GenGe V3.1.1 Canonical Production Authority\n\n")
              out.write(f"- authorized: `{authority['authorized']}`\n")
              out.write(f"- snapshot_id: `{authority['canonical_snapshot_id']}`\n")
              out.write(f"- canonical source run: `{authority['canonical_source_run_id']}`\n")
              out.write(f"- upstream discovery run: `{authority['upstream_run_id']}`\n")
              out.write(f"- latest trade date: `{authority['latest_trade_date']}`\n")
              out.write(f"- action counts: `{counts}`\n")
              out.write("- formal decisions: canonical snapshot only\n")
              out.write("- hourly/daily: same snapshot, different read-only jobs\n")
              out.write("- overlays cannot overwrite a formal action\n")
          PY

      - name: Upload authoritative canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-authoritative-canonical-${{ steps.source.outputs.run_id }}
          path: authoritative
          if-no-files-found: error
