name: GenGe Formal Portfolio Allocator

on:
  pull_request:
    paths:
      - "src/strategies/genge_opportunity_discovery/formal_portfolio_allocator.py"
      - "src/strategies/genge_opportunity_discovery/drawdown_risk_policy.py"
      - "tests/test_genge_formal_portfolio_allocator.py"
      - "tests/test_genge_drawdown_risk_policy.py"
      - ".github/workflows/genge-formal-portfolio-allocator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Validate portfolio allocator
        run: |
          python -m py_compile \
            src/strategies/genge_opportunity_discovery/drawdown_risk_policy.py \
            src/strategies/genge_opportunity_discovery/formal_portfolio_allocator.py
          python -m pytest -q \
            tests/test_genge_drawdown_risk_policy.py \
            tests/test_genge_formal_portfolio_allocator.py
