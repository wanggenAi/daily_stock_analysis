name: GenGe Historical Combined Risk Stack

on:
  pull_request:
    paths:
      - "src/strategies/genge_opportunity_discovery/historical_combined_risk_stack.py"
      - "src/strategies/genge_opportunity_discovery/historical_dynamic_cluster_guard.py"
      - "src/strategies/genge_opportunity_discovery/historical_systemic_index_guard.py"
      - "src/strategies/genge_opportunity_discovery/historical_concentration_guard.py"
      - "src/strategies/genge_opportunity_discovery/historical_correlation_cluster_guard.py"
      - "src/strategies/genge_opportunity_discovery/historical_portfolio_risk_budget.py"
      - "tests/test_historical_combined_risk_stack.py"
      - "config/genge_hard_logic_famous_cases.csv"
      - "config/board_risk_rules.yaml"
      - ".github/workflows/genge-historical-combined-risk-stack.yml"
  workflow_dispatch:
    inputs:
      start_date:
        required: false
        default: "2018-01-01"
        type: string
      end_date:
        required: false
        default: "2026-08-18"
        type: string

permissions:
  contents: read

concurrency:
  group: genge-historical-combined-risk-stack-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Validate combined stack timing
        run: |
          python -m py_compile src/strategies/genge_opportunity_discovery/historical_combined_risk_stack.py
          python -m pytest -q tests/test_historical_combined_risk_stack.py

  public-data-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Cache historical public data
        uses: actions/cache@v4
        with:
          path: data/cache/hard_logic_history_backtest
          key: hard-logic-history-v3-${{ runner.os }}-${{ hashFiles('config/genge_hard_logic_famous_cases.csv') }}
      - name: Cache systemic index data
        uses: actions/cache@v4
        with:
          path: data/cache/systemic_index_guard
          key: systemic-index-v1-${{ runner.os }}
      - name: Resolve replay dates
        shell: bash
        run: |
          echo "START_DATE=${{ inputs.start_date || '2018-01-01' }}" >> "$GITHUB_ENV"
          echo "END_DATE=${{ inputs.end_date || '2026-08-18' }}" >> "$GITHUB_ENV"
      - name: Run combined risk stack
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.historical_combined_risk_stack \
            --cases-file config/genge_hard_logic_famous_cases.csv \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --output-dir reports/historical_combined_risk_stack \
            --cache-dir data/cache/hard_logic_history_backtest \
            --index-cache-dir data/cache/systemic_index_guard \
            --board-rules-file config/board_risk_rules.yaml \
            --evaluation-stride 5 \
            --cost-bps-per-side 15
      - name: Validate output contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path('reports/historical_combined_risk_stack')
          required = [
              root/'historical_combined_risk_stack_summary.json',
              root/'historical_combined_risk_stack.md',
              root/'combined_risk_stack_comparison.csv',
              root/'dynamic_base_audit.csv',
              root/'combined_systemic_daily.csv',
          ]
          for path in required:
              assert path.exists() and path.stat().st_size > 0, path
          summary = json.loads((root/'historical_combined_risk_stack_summary.json').read_text(encoding='utf-8'))
          assert summary['stock_entry_exit_signal_set_frozen'] is True
          assert summary['dynamic_cluster_point_in_time'] is True
          assert summary['dynamic_trim_executes_next_open'] is True
          assert summary['systemic_signal_point_in_time'] is True
          assert summary['systemic_exposure_applies_next_session'] is True
          assert summary['all_layers_charge_explicit_friction'] is True
          assert summary['production_deployment_allowed'] is False
          assert summary['risk_geometry_audit']['risk_geometry_coverage_ratio'] > 0.50
          rows = list(csv.DictReader((root/'combined_risk_stack_comparison.csv').open(encoding='utf-8')))
          assert len(rows) == 10
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/historical_combined_risk_stack/historical_combined_risk_stack.md ]; then
            cat reports/historical_combined_risk_stack/historical_combined_risk_stack.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-historical-combined-risk-stack
          path: reports/historical_combined_risk_stack
          if-no-files-found: error
