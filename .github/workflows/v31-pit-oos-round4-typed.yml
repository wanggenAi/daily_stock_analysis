name: V3.1 PIT OOS round 4 typed valuation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v31_pit_oos_round4_typed_valuation.py'
      - 'docs/V31_TYPED_VALUATION_DRAFT.md'
      - '.github/workflows/v31-pit-oos-round4-typed.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check whether round-4 result already exists
        id: existing
        shell: bash
        run: |
          if [ -f backtests/v31_pit_oos_round4_typed/summary.csv ]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
            echo 'Round-4 typed OOS already persisted; skipping.'
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.done != 'true'
        with:
          python-version: '3.11'

      - name: Install runtime
        if: steps.existing.outputs.done != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install 'akshare>=1.12.0' 'pandas>=2.0.0' 'numpy>=1.24.0' 'yfinance>=0.2.0' tabulate

      - name: Run frozen round-4 typed OOS
        if: steps.existing.outputs.done != 'true'
        run: python scripts/v31_pit_oos_round4_typed_valuation.py

      - name: Persist auditable round-4 results
        if: steps.existing.outputs.done != 'true' && success()
        run: |
          rm -rf backtests/v31_pit_oos_round4_typed
          mkdir -p backtests/v31_pit_oos_round4_typed
          cp -a artifacts/v31_pit_oos_round4_typed/. backtests/v31_pit_oos_round4_typed/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/v31_pit_oos_round4_typed
          if ! git diff --cached --quiet; then
            git commit -m 'Store V3.1 round-4 typed valuation OOS results'
            git push
          fi

      - name: Upload round-4 artifacts
        if: steps.existing.outputs.done != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-pit-oos-round4-typed
          path: artifacts/v31_pit_oos_round4_typed/
          if-no-files-found: warn
