name: GenGe Start Opportunity Discovery Now

on:
  push:
    branches: [main]
    paths: [".github/workflows/genge-start-opportunity-now.yml"]

permissions:
  contents: read
  actions: write

jobs:
  release-production-concurrency:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel non-production Opportunity Discovery push runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t RUN_IDS < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow genge-opportunity-discovery.yml \
              --event push \
              --branch main \
              --limit 20 \
              --json databaseId,status \
              --jq '.[] | select(.status != "completed") | .databaseId'
          )
          for run_id in "${RUN_IDS[@]}"; do
            echo "Cancelling fixture push run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done
          echo "Production workflow_dispatch run 35427591974 remains authoritative."
