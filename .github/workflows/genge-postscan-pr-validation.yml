name: GenGe Postscan PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/GENGE_POSTSCAN_PR_TRIGGER.md"

permissions:
  contents: write
  actions: write

concurrency:
  group: genge-postscan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Download validated Fresh All-A artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32090231706

      - name: Run focused Postscan tests
        run: |
          python -m pytest -q \
            tests/test_genge_fundamental_cashflow_units.py \
            tests/test_genge_industry_coverage.py \
            tests/test_genge_industry_valuation_bridge.py \
            tests/test_genge_long_term_second_pass.py \
            tests/test_genge_long_term_valuation_merge.py \
            tests/test_genge_valuation_research_long_term_runner.py \
            tests/test_genge_long_term_formal_buy.py \
            tests/test_genge_zero_buy_audit.py \
            tests/test_genge_valuation_research_report.py \
            tests/test_genge_valuation_research_production.py \
            tests/test_genge_valuation_company_profiles.py \
            tests/test_genge_valuation_model_routing.py \
            tests/test_genge_resource_asset_valuation.py

      - name: Build every-industry research map and long-term second pass
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_coverage \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/industry_coverage \
            --per-industry 5
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_second_pass \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/long_term_second_pass

      - name: Build final valuation source
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_valuation_bridge \
            --all-a-report upstream/reports/all_a_full_scan \
            --industry-coverage reports/industry_coverage \
            --output-dir reports/industry_valuation_source \
            --global-limit 80 \
            --relaxed-reserve 20 \
            --per-industry 3
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_valuation_merge \
            --valuation-source-dir reports/industry_valuation_source \
            --long-term-dir reports/long_term_second_pass \
            --output-dir reports/final_valuation_source

      - name: Validate pre-valuation recall contract
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          industry = list(csv.DictReader(Path('reports/industry_coverage/industry_top_candidates.csv').open(encoding='utf-8')))
          source = list(csv.DictReader(Path('reports/final_valuation_source/all_a_quant_screen.csv').open(encoding='utf-8')))
          long_term = list(csv.DictReader(Path('reports/long_term_second_pass/long_term_second_pass_candidates.csv').open(encoding='utf-8')))
          clean = {r['industry'] for r in industry if r['industry_candidate_state'] == 'RESEARCH_CANDIDATE'}
          represented = {r.get('industry','') for r in source if 'INDUSTRY_CHAMPION' in r.get('valuation_source_channel','') or r.get('valuation_source_channel') == 'BOTH'}
          assert not (clean - represented), f'missing industries: {sorted(clean-represented)}'
          by_code = {r['code']: r for r in source}
          missing = sorted(r['code'] for r in long_term if r['code'] not in by_code)
          assert not missing, f'long-term candidates missing from valuation source: {missing}'
          assert all('LONG_TERM_SECOND_PASS' in by_code[r['code']].get('valuation_source_channel','') for r in long_term)
          print(f'clean_industries={len(clean)} represented={len(represented)} long_term={len(long_term)} source={len(source)}')
          PY

      - name: Build reverse valuation with long-term financial priority
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_research_long_term_runner \
            --report-dir reports/final_valuation_source \
            --output-dir reports/valuation_research_queue \
            --fundamental-cache-dir data/cache/valuation_research_fundamentals \
            --research-limit 500 \
            --relaxed-reserve 420 \
            --financial-review-limit 100 \
            --years 5 \
            --minimum-pe-samples 20 \
            --max-workers 8

      - name: Route valuation models and build long-term Formal BUY
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_model_routing \
            --report-root reports/valuation_research_queue \
            --profile-config config/valuation_company_profiles.yaml
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_formal_buy \
            --report-root upstream/reports/all_a_full_scan \
            --long-term-dir reports/long_term_second_pass \
            --valuation-root reports/valuation_research_queue \
            --output-dir reports/long_term_formal_buy
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.zero_buy_audit \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/zero_buy_audit

      - name: Validate terminal Postscan contract
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          runs = sorted(p for p in Path('reports/valuation_research_queue').iterdir() if p.is_dir())
          assert runs, 'no valuation research run'
          latest = runs[-1]
          for name in ('valuation_research_queue.csv','valuation_research_summary.json','valuation_research_routed.csv','valuation_routing_summary.json'):
              assert (latest/name).exists(), name
          rows = list(csv.DictReader((latest/'valuation_research_queue.csv').open(encoding='utf-8')))
          routed = list(csv.DictReader((latest/'valuation_research_routed.csv').open(encoding='utf-8')))
          long_term = list(csv.DictReader(Path('reports/long_term_second_pass/long_term_second_pass_candidates.csv').open(encoding='utf-8')))
          lt_codes = {r['code'] for r in long_term}
          by_code = {r['code']: r for r in rows}
          assert not (lt_codes - set(by_code)), f'long-term dropped: {sorted(lt_codes-set(by_code))}'
          assert all('LONG_TERM_SECOND_PASS' in by_code[c].get('valuation_source_channel','') for c in lt_codes)
          if len(lt_codes) <= 100:
              reviewed = {c for c in lt_codes if by_code[c].get('financial_review_status') != 'NOT_SELECTED_FOR_DEEP_FINANCIAL_REVIEW'}
              assert reviewed == lt_codes, f'long-term financial review missing: {sorted(lt_codes-reviewed)}'
          routing = json.loads((latest/'valuation_routing_summary.json').read_text(encoding='utf-8'))
          assert len(routed) == len(rows) == routing['routed_count']
          formal_rows = list(csv.DictReader(Path('reports/long_term_formal_buy/long_term_formal_buy_candidates.csv').open(encoding='utf-8')))
          formal = json.loads(Path('reports/long_term_formal_buy/long_term_formal_buy_summary.json').read_text(encoding='utf-8'))
          zero = json.loads(Path('reports/zero_buy_audit/zero_buy_audit.json').read_text(encoding='utf-8'))
          assert formal['legacy_exit_profile_is_long_term_veto'] is False
          if zero['requires_second_pass'] and formal['long_term_formal_buy_count'] == 0:
              unresolved_tokens = {'valuation_missing','valuation_model_not_executed','valuation_diagnostic_not_ready','financial_review_not_ready','required_profit_growth_unavailable'}
              counts = Counter()
              for row in formal_rows:
                  counts.update(x for x in str(row.get('long_term_blockers') or '').split(';') if x)
              unresolved = sorted(x for x in unresolved_tokens if counts[x])
              assert not unresolved, f'unresolved research/model gaps cannot justify zero BUY: {unresolved}'
          print(json.dumps({'valuation_count':len(rows),'routed_count':len(routed),'long_term_formal_buy':formal,'zero_buy':zero},ensure_ascii=False,indent=2))
          PY

      - name: Upload PR Postscan validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-postscan-pr-validation
          path: |
            reports/industry_coverage
            reports/long_term_second_pass
            reports/industry_valuation_source
            reports/final_valuation_source
            reports/valuation_research_queue
            reports/long_term_formal_buy
            reports/zero_buy_audit
          if-no-files-found: error

  migrate-normal-production:
    if: github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Switch normal All-A production to progress runner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/genge-opportunity-discovery.yml')
          text = path.read_text(encoding='utf-8')
          old_name = '      - name: Run unified all-A production scan\n'
          new_name = '      - name: Run unified all-A production scan with progress\n'
          old_module = '          python -m src.strategies.genge_opportunity_discovery.all_a_full_scan \\\n'
          new_module = '          python -m src.strategies.genge_opportunity_discovery.all_a_progress_runner \\\n'
          old_tail = '''            --exit-profile-file data/opportunity_snapshots/exit_profile.csv &
          scan_pid=$!
          while kill -0 "$scan_pid" 2>/dev/null; do
            echo "all-A scan heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 60
          done
          wait "$scan_pid"
'''
          new_tail = '            --exit-profile-file data/opportunity_snapshots/exit_profile.csv\n'
          assert text.count(old_name) == 1
          assert text.count(old_module) == 1
          assert text.count(old_tail) == 1
          text = text.replace(old_name, new_name, 1)
          text = text.replace(old_module, new_module, 1)
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/genge-opportunity-discovery.yml
          git diff --cached --check
          git commit -m "ci: use progress runner for normal All-A production"
          git push origin HEAD:main

      - name: Dispatch normal production workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run genge-opportunity-discovery.yml --repo "$REPO" --ref main
          run_line=""
          for _ in $(seq 1 15); do
            sleep 4
            run_line=$(gh api "repos/${REPO}/actions/workflows/genge-opportunity-discovery.yml/runs?event=workflow_dispatch&per_page=10" \
              --jq --arg cutoff "$dispatched_at" '[.workflow_runs[] | select(.created_at >= $cutoff)] | sort_by(.created_at) | reverse | .[0] // empty | [.id,.status,(.conclusion // ""),.created_at,.head_sha,.html_url] | @tsv' || true)
            [ -n "$run_line" ] && break
          done
          [ -n "$run_line" ] || { echo "Normal production dispatch was not located" >&2; exit 1; }
          IFS=$'\t' read -r run_id status conclusion created head_sha url <<< "$run_line"
          echo "NORMAL_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "NORMAL_STATUS=$status" >> "$GITHUB_ENV"
          echo "NORMAL_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
          echo "NORMAL_CREATED=$created" >> "$GITHUB_ENV"
          echo "NORMAL_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "NORMAL_URL=$url" >> "$GITHUB_ENV"

      - name: Persist normal production runtime locator
        run: |
          git pull --rebase
          cat > docs/GENGE_NORMAL_PRODUCTION_RUNTIME.md <<EOF
          # GenGe Normal Production Runtime

          validation_stage: NORMAL_PRODUCTION_AFTER_PROGRESS_RUNNER_MIGRATION
          workflow: GenGe Opportunity Discovery
          event: workflow_dispatch
          run_id: ${NORMAL_RUN_ID}
          status: ${NORMAL_STATUS}
          conclusion: ${NORMAL_CONCLUSION}
          created_at_utc: ${NORMAL_CREATED}
          head_sha: ${NORMAL_HEAD_SHA}
          url: ${NORMAL_URL}
          expected_runner: src.strategies.genge_opportunity_discovery.all_a_progress_runner
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_NORMAL_PRODUCTION_RUNTIME.md
          git commit -m "docs: record normal production validation run [skip ci]"
          git push origin HEAD:main
