name: GenGe Postscan PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/GENGE_POSTSCAN_PR_TRIGGER.md"

permissions:
  contents: read
  actions: write

concurrency:
  group: genge-postscan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  locate-canonical-postscan:
    name: Locate canonical Postscan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate or dispatch canonical Postscan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: "32099563360"
          CUTOFF: "2026-08-18T05:06:00Z"
        run: |
          set -euo pipefail
          run_line=$(gh api "repos/${REPO}/actions/workflows/genge-postscan-research.yml/runs?per_page=20" \
            --jq '.workflow_runs[] | select(.created_at >= env.CUTOFF) | [.id,.event,.status,(.conclusion // ""),.created_at,.head_sha,.html_url] | @tsv' \
            | head -1 || true)
          if [ -n "$run_line" ]; then
            printf 'CANONICAL_POSTSCAN=%s\n' "$run_line"
            exit 0
          fi
          echo "No automatic canonical Postscan found after ${CUTOFF}; dispatching with upstream ${UPSTREAM_RUN_ID}."
          dispatch_output=$(gh workflow run genge-postscan-research.yml --repo "$REPO" --ref main -f upstream_run_id="$UPSTREAM_RUN_ID" 2>&1)
          printf '%s\n' "$dispatch_output"
          run_id=$(printf '%s\n' "$dispatch_output" | sed -n 's#.*actions/runs/\([0-9][0-9]*\).*#\1#p' | tail -1)
          if [ -z "$run_id" ]; then
            sleep 5
            run_id=$(gh api "repos/${REPO}/actions/workflows/genge-postscan-research.yml/runs?event=workflow_dispatch&per_page=10" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')
          fi
          [ -n "$run_id" ] || { echo "Unable to resolve canonical Postscan run id" >&2; exit 1; }
          gh api "repos/${REPO}/actions/runs/${run_id}" \
            --jq '[.id,.event,.status,(.conclusion // ""),.created_at,.head_sha,.html_url] | @tsv' \
            | sed 's/^/CANONICAL_POSTSCAN=/'
