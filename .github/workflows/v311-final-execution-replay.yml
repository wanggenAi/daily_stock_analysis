name: V3.1.1 Final Execution Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/v31_pit_execution_utils.py"
      - "scripts/v311_final_execution_replay.py"
      - "tests/test_v31_pit_execution_alignment.py"
      - ".github/workflows/v311-final-execution-replay.yml"

permissions:
  contents: write

concurrency:
  group: v311-final-execution-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Run execution regression tests
        run: python -m pytest -q tests/test_v31_pit_execution_alignment.py
      - name: Replay frozen Round 8 panels
        run: PYTHONUNBUFFERED=1 python scripts/v311_final_execution_replay.py --round 8
      - name: Replay frozen Round 9 panels
        run: PYTHONUNBUFFERED=1 python scripts/v311_final_execution_replay.py --round 9
      - name: Publish replay artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v311-final-execution-replay
          path: artifacts/v311_final_execution_replay_round*
      - name: Commit corrected replay results
        if: success()
        run: |
          mkdir -p backtests
          rm -rf backtests/v311_final_execution_replay_round8
          rm -rf backtests/v311_final_execution_replay_round9
          cp -R artifacts/v311_final_execution_replay_round8 backtests/v311_final_execution_replay_round8
          cp -R artifacts/v311_final_execution_replay_round9 backtests/v311_final_execution_replay_round9
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/v311_final_execution_replay_round8 backtests/v311_final_execution_replay_round9
          git diff --cached --quiet && exit 0
          git commit -m "Store corrected V3.1.1 final execution replay"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
