name: GenGe Insurance Production Replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-insurance-production-replay.yml"

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Download validated Postscan artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-postscan-research
          path: replay
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32109532494
      - name: Execute insurance reverse appraisal
        run: |
          python -m src.strategies.genge_opportunity_discovery.insurance_valuation_execution \
            --report-root replay/valuation_research_queue \
            --input-config config/insurance_embedded_value_inputs.yaml \
            --cache-dir data/cache/insurance-production-replay \
            --years 3
      - name: Validate production replay
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('replay/valuation_research_queue')
          report_dirs = sorted(p for p in root.iterdir() if p.is_dir())
          assert report_dirs
          latest = report_dirs[-1]
          rows = list(csv.DictReader((latest/'insurance_valuation_execution.csv').open(encoding='utf-8')))
          by_code = {row['code']: row for row in rows}
          summary = json.loads((latest/'insurance_valuation_execution_summary.json').read_text(encoding='utf-8'))
          assert summary['insurance_selected_count'] == 3
          assert summary['insurance_executed_count'] == 2
          assert summary['insurance_input_required_count'] == 1
          assert summary['ranking_changed'] is False
          assert summary['formal_buy_consumes_insurance_sidecar'] is False
          assert summary['no_auto_trade'] is True
          for code in ('601628','601601'):
              row = by_code[code]
              assert row['insurance_model_execution_state'] == 'INSURANCE_MODEL_EXECUTED_RESEARCH_ONLY'
              assert row['insurance_model_status'] == 'OK'
              assert float(row['insurance_market_cap_cny_million']) > 0
              assert float(row['insurance_embedded_value_cny_million']) > 0
              assert float(row['insurance_normalized_annual_nbv_cny_million']) > 0
              assert float(row['insurance_implied_nbv_franchise_multiple']) < 0
              assert row['insurance_market_cap_input_basis'] == 'AKSHARE_BAIDU_TOTAL_MARKET_CAP_CNY_100M_X100_TO_CNY_MILLION'
              assert row['no_auto_trade'] == 'True'
          picc = by_code['601319']
          assert picc['insurance_model_execution_state'] == 'INSURANCE_MODEL_SELECTED_INPUTS_REQUIRED'
          assert picc['insurance_model_status'] == 'INSURANCE_GROUP_EV_NBV_SCOPE_REQUIRED'
          print(json.dumps({
              'summary': summary,
              '601628_implied_multiple': by_code['601628']['insurance_implied_nbv_franchise_multiple'],
              '601601_implied_multiple': by_code['601601']['insurance_implied_nbv_franchise_multiple'],
              '601319_status': picc['insurance_model_status'],
          }, ensure_ascii=False, indent=2))
          PY
