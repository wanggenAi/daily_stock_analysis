name: TEMP Exact Recall Production Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-exact-recall-production-validation.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-negative-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch historical skipped wrapper through current exact-lineage resolver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run genge-success-archetype-recall.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_terminal_run_id=34565436187
