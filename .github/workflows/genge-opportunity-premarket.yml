name: GenGe Opportunity Premarket Dispatch

on:
  schedule:
    # 06:00 Beijing time Monday-Friday = 22:00 UTC Sunday-Thursday.
    # The full All-A run has historically taken about an hour and GitHub cron
    # can start late, so this leaves substantial buffer before the 09:30 open.
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The initial merge of this dispatcher performs one production rehearsal.
      # Later ordinary code pushes do not trigger this workflow.
      - ".github/workflows/genge-opportunity-premarket.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: genge-opportunity-premarket-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch premarket All-A opportunity scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch GenGe Opportunity Discovery on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genge-opportunity-discovery.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main

      - name: Record dispatch contract
        run: |
          {
            echo "# GenGe Premarket Dispatch"
            echo
            echo "- target workflow: GenGe Opportunity Discovery"
            echo "- target ref: main"
            echo "- intended Beijing run time: 06:00 Monday-Friday"
            echo "- downstream: GenGe Valuation Research Queue via workflow_run"
          } >> "$GITHUB_STEP_SUMMARY"
