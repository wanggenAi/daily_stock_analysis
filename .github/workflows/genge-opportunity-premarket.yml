name: GenGe Opportunity Premarket Dispatch

on:
  schedule:
    # 06:00 Beijing time Monday-Friday = 22:00 UTC Sunday-Thursday.
    # Industry-balanced All-A + valuation research is long-horizon and can run
    # well before the 09:30 open; this leaves buffer for public-data delays.
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # A change to this dispatcher performs one production rehearsal after merge.
      - ".github/workflows/genge-opportunity-premarket.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: genge-opportunity-premarket-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch premarket industry-balanced research
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch GenGe Industry-Balanced Research on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genge-industry-balanced-research.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main

      - name: Record dispatch contract
        run: |
          {
            echo "# GenGe Premarket Dispatch"
            echo
            echo "- target workflow: GenGe Industry-Balanced Research"
            echo "- target ref: main"
            echo "- intended Beijing run time: 06:00 Monday-Friday"
            echo "- pipeline: All-A -> industry-protected recall -> fundamentals -> reverse valuation -> Strategy Router"
            echo "- invariant: every industry with at least one eligible candidate must remain represented"
          } >> "$GITHUB_STEP_SUMMARY"
