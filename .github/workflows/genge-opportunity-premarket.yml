name: GenGe Opportunity Premarket Dispatch

on:
  schedule:
    # 06:00 Beijing time Monday-Friday = 22:00 UTC Sunday-Thursday.
    # The full All-A run has historically taken about an hour and GitHub cron
    # can start late, so this leaves substantial buffer before the 09:30 open.
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The initial merge of this dispatcher performs one production rehearsal.
      # Later ordinary code pushes do not trigger this workflow.
      - ".github/workflows/genge-opportunity-premarket.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: genge-opportunity-premarket-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch authoritative GenGe V3.1.1 premarket production scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch GenGe All-A V3.1.1 One Shot on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run genge-all-a-v31-once.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main

      - name: Record dispatch contract
        run: |
          {
            echo "# GenGe Premarket Dispatch"
            echo
            echo "- target workflow: GenGe All-A V3.1.1 One Shot"
            echo "- target ref: main"
            echo "- intended Beijing run time: 06:00 Monday-Friday"
            echo "- production entrypoint: V3.1.1 strict-PIT production bridge"
            echo "- policy: frozen V3.1.1 / Round8-Round9 confidence gate / no auto trade"
            echo "- legacy GenGe Opportunity Discovery remains research-only upstream for Postscan Research"
          } >> "$GITHUB_STEP_SUMMARY"
