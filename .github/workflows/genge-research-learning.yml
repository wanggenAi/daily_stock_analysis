name: GenGe V3.1.1 Research Learning

on:
  workflow_run:
    # Hourly state is persisted first, which triggers Operating Ledger; learning
    # follows the successful Ledger so we do not run twice for the same hour.
    workflows:
      - "GenGe V3.1.1 Operating Ledger"
    types: [completed]
  schedule:
    # Beijing 17:15 on weekdays: end-of-day learning/outcome refresh.
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-research-learning.yml"
      - "src/strategies/genge_opportunity_discovery/research_priority_router.py"
      - "src/strategies/genge_opportunity_discovery/price_value_history_summary.py"
      - "src/strategies/genge_opportunity_discovery/formal_decision_outcomes.py"
      - "src/strategies/genge_opportunity_discovery/hourly_research_state.py"
      - "src/strategies/genge_opportunity_discovery/v31_review_queue.py"
      - "src/strategies/genge_opportunity_discovery/production_observability.py"
      - "tests/test_genge_research_priority_router.py"
      - "tests/test_genge_price_value_history_summary.py"
      - "tests/test_genge_formal_decision_outcomes.py"
      - "tests/test_genge_hourly_research_state.py"
      - "tests/test_genge_v31_review_priority_order.py"
      - "tests/test_genge_production_observability.py"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

concurrency:
  group: genge-v311-research-learning
  cancel-in-progress: false

jobs:
  build-learning-state:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research-learning test harness
        run: |
          python -m pip install --disable-pip-version-check -q \
            pandas pytest anyio fastapi httpx starlette PyYAML requests beautifulsoup4 pypdf

      - name: Build and persist learning state with optimistic replay
        run: |
          set -euo pipefail
          git config user.name "genge-v311-research-learning-bot"
          git config user.email "31836791+wanggenAi@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            echo "research-learning replay attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            git clean -fdx -- \
              data/research_priority \
              data/price_value_history \
              data/formal_decision_outcomes \
              data/production_observability

            python -m pytest -q \
              tests/test_genge_hourly_research_state.py \
              tests/test_genge_research_priority_router.py \
              tests/test_genge_price_value_history_summary.py \
              tests/test_genge_formal_decision_outcomes.py \
              tests/test_genge_v31_review_priority_order.py \
              tests/test_genge_production_observability.py

            python -m src.strategies.genge_opportunity_discovery.price_value_history_summary \
              --history-root data/hourly_deep_overlay \
              --output data/price_value_history/summary.json

            python -m src.strategies.genge_opportunity_discovery.research_priority_router \
              --hourly data/hourly_research_state/latest.json \
              --lifecycle data/opportunity_snapshots/candidate_lifecycle_state.json \
              --coverage data/research_mapping/coverage.json \
              --output data/research_priority/latest.json

            python -m src.strategies.genge_opportunity_discovery.formal_decision_outcomes \
              --history data/formal_decision_history/history.jsonl \
              --price-history-root data/hourly_deep_overlay \
              --output data/formal_decision_outcomes/latest.json

            python -m src.strategies.genge_opportunity_discovery.production_observability \
              --root . \
              --output data/production_observability/latest.json

            python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('data/research_priority/latest.json').read_text(encoding='utf-8'))
          p = json.loads(Path('data/price_value_history/summary.json').read_text(encoding='utf-8'))
          o = json.loads(Path('data/formal_decision_outcomes/latest.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/production_observability/latest.json').read_text(encoding='utf-8'))
          assert q['formal_action_source'] == 'FINALIZED_CANONICAL_ONLY'
          assert q['formal_action_recomputed'] is False
          assert q['formal_action_eligible'] is False
          assert q['no_auto_trade'] is True
          assert p['formal_action_recomputed'] is False
          assert p['formal_action_eligible'] is False
          assert o['formal_action_recomputed'] is False
          assert o['formal_action_eligible'] is False
          assert o['parameter_tuning_allowed'] is False
          assert o['no_auto_trade'] is True
          assert health['checks']['research_priority_available'] is True
          assert health['checks']['price_value_history_available'] is True
          assert health['checks']['formal_decision_outcomes_available'] is True
          assert health['checks']['learning_layer_research_only'] is True
          PY

            git add -f \
              data/research_priority \
              data/price_value_history \
              data/formal_decision_outcomes \
              data/production_observability/latest.json
            if git diff --cached --quiet; then
              echo "No learning state change to persist"
              exit 0
            fi
            git commit -m "Persist V3.1.1 research learning state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push race detected; replaying learning state from newest origin/main" >&2
          done

          echo "research-learning persistence failed after 4 optimistic replay attempts" >&2
          exit 1

      - name: Upload research learning artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-v311-research-learning-${{ github.run_id }}
          path: |
            data/research_priority
            data/price_value_history
            data/formal_decision_outcomes
            data/production_observability/latest.json
          if-no-files-found: warn
          retention-days: 60

      - name: Publish summary
        if: always()
        run: |
          echo "# GenGe V3.1.1 Research Learning" >> "$GITHUB_STEP_SUMMARY"
          echo "- persistence: optimistic replay on newest main" >> "$GITHUB_STEP_SUMMARY"
          echo "- learning outputs remain research-only and cannot change Formal actions" >> "$GITHUB_STEP_SUMMARY"
          echo "- automatic V3.1.1 parameter tuning remains disabled" >> "$GITHUB_STEP_SUMMARY"
