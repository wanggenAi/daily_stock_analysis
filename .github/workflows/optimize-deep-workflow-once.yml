name: Optimize Deep Workflow Bootstrap Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-deep-workflow-once.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build validated optimized Deep workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/genge-v31-deep-calculation-lambda.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('  contracts:\n')
          deep = text.index('  deep-calculate:\n', start)
          prefix = text[:start]
          rest = text[deep:]
          rest = rest.replace(
              '  deep-calculate:\n    needs: contracts\n    runs-on: ubuntu-latest\n',
              "  deep-calculate:\n    if: >-\n      github.event_name != 'workflow_run' ||\n      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')\n    runs-on: ubuntu-latest\n",
              1,
          )
          install = '''      - name: Install runtime dependencies\n        run: |\n          python -m pip install --upgrade pip --retries 5 --timeout 60\n          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt\n'''
          contract = '''\n      - name: Validate automatic deep-calculation contracts\n        run: |\n          python -m pytest -q \\\n            tests/test_genge_v31_explicit_deep_review.py \\\n            tests/test_genge_v31_automatic_deep_calculation.py \\\n            tests/test_v31_deep_gap_closure.py \\\n            tests/test_v31_deep_gap_closure_optimized.py \\\n            tests/test_v31_deep_workset.py \\\n            tests/test_v31_multi_year_predictability.py \\\n            tests/test_v31_deep_provenance_audit.py \\\n            tests/test_runbei_archetype_deep_handoff.py \\\n            tests/test_genge_v31_deep_calculation_workflow_contract.py\n'''
          if install not in rest:
              raise SystemExit('runtime dependency block not found; refusing unsafe rewrite')
          rest = rest.replace(install, install + contract, 1)
          updated = prefix + rest
          required = [
              '  deep-calculate:\n    if: >-',
              '- name: Validate automatic deep-calculation contracts',
              '- name: Execute automatic deep calculation initial pass',
              '- name: Close unresolved gates with optimized quality-preserving official evidence',
              '- name: Fail closed if official-evidence closure did not terminate',
              "status['research_terminal_state'] in {'COMPLETE','EVIDENCE_EXHAUSTED','HANDOFF_INCOMPLETE'}",
              'gh workflow run genge-v31-deep-provenance-audit.yml',
              'gh workflow run genge-v31-terminal-research-decision.yml',
              'DEEP_CODE_EPOCH_SHA=$(git rev-parse HEAD)',
          ]
          for marker in required:
              if marker not in updated:
                  raise SystemExit(f'missing required marker after rewrite: {marker}')
          if '  contracts:\n' in updated or '    needs: contracts\n' in updated:
              raise SystemExit('duplicate contracts job still present')
          if updated.count('uses: actions/setup-python@v5') != 1:
              raise SystemExit('expected exactly one setup-python action')
          if updated.count('- name: Install runtime dependencies') != 1:
              raise SystemExit('expected exactly one dependency install')
          if 'gh workflow run genge-three-pillar-decision-center.yml' in updated:
              raise SystemExit('stale decision-center dispatch must remain absent')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate syntax and execution ordering
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/genge-v31-deep-calculation-lambda.yml')
          text=path.read_text(encoding='utf-8')
          payload=yaml.safe_load(text)
          jobs=payload['jobs']
          assert set(jobs)=={'deep-calculate'}
          deep=jobs['deep-calculate']
          assert deep['runs-on']=='ubuntu-latest'
          assert deep['timeout-minutes']==120
          names=[step.get('name') for step in deep['steps'] if isinstance(step,dict)]
          assert names.index('Validate automatic deep-calculation contracts') < names.index('Execute automatic deep calculation initial pass')
          assert names.index('Validate automatic deep-calculation contracts') < names.index('Close unresolved gates with optimized quality-preserving official evidence')
          assert 'Fail closed if official-evidence closure did not terminate' in names
          PY

      - name: Stage optimized workflow as ordinary blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .workflow_tmp
          cp .github/workflows/genge-v31-deep-calculation-lambda.yml .workflow_tmp/genge-v31-deep-calculation-lambda.yml
          git checkout -- .github/workflows/genge-v31-deep-calculation-lambda.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow_tmp/genge-v31-deep-calculation-lambda.yml
          git diff --cached --check
          git commit -m "Stage validated optimized Deep workflow blob [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
