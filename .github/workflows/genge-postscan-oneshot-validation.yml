name: GenGe Postscan One-Shot Validation

on:
  push:
    branches: [main]
    paths:
      - "docs/GENGE_POSTSCAN_ONESHOT_TRIGGER.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-postscan-oneshot-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Download validated Fresh All-A artifact
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32090231706

      - name: Restore valuation fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-postscan-oneshot-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            genge-postscan-valuation-${{ runner.os }}-main-
            genge-valuation-research-${{ runner.os }}-main-
            genge-postscan-valuation-${{ runner.os }}-

      - name: Run focused postscan tests
        run: |
          python -m pytest -q \
            tests/test_genge_industry_coverage.py \
            tests/test_genge_industry_valuation_bridge.py \
            tests/test_genge_long_term_second_pass.py \
            tests/test_genge_long_term_valuation_merge.py \
            tests/test_genge_valuation_research_long_term_runner.py \
            tests/test_genge_long_term_formal_buy.py \
            tests/test_genge_zero_buy_audit.py \
            tests/test_genge_valuation_research_report.py \
            tests/test_genge_valuation_research_production.py \
            tests/test_genge_valuation_company_profiles.py \
            tests/test_genge_valuation_model_routing.py \
            tests/test_genge_resource_asset_valuation.py

      - name: Build every-industry Top 5 research map
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_coverage \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/industry_coverage \
            --per-industry 5

      - name: Build long-term second-pass candidates
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_second_pass \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/long_term_second_pass

      - name: Build industry-aware valuation source
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_valuation_bridge \
            --all-a-report upstream/reports/all_a_full_scan \
            --industry-coverage reports/industry_coverage \
            --output-dir reports/industry_valuation_source \
            --global-limit 80 \
            --relaxed-reserve 20 \
            --per-industry 3

      - name: Merge long-term second-pass into valuation source
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_valuation_merge \
            --valuation-source-dir reports/industry_valuation_source \
            --long-term-dir reports/long_term_second_pass \
            --output-dir reports/final_valuation_source

      - name: Validate recall coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          coverage = Path('reports/industry_coverage')
          final_source = Path('reports/final_valuation_source')
          lt = Path('reports/long_term_second_pass')
          industry_rows = list(csv.DictReader((coverage/'industry_top_candidates.csv').open(encoding='utf-8')))
          source_rows = list(csv.DictReader((final_source/'all_a_quant_screen.csv').open(encoding='utf-8')))
          lt_rows = list(csv.DictReader((lt/'long_term_second_pass_candidates.csv').open(encoding='utf-8')))
          clean = {r['industry'] for r in industry_rows if r['industry_candidate_state'] == 'RESEARCH_CANDIDATE'}
          represented = {
              r.get('industry','') for r in source_rows
              if 'INDUSTRY_CHAMPION' in r.get('valuation_source_channel','')
              or r.get('valuation_source_channel') == 'BOTH'
          }
          assert not (clean - represented), f'industries missing valuation representation: {sorted(clean-represented)}'
          by_code = {r['code']: r for r in source_rows}
          missing_lt = [r['code'] for r in lt_rows if r['code'] not in by_code]
          assert not missing_lt, f'long-term names missing valuation source: {missing_lt}'
          assert all('LONG_TERM_SECOND_PASS' in by_code[r['code']].get('valuation_source_channel','') for r in lt_rows)
          summary = json.loads((final_source/'long_term_valuation_source_summary.json').read_text(encoding='utf-8'))
          print(json.dumps({'clean_industry_count':len(clean),'represented_count':len(represented),'long_term':lt_rows,'source_summary':summary},ensure_ascii=False,indent=2))
          PY

      - name: Build reverse valuation with long-term financial priority
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_research_long_term_runner \
            --report-dir reports/final_valuation_source \
            --output-dir reports/valuation_research_queue \
            --fundamental-cache-dir data/cache/valuation_research_fundamentals \
            --research-limit 500 \
            --relaxed-reserve 420 \
            --financial-review-limit 100 \
            --years 5 \
            --minimum-pe-samples 20 \
            --max-workers 8

      - name: Route valuation models
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_model_routing \
            --report-root reports/valuation_research_queue \
            --profile-config config/valuation_company_profiles.yaml

      - name: Build long-term Formal BUY review
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_formal_buy \
            --report-root upstream/reports/all_a_full_scan \
            --long-term-dir reports/long_term_second_pass \
            --valuation-root reports/valuation_research_queue \
            --output-dir reports/long_term_formal_buy

      - name: Run Zero-BUY audit
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.zero_buy_audit \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/zero_buy_audit

      - name: Validate terminal production contract
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path

          root = Path('reports/valuation_research_queue')
          runs = sorted(p for p in root.iterdir() if p.is_dir())
          assert runs, 'no valuation research run'
          latest = runs[-1]
          required = [
              'valuation_research_queue.csv','valuation_research_summary.json',
              'valuation_research_routed.csv','valuation_routing_summary.json',
          ]
          assert not [n for n in required if not (latest/n).exists()]
          rows = list(csv.DictReader((latest/'valuation_research_queue.csv').open(encoding='utf-8')))
          routed = list(csv.DictReader((latest/'valuation_research_routed.csv').open(encoding='utf-8')))
          lt = list(csv.DictReader(Path('reports/long_term_second_pass/long_term_second_pass_candidates.csv').open(encoding='utf-8')))
          codes = {r['code'] for r in rows}
          assert not ({r['code'] for r in lt} - codes)
          tagged = {r['code'] for r in rows if 'LONG_TERM_SECOND_PASS' in r.get('valuation_source_channel','')}
          assert tagged.issuperset({r['code'] for r in lt})
          if len(lt) <= 100:
              reviewed = {r['code'] for r in rows if r['code'] in {x['code'] for x in lt} and r.get('financial_review_status') != 'NOT_SELECTED_FOR_DEEP_FINANCIAL_REVIEW'}
              assert reviewed == {r['code'] for r in lt}, f'long-term financial review missing: {sorted({r["code"] for r in lt}-reviewed)}'
          routing = json.loads((latest/'valuation_routing_summary.json').read_text(encoding='utf-8'))
          assert len(routed) == len(rows) == routing['routed_count']

          formal_rows = list(csv.DictReader(Path('reports/long_term_formal_buy/long_term_formal_buy_candidates.csv').open(encoding='utf-8')))
          formal = json.loads(Path('reports/long_term_formal_buy/long_term_formal_buy_summary.json').read_text(encoding='utf-8'))
          zero = json.loads(Path('reports/zero_buy_audit/zero_buy_audit.json').read_text(encoding='utf-8'))
          assert formal['legacy_exit_profile_is_long_term_veto'] is False
          if zero['requires_second_pass'] and formal['long_term_formal_buy_count'] == 0:
              unresolved_tokens = {
                  'valuation_missing','valuation_model_not_executed','valuation_diagnostic_not_ready',
                  'financial_review_not_ready','required_profit_growth_unavailable',
              }
              counts = Counter()
              for r in formal_rows:
                  counts.update(x for x in str(r.get('long_term_blockers') or '').split(';') if x)
              unresolved = sorted(x for x in unresolved_tokens if counts[x])
              assert not unresolved, f'unresolved research/model gaps cannot justify zero BUY: {unresolved}'
          print(json.dumps({'valuation_count':len(rows),'routing':routing,'long_term_formal_buy':formal,'zero_buy':zero},ensure_ascii=False,indent=2))
          PY

      - name: Upload one-shot Postscan validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-postscan-oneshot-validation
          path: |
            reports/industry_coverage
            reports/long_term_second_pass
            reports/industry_valuation_source
            reports/final_valuation_source
            reports/valuation_research_queue
            reports/long_term_formal_buy
            reports/zero_buy_audit
          if-no-files-found: error
