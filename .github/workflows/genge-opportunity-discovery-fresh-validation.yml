name: GenGe Opportunity Discovery

on:
  push:
    branches: [main]
    paths:
      - 'docs/GENGE_FRESH_VALIDATION_TRIGGER.md'
  pull_request:
    branches: [main]
    paths:
      - 'docs/GENGE_FRESH_VALIDATION_TRIGGER.md'
  schedule:
    # Temporary one-shot validation slot retained as fallback.
    - cron: '55 1 18 8 *'

permissions:
  contents: write
  actions: write

concurrency:
  group: genge-fresh-all-a-validation
  cancel-in-progress: false

jobs:
  all-a-production-report:
    name: All-A production research report
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[run-all-a]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Fresh runtime locator
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > docs/GENGE_FRESH_RUNTIME_STATUS.md <<EOF
          # GenGe Fresh Runtime Status

          status: RUNNING
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          head_sha: ${{ github.sha }}
          event: ${{ github.event_name }}
          started_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add docs/GENGE_FRESH_RUNTIME_STATUS.md
          git commit -m "chore: record Fresh validation runtime [skip ci]" || true
          git push || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Run focused production tests
        run: |
          python -m pytest -q \
            tests/test_genge_all_a_progress_runner.py \
            tests/test_genge_all_a_full_scan.py \
            tests/test_genge_long_term_second_pass.py \
            tests/test_genge_long_term_valuation_merge.py \
            tests/test_genge_valuation_research_long_term_runner.py \
            tests/test_genge_long_term_formal_buy.py

      - name: Restore all-A public-data cache and observation state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-
            genge-all-a-state-${{ runner.os }}-main-
            genge-all-a-state-${{ runner.os }}-

      - name: Prepare all-A research state
        run: |
          mkdir -p data/cache/all_a_full_scan data/cache/genge_fundamentals data/cache/opportunity_evidence
          mkdir -p data/opportunity_snapshots/all_a_state
          if [ ! -s data/opportunity_snapshots/exit_profile.csv ]; then
            cp data/opportunity_snapshots/exit_profile_seed.csv data/opportunity_snapshots/exit_profile.csv
          fi

      - name: Run unified all-A production scan with progress
        run: |
          PYTHONUNBUFFERED=1 timeout --signal=TERM 100m \
          python -m src.strategies.genge_opportunity_discovery.all_a_progress_runner \
            --max-workers 12 \
            --evidence-queue-size 80 \
            --deep-review-size 30 \
            --max-watchlist 15 \
            --fundamental-limit 30 \
            --industry-evidence-file data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence-file data/user_supplied/company_cycle_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --exit-profile-file data/opportunity_snapshots/exit_profile.csv

      - name: Validate fresh All-A output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/all_a_full_scan')
          runs = sorted(p for p in root.iterdir() if p.is_dir() and (p/'run_summary.json').exists())
          assert runs, 'no All-A output generated'
          latest = runs[-1]
          required = {
              'all_a_quant_screen.csv', 'top80_evidence_queue.csv', 'top30_deep_review.csv',
              'condition_watch.csv', 'research_watch.csv', 'strict_review_ready.csv',
              'run_summary.json', 'report_manifest.json'
          }
          missing = sorted(name for name in required if not (latest/name).exists())
          assert not missing, f'missing All-A outputs: {missing}'
          summary = json.loads((latest/'run_summary.json').read_text(encoding='utf-8'))
          assert summary['official_universe_count'] > 5000
          assert summary['effective_scan_count'] > 1000
          assert summary['fatal_data_failure_count'] == 0
          assert summary['no_auto_trade'] is True
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Save all-A public-data cache and observation state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload All-A production report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-all-a-production-report
          path: reports/all_a_full_scan
          if-no-files-found: error

      - name: Publish Fresh terminal status
        if: always() && github.event_name != 'pull_request'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          git pull --rebase || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > docs/GENGE_FRESH_RUNTIME_STATUS.md <<EOF
          # GenGe Fresh Runtime Status

          status: ${JOB_STATUS}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          head_sha: ${{ github.sha }}
          event: ${{ github.event_name }}
          finished_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add docs/GENGE_FRESH_RUNTIME_STATUS.md
          git commit -m "chore: record Fresh validation terminal status [skip ci]" || true
          git push || true

  dispatch-normal-production:
    name: Dispatch normal production proof
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[dispatch-normal-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch normal Opportunity Discovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run genge-opportunity-discovery.yml --repo "$REPO" --ref main
          run_line=""
          for _ in $(seq 1 15); do
            sleep 4
            run_line=$(gh api "repos/${REPO}/actions/workflows/genge-opportunity-discovery.yml/runs?event=workflow_dispatch&per_page=10" \
              --jq --arg cutoff "$dispatched_at" '[.workflow_runs[] | select(.created_at >= $cutoff)] | sort_by(.created_at) | reverse | .[0] // empty | [.id,.status,(.conclusion // ""),.created_at,.head_sha,.html_url] | @tsv' || true)
            [ -n "$run_line" ] && break
          done
          [ -n "$run_line" ] || { echo "Normal production dispatch was not located" >&2; exit 1; }
          IFS=$'\t' read -r run_id status conclusion created head_sha url <<< "$run_line"
          echo "NORMAL_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "NORMAL_STATUS=$status" >> "$GITHUB_ENV"
          echo "NORMAL_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
          echo "NORMAL_CREATED=$created" >> "$GITHUB_ENV"
          echo "NORMAL_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "NORMAL_URL=$url" >> "$GITHUB_ENV"
          echo "Dispatched normal production run $run_id status=$status head=$head_sha"

      - name: Persist normal production runtime locator
        run: |
          git pull --rebase
          cat > docs/GENGE_NORMAL_PRODUCTION_RUNTIME.md <<EOF
          # GenGe Normal Production Runtime

          validation_stage: NORMAL_PRODUCTION_AFTER_PROGRESS_RUNNER_MIGRATION
          workflow: GenGe Opportunity Discovery
          event: workflow_dispatch
          run_id: ${NORMAL_RUN_ID}
          status: ${NORMAL_STATUS}
          conclusion: ${NORMAL_CONCLUSION}
          created_at_utc: ${NORMAL_CREATED}
          head_sha: ${NORMAL_HEAD_SHA}
          url: ${NORMAL_URL}
          expected_runner: src.strategies.genge_opportunity_discovery.all_a_progress_runner
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_NORMAL_PRODUCTION_RUNTIME.md
          git commit -m "docs: record normal production validation run [skip ci]"
          git push origin HEAD:main
