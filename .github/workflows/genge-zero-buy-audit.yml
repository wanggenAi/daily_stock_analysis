name: GenGe Zero BUY Audit

on:
  workflow_run:
    workflows: ["GenGe Opportunity Discovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Opportunity Discovery run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  zero-buy-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Resolve upstream run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_RUN_ID=${{ inputs.upstream_run_id }}" >> "$GITHUB_ENV"
          fi
      - name: Download All-A production report
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}
      - name: Test zero-BUY audit
        run: python -m pytest -q tests/test_genge_zero_buy_audit.py
      - name: Audit Formal BUY outcome
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.zero_buy_audit \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/zero_buy_audit
      - name: Enforce non-silent zero-BUY contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/zero_buy_audit/zero_buy_audit.json')
          audit = json.loads(path.read_text(encoding='utf-8'))
          assert audit['status'] in {
              'FORMAL_BUY_PRESENT',
              'ZERO_BUY_DEFENSIVE_MARKET_ALLOWED',
              'ZERO_BUY_REQUIRES_SECOND_PASS',
          }
          # A non-defensive zero is not accepted as a final investment conclusion.
          # It must be routed to second-pass review instead of silently publishing zero.
          if audit['status'] == 'ZERO_BUY_REQUIRES_SECOND_PASS':
              assert audit['requires_second_pass'] is True
              assert audit['zero_buy_allowed'] is False
          else:
              assert audit['requires_second_pass'] is False
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY
      - name: Publish zero-BUY audit
        if: always()
        run: |
          if [ -f reports/zero_buy_audit/zero_buy_audit.md ]; then
            cat reports/zero_buy_audit/zero_buy_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload zero-BUY audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-zero-buy-audit
          path: reports/zero_buy_audit
          if-no-files-found: error
