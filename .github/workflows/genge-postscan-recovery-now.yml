name: GenGe Postscan Recovery Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/genge-postscan-recovery-now.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful GenGe All-A V3.1.1 One Shot run id
        required: false
        default: '38303771170'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Postscan Market Data Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          RECOVERY_RUN_ID: '38303771170'
        run: |
          set -euo pipefail
          run_id="$RECOVERY_RUN_ID"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_RUN_ID" ]; then
            run_id="$INPUT_RUN_ID"
          fi
          gh workflow run genge-postscan-market-data-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_id="$run_id"
          echo "Dispatched Postscan Market Data Publish for source run $run_id" >> "$GITHUB_STEP_SUMMARY"
