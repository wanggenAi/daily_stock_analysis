name: GenGe Three-Pillar Decision Center

on:
  workflow_dispatch:
  schedule:
    - cron: '32 */3 * * *'
  workflow_run:
    workflows:
      - "GenGe Realtime Data Package"
      - "Era Capital Trend Radar Live"
      - "GenGe Global Market Pulse"
    types: [completed]
  pull_request:
    paths:
      - 'src/strategies/genge_opportunity_discovery/three_pillar_decision_center*.py'
      - 'scripts/genge_data_package.py'
      - 'scripts/genge_research_input.py'
      - 'scripts/genge_bind_decision_center_snapshot.py'
      - 'tests/test_genge_data_research_boundary.py'
      - '.github/workflows/genge-three-pillar-decision-center.yml'

concurrency:
  group: genge-three-pillar-decision-center-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  contracts:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install -r .github/requirements-ci.txt
      - name: Validate decision and data/research boundary contracts
        run: |
          python -m pytest -q \
            tests/test_three_pillar_decision_center.py \
            tests/test_three_pillar_decision_center_runtime.py \
            tests/test_holding_valuation_watch.py \
            tests/test_global_market_pulse_decision_integration.py \
            tests/test_genge_data_research_boundary.py

  production:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build package-locked Decision Center with optimistic replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'genge-three-pillar-bot'
          git config user.email '31836791+wanggenAi@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            echo "Package-locked Decision Center replay ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main

            test -s data/data_package/latest.json
            test -s data/investor_decision_dashboard/latest.json
            test -s data/era_radar/latest.json
            test -s data/deep_calculation/latest_research_decisions.json

            # Research consumes one immutable package. It does not perform acquisition.
            python scripts/genge_data_package.py validate
            python scripts/genge_research_input.py --mode hourly --allow-stale-research-only

            python -m src.strategies.genge_opportunity_discovery.three_pillar_decision_center_runtime \
              --output-json data/decision_center/latest.json \
              --output-md LATEST_DECISION_CENTER.md

            if [ -s data/global_market_pulse/latest.json ]; then
              python tools/apply_global_market_pulse_to_decision_center.py \
                --decision-json data/decision_center/latest.json \
                --decision-md LATEST_DECISION_CENTER.md \
                --global-pulse data/global_market_pulse/latest.json
            fi

            python scripts/genge_bind_decision_center_snapshot.py \
              --decision data/decision_center/latest.json \
              --package data/data_package/latest.json \
              --receipt data/research_input/latest.json \
              --handoff data/investor_chatgpt_handoff/latest.json

            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/decision_center/latest.json').read_text(encoding='utf-8'))
          r=json.loads(Path('data/research_input/latest.json').read_text(encoding='utf-8'))
          prov=p['data_package_provenance']
          guard=p['data_freshness_execution_guard']
          assert p['contract_version']=='GEN_GE_THREE_PILLAR_DECISION_CENTER_V1'
          assert p['formal_action_source']=='FINALIZED_CANONICAL_ONLY'
          assert p['formal_action_recomputed'] is False
          assert p['no_auto_trade'] is True
          assert prov['snapshot_id']==r['input_snapshot_id']
          assert prov['network_policy']=='CANONICAL_PACKAGE_ONLY'
          assert guard['formal_actions_preserved'] is True
          assert guard['stale_or_partial_data_cannot_authorize_execution'] is True
          if not guard['execution_allowed']:
              assert p['today_account_plan']['planned_immediate_cash_cny']==0
          assert 'pillar_1_holdings_deep_analysis' in p
          assert 'pillar_2_world_social_market_capital_map' in p
          assert 'pillar_3_deep_opportunities' in p
          PY

            git add -f \
              data/research_input \
              data/decision_center/latest.json \
              data/investor_chatgpt_handoff/latest.json \
              LATEST_DECISION_CENTER.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist package-locked investor decision center [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            echo 'main moved; replaying against newest immutable package.' >&2
          done
          exit 1

      - name: Refresh Jev orchestration cursor after convergence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          marker="data/jev_shadow/orchestration/latest.json"
          if [ -s "$marker" ] && [ "$(jq -r '.production_verification_complete // false' "$marker")" != "true" ]; then
            gh workflow run genge-jev-orchestration-reconciler.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

      - name: Publish summary
        if: always()
        run: |
          echo '# GenGe Package-Locked Decision Center' >> "$GITHUB_STEP_SUMMARY"
          echo '- acquisition is outside this workflow' >> "$GITHUB_STEP_SUMMARY"
          echo '- research input is one immutable data-package snapshot' >> "$GITHUB_STEP_SUMMARY"
          echo '- stale data may support research but cannot authorize immediate execution' >> "$GITHUB_STEP_SUMMARY"
          echo '- Formal actions remain finalized-canonical only; no auto-trade' >> "$GITHUB_STEP_SUMMARY"
