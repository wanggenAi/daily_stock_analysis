name: GenGe Cycle Bottom

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  fixture-research-smoke:
    name: Fixture research smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requirements-ci.txt

      - name: Run GenGe fixture tests
        run: python -m pytest tests/test_genge_cycle_bottom_*.py

      - name: Run fixture CLI smoke
        run: |
          python -m src.strategies.genge_cycle_bottom.cli \
            --codes 000001,000002 \
            --years 5 \
            --benchmark 000300 \
            --price-data-dir tests/fixtures/genge_cycle_bottom/prices \
            --valuation-data-dir tests/fixtures/genge_cycle_bottom/valuation \
            --financial-data-dir tests/fixtures/genge_cycle_bottom/financial \
            --industry-cycle-file tests/fixtures/genge_cycle_bottom/industry_cycle.csv \
            --stock-industry-map tests/fixtures/genge_cycle_bottom/stock_industry_map.csv \
            --industry-evidence-file tests/fixtures/genge_cycle_bottom/industry_evidence.csv \
            --company-evidence-file tests/fixtures/genge_cycle_bottom/company_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --output-dir reports/genge_cycle_bottom_ci_smoke

      - name: Validate fixture smoke report schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports/genge_cycle_bottom_ci_smoke")
          runs = sorted(path for path in root.iterdir() if path.is_dir())
          assert runs, "no fixture smoke report directory generated"
          latest = runs[-1]
          for filename in ("summary.md", "summary.json", "signal_details.csv"):
              assert (latest / filename).exists(), f"missing {filename}"

          summary = json.loads((latest / "summary.json").read_text(encoding="utf-8"))
          required = [
              "total_signals",
              "win_rate_20d",
              "win_rate_60d",
              "win_rate_120d",
              "win_rate_250d",
              "avg_net_return_20d",
              "avg_net_return_60d",
              "avg_net_return_120d",
              "avg_net_return_250d",
              "low_max_drawdown",
              "benchmark_outperform",
              "industry_summary",
              "signal_type_summary",
              "time_split_summary",
              "valuation_coverage_rate",
              "financial_coverage_rate",
              "industry_cycle_coverage_rate",
              "industry_evidence_coverage_rate",
              "hard_logic_level_summary",
              "industry_evidence_quality_summary",
              "execution_diagnostics",
              "paper_trading_gate",
          ]
          missing = [key for key in required if key not in summary]
          assert not missing, f"missing summary keys: {missing}"
          diagnostics = summary.get("diagnostics") or {}
          for key in ("coverage", "execution_diagnostics", "data_gap_counts"):
              assert key in diagnostics, f"missing diagnostics key: {key}"
          assert summary["avg_return_20d"] == summary["avg_net_return_20d"], "avg_return_20d must remain net-return compatible"
          print(f"validated={latest}")
          PY

      - name: Upload fixture smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genge-cycle-bottom-ci-smoke
          path: reports/genge_cycle_bottom_ci_smoke

  migrate-normal-production:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Switch normal All-A production to progress runner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/genge-opportunity-discovery.yml')
          text = path.read_text(encoding='utf-8')
          old_name = '      - name: Run unified all-A production scan\n'
          new_name = '      - name: Run unified all-A production scan with progress\n'
          old_module = '          python -m src.strategies.genge_opportunity_discovery.all_a_full_scan \\\n'
          new_module = '          python -m src.strategies.genge_opportunity_discovery.all_a_progress_runner \\\n'
          old_tail = '''            --exit-profile-file data/opportunity_snapshots/exit_profile.csv &
          scan_pid=$!
          while kill -0 "$scan_pid" 2>/dev/null; do
            echo "all-A scan heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 60
          done
          wait "$scan_pid"
'''
          new_tail = '            --exit-profile-file data/opportunity_snapshots/exit_profile.csv\n'
          assert text.count(old_name) == 1, text.count(old_name)
          assert text.count(old_module) == 1, text.count(old_module)
          assert text.count(old_tail) == 1, text.count(old_tail)
          text = text.replace(old_name, new_name, 1)
          text = text.replace(old_module, new_module, 1)
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/genge-opportunity-discovery.yml
          git diff --cached --check
          git commit -m "ci: use progress runner for normal All-A production"
          git push origin HEAD:main

      - name: Dispatch normal production workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run genge-opportunity-discovery.yml --repo "$REPO" --ref main
          run_line=""
          for _ in $(seq 1 15); do
            sleep 4
            run_line=$(gh api "repos/${REPO}/actions/workflows/genge-opportunity-discovery.yml/runs?event=workflow_dispatch&per_page=10" \
              --jq --arg cutoff "$dispatched_at" '[.workflow_runs[] | select(.created_at >= $cutoff)] | sort_by(.created_at) | reverse | .[0] // empty | [.id,.status,(.conclusion // ""),.created_at,.head_sha,.html_url] | @tsv' || true)
            [ -n "$run_line" ] && break
          done
          [ -n "$run_line" ] || { echo "Normal production dispatch was not located" >&2; exit 1; }
          IFS=$'\t' read -r run_id status conclusion created head_sha url <<< "$run_line"
          echo "NORMAL_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "NORMAL_STATUS=$status" >> "$GITHUB_ENV"
          echo "NORMAL_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
          echo "NORMAL_CREATED=$created" >> "$GITHUB_ENV"
          echo "NORMAL_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          echo "NORMAL_URL=$url" >> "$GITHUB_ENV"

      - name: Persist normal production runtime locator
        run: |
          git pull --rebase
          cat > docs/GENGE_NORMAL_PRODUCTION_RUNTIME.md <<EOF
          # GenGe Normal Production Runtime

          validation_stage: NORMAL_PRODUCTION_AFTER_PROGRESS_RUNNER_MIGRATION
          workflow: GenGe Opportunity Discovery
          event: workflow_dispatch
          run_id: ${NORMAL_RUN_ID}
          status: ${NORMAL_STATUS}
          conclusion: ${NORMAL_CONCLUSION}
          created_at_utc: ${NORMAL_CREATED}
          head_sha: ${NORMAL_HEAD_SHA}
          url: ${NORMAL_URL}
          expected_runner: src.strategies.genge_opportunity_discovery.all_a_progress_runner
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENGE_NORMAL_PRODUCTION_RUNTIME.md
          git commit -m "docs: record normal production validation run [skip ci]"
          git push origin HEAD:main
