name: GenGe Insurance Execution Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-insurance-execution-validation.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Validate insurance execution
        run: |
          python -m pytest -q \
            tests/test_genge_insurance_embedded_value_inputs.py \
            tests/test_genge_insurance_valuation_execution.py \
            tests/test_genge_insurance_valuation.py
