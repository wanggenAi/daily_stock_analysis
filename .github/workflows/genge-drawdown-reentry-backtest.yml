name: GenGe Drawdown Reentry Backtest

on:
  pull_request:
    paths:
      - "src/strategies/genge_opportunity_discovery/drawdown_reentry_backtest.py"
      - "src/strategies/genge_opportunity_discovery/drawdown_overlay_backtest.py"
      - "src/strategies/genge_opportunity_discovery/drawdown_risk_policy.py"
      - "src/strategies/genge_opportunity_discovery/hard_logic_historical_backtest.py"
      - "tests/test_genge_drawdown_reentry_backtest.py"
      - "config/genge_hard_logic_famous_cases.csv"
      - ".github/workflows/genge-drawdown-reentry-backtest.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical replay start date"
        required: false
        default: "2018-01-01"
        type: string
      end_date:
        description: "Historical replay end date"
        required: false
        default: "2026-08-18"
        type: string

permissions:
  contents: read

concurrency:
  group: genge-drawdown-reentry-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Validate reentry logic
        run: |
          python -m py_compile src/strategies/genge_opportunity_discovery/drawdown_reentry_backtest.py
          python -m pytest -q tests/test_genge_drawdown_reentry_backtest.py

  public-data-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Cache historical public data
        uses: actions/cache@v4
        with:
          path: data/cache/hard_logic_history_backtest
          key: hard-logic-history-v3-${{ runner.os }}-${{ hashFiles('config/genge_hard_logic_famous_cases.csv') }}
      - name: Resolve replay dates
        shell: bash
        run: |
          echo "START_DATE=${{ inputs.start_date || '2018-01-01' }}" >> "$GITHUB_ENV"
          echo "END_DATE=${{ inputs.end_date || '2026-08-18' }}" >> "$GITHUB_ENV"
      - name: Run signal-confirmed risk reentry comparison
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.drawdown_reentry_backtest \
            --cases-file config/genge_hard_logic_famous_cases.csv \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --output-dir reports/drawdown_reentry_backtest \
            --cache-dir data/cache/hard_logic_history_backtest \
            --evaluation-stride 5 \
            --cost-bps-per-side 15
      - name: Validate reentry contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('reports/drawdown_reentry_backtest')
          required = [
              root/'drawdown_reentry_summary.json',
              root/'drawdown_reentry.md',
              root/'reentry_policy_comparison.csv',
              root/'reentry_case_results.csv',
              root/'reentry_trades.csv',
              root/'data_failures.csv',
          ]
          for path in required:
              assert path.exists() and path.stat().st_size > 0, path
          summary = json.loads((root/'drawdown_reentry_summary.json').read_text(encoding='utf-8'))
          assert summary['same_point_in_time_entry_rule_as_baseline'] is True
          assert summary['automatic_reentry_allowed'] is False
          assert summary['reentry_requires_fresh_original_buy_signal'] is True
          assert summary['reentry_cooldown_required'] is True
          assert summary['risk_signals_observed_after_close_execute_next_open'] is True
          assert summary['famous_case_selection_bias_warning'] is True
          assert summary['production_deployment_allowed'] is False
          assert summary['full_all_a_walk_forward_required'] is True
          assert summary['baseline_trade_count'] > 0
          rows = list(csv.DictReader((root/'reentry_policy_comparison.csv').open(encoding='utf-8')))
          assert len(rows) >= 2
          assert any(int(row['signal_confirmed_reentry_count']) > 0 for row in rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/drawdown_reentry_backtest/drawdown_reentry.md ]; then
            cat reports/drawdown_reentry_backtest/drawdown_reentry.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-drawdown-reentry-backtest
          path: reports/drawdown_reentry_backtest
          if-no-files-found: error
