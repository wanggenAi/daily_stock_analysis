name: GenGe Industry Coverage

on:
  workflow_run:
    workflows: ["GenGe Opportunity Discovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Opportunity Discovery run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  industry-coverage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Resolve upstream run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_RUN_ID=${{ inputs.upstream_run_id }}" >> "$GITHUB_ENV"
          fi
      - name: Download All-A production report
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}
      - name: Test industry coverage
        run: python -m pytest -q tests/test_genge_industry_coverage.py
      - name: Build every-industry Top 5 research map
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_coverage \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/industry_coverage \
            --per-industry 5
      - name: Validate no represented industry disappears
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('reports/industry_coverage')
          with (root/'industry_top_candidates.csv').open(encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          summary = json.loads((root/'industry_coverage_summary.json').read_text(encoding='utf-8'))
          assert rows, 'industry coverage is empty'
          industries = {r['industry'] for r in rows}
          assert len(industries) == summary['industry_count']
          assert all(1 <= int(r['industry_research_rank']) <= 5 for r in rows)
          assert all(r['formal_signal_eligible'] == 'False' for r in rows)
          assert all(r['automatic_promotion_allowed'] == 'False' for r in rows)
          assert all(r['no_auto_trade'] == 'True' for r in rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Publish industry map
        if: always()
        run: |
          if [ -f reports/industry_coverage/industry_top_candidates.md ]; then
            cat reports/industry_coverage/industry_top_candidates.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload industry coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-industry-coverage
          path: reports/industry_coverage
          if-no-files-found: error
