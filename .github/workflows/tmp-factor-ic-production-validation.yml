name: Temporary Factor-IC Production Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-validation:
    name: One-off Factor-IC All-A validation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Run policy tests first
        run: |
          python -m pytest -q \
            tests/test_genge_risk_capped_buy_policy.py \
            tests/test_genge_complete_material_event_pagination.py \
            tests/test_genge_factor_ic_monitor.py \
            tests/test_genge_industry_regime_policy.py \
            tests/test_genge_universe_resilience_policy.py \
            tests/test_genge_opportunity_engine_policy.py \
            tests/test_genge_opportunity_pipeline_policy.py \
            tests/test_genge_opportunity_queue_policy.py \
            tests/test_genge_opportunity_report_policy.py \
            tests/test_genge_real_world_signals.py \
            tests/test_genge_live_exit_policy.py \
            tests/test_genge_candidate_recovery_report_v2.py
      - name: Restore all-A public-data cache and observation state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/all_a_factor_observations.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: temp-factor-ic-all-a-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            genge-all-a-state-${{ runner.os }}-main-
            genge-all-a-state-${{ runner.os }}-
      - name: Prepare all-A research state
        run: |
          mkdir -p data/cache/all_a_full_scan data/cache/genge_fundamentals data/cache/opportunity_evidence
          mkdir -p data/opportunity_snapshots/all_a_state
          if [ ! -s data/opportunity_snapshots/exit_profile.csv ]; then
            cp data/opportunity_snapshots/exit_profile_seed.csv data/opportunity_snapshots/exit_profile.csv
          fi
      - name: Run factor-IC risk-capped all-A production scan
        run: |
          PYTHONUNBUFFERED=1 timeout --signal=TERM 100m \
          python -m src.strategies.genge_opportunity_discovery.risk_capped_complete_event_scan \
            --max-workers 12 \
            --evidence-queue-size 80 \
            --deep-review-size 30 \
            --max-watchlist 15 \
            --fundamental-limit 30 \
            --industry-evidence-file data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence-file data/user_supplied/company_cycle_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --exit-profile-file data/opportunity_snapshots/exit_profile.csv
      - name: Validate generated report contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path('reports/all_a_full_scan')
          runs = sorted(p for p in root.iterdir() if p.is_dir() and (p / 'run_summary.json').exists())
          assert runs, 'no production report generated'
          latest = runs[-1]
          summary = json.loads((latest / 'run_summary.json').read_text(encoding='utf-8'))
          assert summary['market_regime_status'] in {'GREEN', 'YELLOW', 'RED'}
          for name in ['buy_signals.csv','actionable_execution_list.csv','candidate_recovery_queue.csv','strict_gate_audit.csv','real_world_signal_audit.csv','industry_regime.csv','factor_effectiveness.csv','factor_effectiveness.json']:
              assert (latest / name).exists(), name
          factor = json.loads((latest / 'factor_effectiveness.json').read_text(encoding='utf-8'))
          assert factor['rule_version'] == 'factor_ic_monitor_v1_point_in_time'
          assert set(factor['factor_summaries']) == {'VALUE','QUALITY','REVERSAL','MOMENTUM','EARNINGS'}
          with (latest / 'industry_regime.csv').open(encoding='utf-8') as f:
              industries = list(csv.DictReader(f))
          assert industries
          assert all('median_relative_strength_20d' in row for row in industries)
          assert all('median_relative_strength_60d' in row for row in industries)
          assert all('above_ma60_ratio' in row for row in industries)
          assert all(row.get('rule_version') == 'industry_regime_v2_multihorizon_rs' for row in industries)
          with (latest / 'buy_signals.csv').open(encoding='utf-8') as f:
              buys = list(csv.DictReader(f))
          with (latest / 'actionable_execution_list.csv').open(encoding='utf-8') as f:
              executions = list(csv.DictReader(f))
          assert len(buys) == summary['buy_signal_count']
          assert len(executions) == summary['actionable_execution_count']
          print(f'validated={latest}')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print(json.dumps(factor, ensure_ascii=False, indent=2))
          PY
      - name: Upload one-off production report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-factor-ic-all-a-production-report
          path: |
            reports/all_a_full_scan
            stock_pools/all_a_universe_*.csv
            data/opportunity_snapshots/all_a_factor_observations.csv
          if-no-files-found: warn
