name: GenGe Start Postscan Now

on:
  push:
    branches: [main]
    paths: [".github/workflows/genge-start-postscan-now.yml"]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Postscan Market Data Publish recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="38014346209"
          gh workflow run genge-postscan-market-data-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_id="$SOURCE_RUN_ID"
          echo "Dispatched GenGe Postscan Market Data Publish recovery from successful All-A run ${SOURCE_RUN_ID}."
          echo "Downstream workflow_run chain remains authoritative: Postscan Market Data Publish -> GenGe Realtime Data Package -> GenGe Three-Pillar Decision Center." >> "$GITHUB_STEP_SUMMARY"
          echo "No Formal BUY/SELL threshold changes; no auto-trade." >> "$GITHUB_STEP_SUMMARY"

# Recovery trigger: rebuild canonical data package after immutable snapshot identity repair.
