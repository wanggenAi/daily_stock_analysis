name: GenGe Start Postscan Now

on:
  push:
    branches: [main]
    paths: [".github/workflows/genge-start-postscan-now.yml"]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh execution-critical market producers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run era-capital-trend-radar-live.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run genge-global-market-pulse.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched fresh Era Capital Trend Radar Live and GenGe Global Market Pulse runs."
          echo "Their successful producer outputs are authoritative inputs to the realtime package; no Formal BUY/SELL threshold changes and no auto-trade." >> "$GITHUB_STEP_SUMMARY"

# Recovery trigger: refresh both execution-critical wall-clock producers before final package/decision validation.
