name: V3.1.1 Production Parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/strategies/genge_opportunity_discovery/selection_framework_v31.py"
      - "src/strategies/genge_opportunity_discovery/selection_framework_v311.py"
      - "src/strategies/genge_opportunity_discovery/production_model.py"
      - "src/strategies/genge_opportunity_discovery/production_decision_scan.py"
      - "tests/test_genge_opportunity_discovery_selection_framework_v311.py"
      - "tests/test_genge_production_model.py"
      - ".github/workflows/v311-production-parity.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/strategies/genge_opportunity_discovery/selection_framework_v31.py"
      - "src/strategies/genge_opportunity_discovery/selection_framework_v311.py"
      - "src/strategies/genge_opportunity_discovery/production_model.py"
      - "src/strategies/genge_opportunity_discovery/production_decision_scan.py"
      - "tests/test_genge_opportunity_discovery_selection_framework_v311.py"
      - "tests/test_genge_production_model.py"
      - ".github/workflows/v311-production-parity.yml"

permissions:
  contents: read

concurrency:
  group: v311-production-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Run V3.1.1 parity and production tests
        run: |
          python -m pytest -q \
            tests/test_genge_opportunity_discovery_selection_framework_v31.py \
            tests/test_genge_opportunity_discovery_selection_framework_v311.py \
            tests/test_genge_production_model.py

      - name: Verify production is not wired to V3.2
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/strategies/genge_opportunity_discovery/production_model.py")
          text = path.read_text(encoding="utf-8")
          assert "selection_framework_v311" in text
          assert "selection_framework_v32" not in text
          print("production_v311_parity_wiring=PASS")
          PY
