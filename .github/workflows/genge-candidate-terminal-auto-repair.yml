name: GenGe Candidate Terminal Auto Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/genge-candidate-terminal-auto-repair.yml"
  workflow_run:
    workflows: ["GenGe Candidate Terminal Review"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-candidate-terminal-auto-repair
  cancel-in-progress: false

jobs:
  repair-terminal:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository CI dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Resolve exact failed Terminal lineage
        id: lineage
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            terminal_run_id="$TRIGGER_RUN_ID"
          else
            terminal_run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/genge-candidate-terminal-review.yml/runs?branch=main&status=failure&per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "GenGe Candidate Terminal Review")][0].id // empty')
          fi
          [[ "$terminal_run_id" =~ ^[0-9]+$ ]] || { echo "failed Candidate Terminal run not found" >&2; exit 1; }

          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${terminal_run_id}")
          name=$(printf '%s' "$run_json" | jq -r '.name')
          conclusion=$(printf '%s' "$run_json" | jq -r '.conclusion // ""')
          title=$(printf '%s' "$run_json" | jq -r '.display_title // ""')
          [ "$name" = "GenGe Candidate Terminal Review" ] || { echo "unexpected terminal workflow: $name" >&2; exit 1; }
          [ "$conclusion" = "failure" ] || { echo "terminal run is not failed" >&2; exit 1; }
          finalizer_run_id=$(printf '%s' "$title" | grep -Eo '[0-9]+$' || true)
          [[ "$finalizer_run_id" =~ ^[0-9]+$ ]] || { echo "cannot resolve finalizer id from $title" >&2; exit 1; }

          finalizer_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${finalizer_run_id}")
          [ "$(printf '%s' "$finalizer_json" | jq -r '.name')" = "GenGe V3.1.1 Production Finalizer" ] || { echo "resolved run is not Production Finalizer" >&2; exit 1; }
          [ "$(printf '%s' "$finalizer_json" | jq -r '.conclusion')" = "success" ] || { echo "Production Finalizer is not successful" >&2; exit 1; }
          [ "$(printf '%s' "$finalizer_json" | jq -r '.head_branch')" = "main" ] || { echo "Production Finalizer is not on main" >&2; exit 1; }

          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${finalizer_run_id}/artifacts?per_page=100")
          auth_name=$(printf '%s' "$artifacts" | jq -r '[.artifacts[] | select(.expired == false and (.name | test("^genge-v311-authoritative-canonical-[0-9]+$")))][0].name // empty')
          auth_id=$(printf '%s' "$artifacts" | jq -r --arg n "$auth_name" '[.artifacts[] | select(.name == $n and .expired == false)][0].id // empty')
          research_run_id="${auth_name##*-}"
          [[ "$auth_id" =~ ^[0-9]+$ && "$research_run_id" =~ ^[0-9]+$ ]] || { echo "exact authority artifact not resolved" >&2; exit 1; }

          research_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${research_run_id}")
          [ "$(printf '%s' "$research_json" | jq -r '.name')" = "GenGe V3.1.1 Every-Industry Research" ] || { echo "authority source is not Every-Industry" >&2; exit 1; }
          [ "$(printf '%s' "$research_json" | jq -r '.conclusion')" = "success" ] || { echo "Every-Industry run is not successful" >&2; exit 1; }

          research_artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${research_run_id}/artifacts?per_page=100")
          research_artifact_id=$(printf '%s' "$research_artifacts" | jq -r '[.artifacts[] | select(.name == "genge-v31-every-industry-research" and .expired == false)][0].id // empty')
          [[ "$research_artifact_id" =~ ^[0-9]+$ ]] || { echo "Every-Industry artifact missing" >&2; exit 1; }

          {
            echo "terminal_run_id=$terminal_run_id"
            echo "finalizer_run_id=$finalizer_run_id"
            echo "research_run_id=$research_run_id"
            echo "authority_artifact_id=$auth_id"
            echo "research_artifact_id=$research_artifact_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact authority and research artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORITY_ARTIFACT_ID: ${{ steps.lineage.outputs.authority_artifact_id }}
          RESEARCH_ARTIFACT_ID: ${{ steps.lineage.outputs.research_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p authority artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTHORITY_ARTIFACT_ID}/zip" > authority.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESEARCH_ARTIFACT_ID}/zip" > research.zip
          unzip -q authority.zip -d authority
          unzip -q research.zip -d artifact

      - name: Verify exact Finalizer authority
        env:
          RESEARCH_RUN_ID: ${{ steps.lineage.outputs.research_run_id }}
          FINALIZER_RUN_ID: ${{ steps.lineage.outputs.finalizer_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = list(Path('authority').rglob('production_authority.json'))
          assert len(files) == 1, files
          payload = json.loads(files[0].read_text(encoding='utf-8'))
          assert payload.get('authorized') is True
          assert str(payload.get('canonical_source_run_id')) == os.environ['RESEARCH_RUN_ID']
          assert str(payload.get('finalizer_run_id')) == os.environ['FINALIZER_RUN_ID']
          assert payload.get('canonical_source_kind') == 'every-industry'
          assert payload.get('consumer_contract', {}).get('consumer_may_recompute_formal_action') is False
          assert payload.get('no_auto_trade') is True
          PY

      - name: Resolve terminal inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .terminal-inputs
          mapfile -t masters < <(find artifact -type f -name v31_review_queue_enriched.csv -print)
          mapfile -t productions < <(find artifact -type f -name production_decisions.csv ! -path '*/canonical_snapshot/*' -print)
          [ "${#masters[@]}" -eq 1 ] || { echo "expected one enriched review queue" >&2; exit 1; }
          [ "${#productions[@]}" -eq 1 ] || { echo "expected one production decisions file" >&2; exit 1; }
          master="${masters[0]}"
          production="${productions[0]}"
          formal=".terminal-inputs/terminal_formal_compat.csv"
          MASTER_SOURCE="$master" PRODUCTION_SOURCE="$production" FORMAL_TARGET="$formal" python - <<'PY'
          import csv, os
          from pathlib import Path
          def code(value):
              text = str(value or '').strip().upper()
              if '.' in text:
                  base, suffix = text.rsplit('.', 1)
                  if suffix in {'SH','SZ','BJ'}:
                      text = base
              for prefix in ('SH','SZ','BJ'):
                  if text.startswith(prefix) and text[len(prefix):].isdigit():
                      text = text[len(prefix):]
                      break
              return text.zfill(6) if text.isdigit() else text
          def truthy(value):
              return str(value or '').strip().lower() in {'1','true','yes','y','pass','passed'}
          with Path(os.environ['MASTER_SOURCE']).open(encoding='utf-8') as f:
              master_rows = list(csv.DictReader(f))
          with Path(os.environ['PRODUCTION_SOURCE']).open(encoding='utf-8') as f:
              production_rows = list(csv.DictReader(f))
          production = {code(r.get('code')): r for r in production_rows if str(r.get('decision_scope') or '').strip().upper() == 'CANDIDATE' and code(r.get('code'))}
          rows=[]
          for row in master_rows:
              c=code(row.get('code')); prod=production.get(c)
              if not prod: continue
              ready=truthy(row.get('v31_buy_ready'))
              eligible=bool(ready and str(prod.get('production_action') or '').strip().upper() == 'BUY' and str(prod.get('valuation_confidence') or '').strip().upper() == 'HIGH' and truthy(prod.get('production_model_frozen')))
              rows.append({'code':c,'long_term_formal_buy_eligible':eligible,'v31_buy_ready':ready})
          target=Path(os.environ['FORMAL_TARGET']); target.parent.mkdir(parents=True, exist_ok=True)
          with target.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['code','long_term_formal_buy_eligible','v31_buy_ready']); w.writeheader(); w.writerows(rows)
          print(f'candidate production rows={len(production)} formal rows={len(rows)}')
          PY
          echo "MASTER_CSV=$master" >> "$GITHUB_ENV"
          echo "FORMAL_CSV=$formal" >> "$GITHUB_ENV"
          echo "PRODUCTION_CSV=$production" >> "$GITHUB_ENV"

      - name: Terminalize every research candidate
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.candidate_terminal_decision \
            --master-csv "$MASTER_CSV" \
            --formal-csv "$FORMAL_CSV" \
            --production-csv "$PRODUCTION_CSV" \
            --output-dir reports/candidate_terminal_decision

      - name: Validate terminal closure
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('reports/candidate_terminal_decision')
          rows=list(csv.DictReader((root/'candidate_terminal_decisions.csv').open(encoding='utf-8')))
          summary=json.loads((root/'candidate_terminal_summary.json').read_text(encoding='utf-8'))
          assert rows
          assert len(rows) == summary['candidate_count'] == summary['terminalized_count']
          assert summary['research_limbo_count'] == 0
          assert summary['unauthorized_buy_count'] == 0
          assert summary['hard_gate_unknown_is_pass'] is False
          assert summary['canonical_authority_unchanged'] is True
          assert summary['no_auto_trade'] is True
          assert all(r['terminal_decision'] in {'BUY','WAIT_PRICE','REJECT'} for r in rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          for code in ('000526','002239','001205','002916'):
              hit=[r for r in rows if r.get('code') == code]
              if hit:
                  r=hit[0]
                  print(code, r.get('stock_name'), r.get('terminal_decision'), r.get('terminal_reason_class'), r.get('terminal_reason_codes'))
          PY

      - name: Upload repaired terminal decisions
        uses: actions/upload-artifact@v4
        with:
          name: genge-candidate-terminal-decisions-auto-repair
          path: reports/candidate_terminal_decision
          if-no-files-found: error
          retention-days: 14

      - name: Publish repair summary
        if: always()
        run: |
          echo "# Candidate Terminal Auto Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- failed terminal run: ${{ steps.lineage.outputs.terminal_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- exact Every-Industry run: ${{ steps.lineage.outputs.research_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- exact Finalizer run: ${{ steps.lineage.outputs.finalizer_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- UNKNOWN/INVALID never treated as PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Formal authority unchanged; no auto trade" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/candidate_terminal_decision/candidate_terminal_decisions.md ]; then
            cat reports/candidate_terminal_decision/candidate_terminal_decisions.md >> "$GITHUB_STEP_SUMMARY"
          fi
