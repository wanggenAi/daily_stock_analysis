name: Temporary Patch Hard Logic High Exit

on:
  push:
    branches:
      - feat/hard-logic-price-expectation-map

permissions:
  contents: write

jobs:
  patch-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/hard-logic-price-expectation-map
          fetch-depth: 0

      - name: Require high valuation zone for expectation exits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/strategies/genge_opportunity_discovery/hard_logic_historical_backtest.py')
          text = path.read_text(encoding='utf-8')

          old = 'MAX_ENTRY_PE_PERCENTILE = 50.0\nBUY_DECISIONS = {"BUY_DEEP_VALUE", "BUYABLE", "BUYABLE_WITH_SUPPORTED_GROWTH"}\n'
          new = 'MAX_ENTRY_PE_PERCENTILE = 50.0\nMIN_EXIT_PE_PERCENTILE = 70.0\nBUY_DECISIONS = {"BUY_DEEP_VALUE", "BUYABLE", "BUYABLE_WITH_SUPPORTED_GROWTH"}\n'
          if old not in text:
              raise SystemExit('constant anchor not found')
          text = text.replace(old, new, 1)

          old = '''def _sell_reason(price_map: Mapping[str, Any], logic: Mapping[str, Any]) -> str | None:\n    if logic.get("state") == "BLOCKED":\n        return "SELL_HARD_LOGIC_INVALIDATED"\n    required = _finite(price_map.get("required_profit_growth_pct"))\n    base = _finite(price_map.get("supported_profit_growth_base_pct"))\n    if required is None:\n        return None\n    if base is not None and required >= base:\n        return "SELL_EXPECTATIONS_FULL"\n    if base is None and required >= 20:\n        return "SELL_HISTORICAL_REFERENCE_PLUS20_EXPECTATION"\n    return None\n'''
          new = '''def _sell_reason(price_map: Mapping[str, Any], logic: Mapping[str, Any]) -> str | None:\n    if logic.get("state") == "BLOCKED":\n        return "SELL_HARD_LOGIC_INVALIDATED"\n    required = _finite(price_map.get("required_profit_growth_pct"))\n    base = _finite(price_map.get("supported_profit_growth_base_pct"))\n    percentile = _finite(price_map.get("historical_pe_percentile"))\n    if required is None or percentile is None:\n        return None\n    high_valuation_zone = percentile >= MIN_EXIT_PE_PERCENTILE\n    if base is not None and required >= base and high_valuation_zone:\n        return "SELL_EXPECTATIONS_FULL_HIGH_VALUATION"\n    if base is None and required >= 20 and high_valuation_zone:\n        return "SELL_HISTORICAL_REFERENCE_PLUS20_HIGH_VALUATION"\n    return None\n'''
          if old not in text:
              raise SystemExit('sell anchor not found')
          text = text.replace(old, new, 1)

          old = '''        "max_entry_pe_percentile": MAX_ENTRY_PE_PERCENTILE,\n        "deep_value_bypasses_pe_percentile_gate": True,\n        "point_in_time_financials": True,\n'''
          new = '''        "max_entry_pe_percentile": MAX_ENTRY_PE_PERCENTILE,\n        "deep_value_bypasses_pe_percentile_gate": True,\n        "high_valuation_exit_required": True,\n        "min_exit_pe_percentile": MIN_EXIT_PE_PERCENTILE,\n        "point_in_time_financials": True,\n'''
          if old not in text:
              raise SystemExit('summary anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_genge_hard_logic_historical_backtest.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '    HistoricalCompanyData,\n',
              '    HistoricalCompanyData,\n    _sell_reason,\n',
              1,
          )
          anchor = '''    def test_negative_visible_core_profit_blocks_new_buy(self):\n'''
          addition = '''    def test_expectation_exit_requires_high_historical_valuation_zone(self):\n        logic = {"state": "PASS"}\n        low_zone = {\n            "required_profit_growth_pct": 40,\n            "supported_profit_growth_base_pct": 20,\n            "historical_pe_percentile": 55,\n        }\n        high_zone = dict(low_zone, historical_pe_percentile=80)\n\n        self.assertIsNone(_sell_reason(low_zone, logic))\n        self.assertEqual(\n            _sell_reason(high_zone, logic),\n            "SELL_EXPECTATIONS_FULL_HIGH_VALUATION",\n        )\n\n    def test_hard_logic_invalidation_exits_even_when_valuation_is_low(self):\n        self.assertEqual(\n            _sell_reason(\n                {\n                    "required_profit_growth_pct": -20,\n                    "supported_profit_growth_base_pct": 20,\n                    "historical_pe_percentile": 5,\n                },\n                {"state": "BLOCKED"},\n            ),\n            "SELL_HARD_LOGIC_INVALIDATED",\n        )\n\n'''
          if anchor not in tests:
              raise SystemExit('test anchor not found')
          tests = tests.replace(anchor, addition + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')

          workflow = Path('.github/workflows/genge-hard-logic-history-backtest.yml')
          yml = workflow.read_text(encoding='utf-8')
          old_yml = "          assert summary['deep_value_bypasses_pe_percentile_gate'] is True\n          assert summary['famous_case_selection_bias_warning'] is True\n"
          new_yml = "          assert summary['deep_value_bypasses_pe_percentile_gate'] is True\n          assert summary['high_valuation_exit_required'] is True\n          assert summary['min_exit_pe_percentile'] == 70.0\n          assert summary['famous_case_selection_bias_warning'] is True\n"
          if old_yml not in yml:
              raise SystemExit('workflow anchor not found')
          workflow.write_text(yml.replace(old_yml, new_yml, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-patch-hard-logic-high-exit.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/strategies/genge_opportunity_discovery/hard_logic_historical_backtest.py tests/test_genge_hard_logic_historical_backtest.py .github/workflows/genge-hard-logic-history-backtest.yml .github/workflows/tmp-patch-hard-logic-high-exit.yml
          git commit -m 'fix: require high valuation zone for expectation exits'
          git push origin HEAD:feat/hard-logic-price-expectation-map
