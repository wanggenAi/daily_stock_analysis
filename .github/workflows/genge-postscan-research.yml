name: GenGe Postscan Research Pipeline

on:
  workflow_run:
    workflows: ["GenGe Opportunity Discovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed GenGe Opportunity Discovery run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genge-postscan-${{ github.event.workflow_run.id || inputs.upstream_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  postscan-research:
    # Only real production Opportunity Discovery runs are valid automatic
    # upstreams. Ordinary push/PR runs execute fixture checks but do not create
    # genge-all-a-production-report.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.event == 'schedule' ||
          github.event.workflow_run.event == 'workflow_dispatch'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt

      - name: Resolve upstream run id
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_RUN_ID=${{ inputs.upstream_run_id }}" >> "$GITHUB_ENV"
          fi

      - name: Download All-A production report
        uses: actions/download-artifact@v4
        with:
          name: genge-all-a-production-report
          path: upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.UPSTREAM_RUN_ID }}

      - name: Restore valuation fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-postscan-valuation-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-postscan-valuation-${{ runner.os }}-${{ github.ref_name }}-
            genge-postscan-valuation-${{ runner.os }}-main-
            genge-postscan-valuation-${{ runner.os }}-

      - name: Run postscan focused tests
        run: |
          python -m pytest -q \
            tests/test_genge_industry_coverage.py \
            tests/test_genge_sector_opportunity_engine.py \
            tests/test_genge_sector_first_hard_logic_research.py \
            tests/test_genge_industry_valuation_bridge.py \
            tests/test_genge_long_term_second_pass.py \
            tests/test_genge_long_term_valuation_merge.py \
            tests/test_genge_hard_logic_engine.py \
            tests/test_genge_hard_logic_research_runner.py \
            tests/test_genge_valuation_research_long_term_runner.py \
            tests/test_genge_long_term_formal_buy.py \
            tests/test_genge_zero_buy_audit.py \
            tests/test_genge_valuation_research_report.py \
            tests/test_genge_valuation_research_production.py \
            tests/test_genge_valuation_company_profiles.py \
            tests/test_genge_valuation_model_routing.py \
            tests/test_genge_capital_markets_valuation.py \
            tests/test_genge_specialized_valuation_execution.py \
            tests/test_genge_insurance_embedded_value_inputs.py \
            tests/test_genge_insurance_valuation_execution.py \
            tests/test_genge_insurance_valuation.py \
            tests/test_genge_resource_asset_valuation.py \
            tests/test_genge_master_opportunity_ranking.py

      - name: Build every-industry Top 5 seed map
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_coverage \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/industry_coverage \
            --per-industry 5

      - name: Build All-A sector opportunity map
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.sector_opportunity_engine \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/sector_opportunity

      - name: Validate sector opportunity contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('reports/sector_opportunity')
          rows = list(csv.DictReader((root/'sector_opportunity.csv').open(encoding='utf-8')))
          summary = json.loads((root/'sector_opportunity_summary.json').read_text(encoding='utf-8'))
          assert rows, 'sector opportunity map unexpectedly empty'
          assert len(rows) == summary['industry_count']
          assert len({r['industry'] for r in rows}) == len(rows), 'sector map must be one row per industry'
          assert summary['industry_first_discovery'] is True
          assert summary['sector_strength_is_hard_logic'] is False
          assert summary['sector_strength_can_create_buy'] is False
          assert summary['all_industries_remain_visible'] is True
          assert summary['formal_signal_eligible'] is False
          assert summary['automatic_promotion_allowed'] is False
          assert summary['no_auto_trade'] is True
          assert all(r.get('formal_signal_eligible') == 'False' for r in rows)
          assert all(r.get('automatic_promotion_allowed') == 'False' for r in rows)
          assert all(r.get('no_auto_trade') == 'True' for r in rows)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Research structural hard logic sector-first for every industry
        env:
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
          AGENT_GENERATION_BACKEND: ${{ vars.AGENT_GENERATION_BACKEND || secrets.AGENT_GENERATION_BACKEND }}
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          AGENT_LITELLM_MODEL: ${{ vars.AGENT_LITELLM_MODEL || secrets.AGENT_LITELLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
          LLM_PRIMARY_PROTOCOL: ${{ vars.LLM_PRIMARY_PROTOCOL || secrets.LLM_PRIMARY_PROTOCOL }}
          LLM_PRIMARY_BASE_URL: ${{ vars.LLM_PRIMARY_BASE_URL || secrets.LLM_PRIMARY_BASE_URL }}
          LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          LLM_PRIMARY_API_KEYS: ${{ secrets.LLM_PRIMARY_API_KEYS }}
          LLM_PRIMARY_MODELS: ${{ vars.LLM_PRIMARY_MODELS || secrets.LLM_PRIMARY_MODELS }}
          LLM_PRIMARY_ENABLED: ${{ vars.LLM_PRIMARY_ENABLED || secrets.LLM_PRIMARY_ENABLED }}
          LLM_SECONDARY_PROTOCOL: ${{ vars.LLM_SECONDARY_PROTOCOL || secrets.LLM_SECONDARY_PROTOCOL }}
          LLM_SECONDARY_BASE_URL: ${{ vars.LLM_SECONDARY_BASE_URL || secrets.LLM_SECONDARY_BASE_URL }}
          LLM_SECONDARY_API_KEY: ${{ secrets.LLM_SECONDARY_API_KEY }}
          LLM_SECONDARY_API_KEYS: ${{ secrets.LLM_SECONDARY_API_KEYS }}
          LLM_SECONDARY_MODELS: ${{ vars.LLM_SECONDARY_MODELS || secrets.LLM_SECONDARY_MODELS }}
          LLM_SECONDARY_ENABLED: ${{ vars.LLM_SECONDARY_ENABLED || secrets.LLM_SECONDARY_ENABLED }}
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS || secrets.SEARXNG_BASE_URLS }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: ${{ vars.SEARXNG_PUBLIC_INSTANCES_ENABLED || secrets.SEARXNG_PUBLIC_INSTANCES_ENABLED }}
        run: |
          if [ -n "${LITELLM_CONFIG_YAML:-}" ] && [ -n "${LITELLM_CONFIG:-}" ]; then
            mkdir -p "$(dirname "$LITELLM_CONFIG")"
            printf '%s\n' "$LITELLM_CONFIG_YAML" > "$LITELLM_CONFIG"
          fi
          RAW_ALL_A_CSV="$(find upstream/reports/all_a_full_scan -type f -name all_a_quant_screen.csv | sort | tail -1)"
          test -n "$RAW_ALL_A_CSV" && test -f "$RAW_ALL_A_CSV"
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.sector_first_hard_logic_research \
            --industry-candidates-csv reports/industry_coverage/industry_top_candidates.csv \
            --sector-opportunity-csv reports/sector_opportunity/sector_opportunity.csv \
            --all-a-universe-csv "$RAW_ALL_A_CSV" \
            --output-dir reports/hard_logic_research \
            --per-industry-limit 5 \
            --max-workers 3 \
            --timeout-seconds 90

      - name: Validate sector-first hard-logic research contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('reports/hard_logic_research')
          rows = list(csv.DictReader((root/'hard_logic_research.csv').open(encoding='utf-8')))
          summary = json.loads((root/'hard_logic_research_summary.json').read_text(encoding='utf-8'))
          sector = list(csv.DictReader(Path('reports/sector_opportunity/sector_opportunity.csv').open(encoding='utf-8')))
          assert rows, 'hard-logic industry research unexpectedly empty'
          assert len(rows) == summary['industry_count']
          assert len({r['industry'] for r in rows}) == len(rows), 'industry research must be one row per industry'
          assert {r['industry'] for r in rows} == {r['industry'] for r in sector}, 'every sector must remain researched'
          assert all(r.get('research_state') in {'PASS','NO_PASS','REVIEW'} for r in rows)
          assert all(r.get('no_auto_trade') == 'True' for r in rows)
          assert summary['sector_opportunity_used'] is True
          assert summary['industry_first_discovery'] is True
          assert summary['sector_strength_is_hard_logic'] is False
          assert summary['sector_strength_can_create_buy'] is False
          assert summary['topn_seed_is_answer'] is False
          assert summary['all_industries_force_stock'] is False
          assert summary['valuation_is_hard_logic'] is False
          assert summary['quant_rank_is_hard_logic'] is False
          assert [r['industry'] for r in rows] == summary['research_order']
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Build long-term second-pass candidates
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_second_pass \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/long_term_second_pass

      - name: Build industry-aware valuation source
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.industry_valuation_bridge \
            --all-a-report upstream/reports/all_a_full_scan \
            --industry-coverage reports/industry_coverage \
            --output-dir reports/industry_valuation_source \
            --global-limit 80 \
            --relaxed-reserve 20 \
            --per-industry 3

      - name: Force long-term second-pass into valuation source
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_valuation_merge \
            --valuation-source-dir reports/industry_valuation_source \
            --long-term-dir reports/long_term_second_pass \
            --output-dir reports/final_valuation_source

      - name: Force structural hard-logic PASS into valuation source
        run: |
          RAW_ALL_A_CSV="$(find upstream/reports/all_a_full_scan -type f -name all_a_quant_screen.csv | sort | tail -1)"
          test -n "$RAW_ALL_A_CSV" && test -f "$RAW_ALL_A_CSV"
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.hard_logic_valuation_merge \
            --valuation-source-dir reports/final_valuation_source \
            --hard-logic-research-dir reports/hard_logic_research \
            --raw-all-a-csv "$RAW_ALL_A_CSV" \
            --output-dir reports/hard_logic_valuation_source

      - name: Validate recall and hard-logic coverage before valuation
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          coverage = Path('reports/industry_coverage')
          final_source = Path('reports/final_valuation_source')
          hard_source = Path('reports/hard_logic_valuation_source')
          long_term = Path('reports/long_term_second_pass')
          hard_research = Path('reports/hard_logic_research')
          industry_rows = list(csv.DictReader((coverage/'industry_top_candidates.csv').open(encoding='utf-8')))
          source_rows = list(csv.DictReader((final_source/'all_a_quant_screen.csv').open(encoding='utf-8')))
          hard_source_rows = list(csv.DictReader((hard_source/'all_a_quant_screen.csv').open(encoding='utf-8')))
          lt_rows = list(csv.DictReader((long_term/'long_term_second_pass_candidates.csv').open(encoding='utf-8')))
          hard_rows = list(csv.DictReader((hard_research/'hard_logic_research.csv').open(encoding='utf-8')))
          clean_industries = {r['industry'] for r in industry_rows if r['industry_candidate_state'] == 'RESEARCH_CANDIDATE'}
          source_industries = {
              r.get('industry','') for r in source_rows
              if 'INDUSTRY_CHAMPION' in r.get('valuation_source_channel','') or r.get('valuation_source_channel') == 'BOTH'
          }
          assert not sorted(clean_industries - source_industries), 'clean industry missing valuation representation'
          source_codes = {r['code'] for r in source_rows}
          assert not sorted({r['code'] for r in lt_rows} - source_codes), 'long-term names missing valuation source'
          hard_source_codes = {r['code'] for r in hard_source_rows}
          hard_pass_codes = {
              r['selected_code'] for r in hard_rows
              if r.get('research_state') == 'PASS' and r.get('hard_logic_state') == 'PASS' and r.get('selected_code')
          }
          assert not sorted(hard_pass_codes - hard_source_codes), 'hard-logic PASS names missing valuation source'
          hard_summary = json.loads((hard_source/'hard_logic_valuation_source_summary.json').read_text(encoding='utf-8'))
          assert hard_summary['hard_logic_routed_count'] == len(hard_pass_codes)
          assert hard_summary['hard_logic_precedes_valuation'] is True
          assert hard_summary['external_nomination_requires_all_a_membership'] is True
          assert hard_summary['formal_signal_eligible'] is False
          assert hard_summary['automatic_promotion_allowed'] is False
          assert hard_summary['no_auto_trade'] is True
          print(json.dumps({'hard_logic_route': hard_summary}, ensure_ascii=False, indent=2))
          PY

      - name: Build reverse-valuation research queue after hard logic
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_research_long_term_runner \
            --report-dir reports/hard_logic_valuation_source \
            --output-dir reports/valuation_research_queue \
            --fundamental-cache-dir data/cache/valuation_research_fundamentals \
            --research-limit 500 \
            --relaxed-reserve 420 \
            --financial-review-limit 100 \
            --years 5 \
            --minimum-pe-samples 20 \
            --max-workers 8

      - name: Route valuation models
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.valuation_model_routing \
            --report-root reports/valuation_research_queue \
            --profile-config config/valuation_company_profiles.yaml

      - name: Execute specialized valuation models
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.specialized_valuation_execution \
            --report-root reports/valuation_research_queue \
            --cache-dir data/cache/valuation_research_fundamentals \
            --years 7 \
            --minimum-annual-roe-samples 3 \
            --maximum-annual-roe-samples 5

      - name: Execute insurance reverse appraisal research
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.insurance_valuation_execution \
            --report-root reports/valuation_research_queue \
            --input-config config/insurance_embedded_value_inputs.yaml \
            --cache-dir data/cache/valuation_research_fundamentals \
            --years 3

      - name: Build long-term Formal BUY review
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.long_term_formal_buy \
            --report-root upstream/reports/all_a_full_scan \
            --long-term-dir reports/long_term_second_pass \
            --valuation-root reports/valuation_research_queue \
            --output-dir reports/long_term_formal_buy

      - name: Audit legacy zero Formal BUY
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.zero_buy_audit \
            --report-root upstream/reports/all_a_full_scan \
            --output-dir reports/zero_buy_audit

      - name: Build Master Opportunity Ranking
        run: |
          PYTHONUNBUFFERED=1 python -m src.strategies.genge_opportunity_discovery.master_opportunity_ranking \
            --industry-coverage reports/industry_coverage \
            --valuation-root reports/valuation_research_queue \
            --long-term-formal-buy reports/long_term_formal_buy \
            --output-dir reports/master_opportunity_ranking

      - name: Validate final postscan production contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          valuation_root = Path('reports/valuation_research_queue')
          runs = sorted(p for p in valuation_root.iterdir() if p.is_dir()) if valuation_root.exists() else []
          assert runs, 'no valuation research report generated'
          latest = runs[-1]
          required = {
              'valuation_research_queue.csv', 'valuation_research_queue.md',
              'valuation_research_summary.json', 'valuation_research_routed.csv',
              'valuation_research_routed.md', 'valuation_routing_summary.json',
              'valuation_research_specialized.csv', 'valuation_research_specialized.md',
              'specialized_valuation_summary.json',
              'insurance_valuation_execution.csv', 'insurance_valuation_execution.md',
              'insurance_valuation_execution_summary.json',
          }
          assert not sorted(name for name in required if not (latest/name).exists()), 'missing valuation outputs'
          valuation_rows = list(csv.DictReader((latest/'valuation_research_queue.csv').open(encoding='utf-8')))
          routed_rows = list(csv.DictReader((latest/'valuation_research_routed.csv').open(encoding='utf-8')))
          specialized_rows = list(csv.DictReader((latest/'valuation_research_specialized.csv').open(encoding='utf-8')))
          hard_rows = list(csv.DictReader(Path('reports/hard_logic_research/hard_logic_research.csv').open(encoding='utf-8')))
          valuation_codes = {r['code'] for r in valuation_rows}
          hard_pass_codes = {
              r['selected_code'] for r in hard_rows
              if r.get('research_state') == 'PASS' and r.get('hard_logic_state') == 'PASS' and r.get('selected_code')
          }
          assert not sorted(hard_pass_codes - valuation_codes), 'hard-logic PASS names dropped before valuation'
          routing = json.loads((latest/'valuation_routing_summary.json').read_text(encoding='utf-8'))
          assert len(routed_rows) == len(valuation_rows) == routing['routed_count']
          assert routing['formal_signal_eligible'] is False
          assert routing['automatic_promotion_allowed'] is False
          assert routing['no_auto_trade'] is True
          specialized = json.loads((latest/'specialized_valuation_summary.json').read_text(encoding='utf-8'))
          assert len(specialized_rows) == len(routed_rows) == specialized['row_count']
          assert specialized['ranking_changed'] is False
          assert specialized['formal_signal_eligible'] is False
          assert specialized['automatic_promotion_allowed'] is False
          assert specialized['no_auto_trade'] is True
          sector_summary = json.loads(Path('reports/sector_opportunity/sector_opportunity_summary.json').read_text(encoding='utf-8'))
          hard_summary = json.loads(Path('reports/hard_logic_research/hard_logic_research_summary.json').read_text(encoding='utf-8'))
          assert sector_summary['industry_first_discovery'] is True
          assert hard_summary['sector_opportunity_used'] is True
          assert hard_summary['sector_strength_is_hard_logic'] is False
          assert hard_summary['sector_strength_can_create_buy'] is False
          master_summary = json.loads(Path('reports/master_opportunity_ranking/master_opportunity_summary.json').read_text(encoding='utf-8'))
          assert master_summary['ranking_semantics'] == 'research_priority_not_trade_score'
          assert master_summary['no_auto_trade'] is True
          print(json.dumps({
              'sector_opportunity': sector_summary,
              'hard_logic_industry_research': hard_summary,
              'routing': routing,
              'specialized_valuation': specialized,
              'master_opportunity_ranking': master_summary,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish postscan summary
        if: always()
        run: |
          for f in \
            reports/sector_opportunity/sector_opportunity.md \
            reports/industry_coverage/industry_top_candidates.md \
            reports/long_term_second_pass/long_term_second_pass.md \
            reports/long_term_formal_buy/long_term_formal_buy.md \
            reports/zero_buy_audit/zero_buy_audit.md \
            reports/master_opportunity_ranking/master_opportunity_ranking.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              hard_summary = Path('reports/hard_logic_research/hard_logic_research_summary.json')
              if hard_summary.exists():
                  payload = json.loads(hard_summary.read_text(encoding='utf-8'))
                  f.write('## Sector-first Hard Logic Industry Research\n\n')
                  f.write(f"- industries: {payload.get('industry_count', 0)}\n")
                  f.write(f"- HARD_LOGIC_PASS: {payload.get('hard_logic_pass_count', 0)}\n")
                  f.write(f"- NO_PASS: {payload.get('no_pass_count', 0)}\n")
                  f.write(f"- REVIEW: {payload.get('review_count', 0)}\n")
                  f.write(f"- sector opportunity used: {payload.get('sector_opportunity_used', False)}\n\n")
          root = Path('reports/valuation_research_queue')
          runs = sorted(p for p in root.iterdir() if p.is_dir()) if root.exists() else []
          if runs:
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
                  for name in ('valuation_research_routed.md', 'valuation_research_specialized.md', 'insurance_valuation_execution.md'):
                      path = runs[-1]/name
                      if path.exists():
                          f.write(path.read_text(encoding='utf-8'))
                          f.write('\n')
          PY

      - name: Save valuation fundamental cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-postscan-valuation-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload unified postscan research
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-postscan-research
          path: |
            reports/sector_opportunity
            reports/industry_coverage
            reports/hard_logic_research
            reports/long_term_second_pass
            reports/industry_valuation_source
            reports/final_valuation_source
            reports/hard_logic_valuation_source
            reports/valuation_research_queue
