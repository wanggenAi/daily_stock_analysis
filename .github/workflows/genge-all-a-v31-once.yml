name: GenGe All-A V3.1 One Shot

on:
  push:
    branches: [main]
    paths: [".github/workflows/genge-all-a-v31-once.yml"]
  workflow_dispatch:

permissions:
  contents: read

timeout-minutes: 300

jobs:
  all-a-v31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install --prefer-binary --retries 5 --timeout 60 -r .github/requirements-ci.txt
      - name: Focused safety tests
        run: |
          python -m pytest -q \
            tests/test_genge_opportunity_discovery_*.py \
            tests/test_genge_all_a_full_scan.py \
            tests/test_genge_valuation_model_routing.py \
            tests/test_genge_resource_asset_valuation.py \
            tests/test_genge_resource_routing_v31.py
      - name: Restore all-A state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
            stock_pools/all_a_universe_*.csv
          key: genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-all-a-state-${{ runner.os }}-${{ github.ref_name }}-
            genge-all-a-state-${{ runner.os }}-main-
      - name: Prepare state
        run: |
          mkdir -p data/cache/all_a_full_scan data/cache/genge_fundamentals data/cache/opportunity_evidence data/opportunity_snapshots/all_a_state
          if [ ! -s data/opportunity_snapshots/exit_profile.csv ]; then cp data/opportunity_snapshots/exit_profile_seed.csv data/opportunity_snapshots/exit_profile.csv; fi
      - name: Run fresh All-A production scan
        run: |
          PYTHONUNBUFFERED=1 timeout --signal=TERM 110m \
          python -m src.strategies.genge_opportunity_discovery.all_a_progress_runner \
            --max-workers 12 \
            --evidence-queue-size 80 \
            --deep-review-size 30 \
            --max-watchlist 15 \
            --fundamental-limit 30 \
            --industry-evidence-file data/user_supplied/industry_cycle_evidence.csv \
            --company-evidence-file data/user_supplied/company_cycle_evidence.csv \
            --industry-evidence-schema config/industry_evidence_schema.yaml \
            --industry-alias-map config/industry_alias_map.yaml \
            --exit-profile-file data/opportunity_snapshots/exit_profile.csv
      - name: Validate All-A population
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('reports/all_a_full_scan'); runs=sorted(p for p in root.iterdir() if p.is_dir() and (p/'run_summary.json').exists()); assert runs
          s=json.loads((runs[-1]/'run_summary.json').read_text(encoding='utf-8'))
          assert s['official_universe_count'] > 5000
          assert s['effective_scan_count'] > 1000
          assert s['fatal_data_failure_count'] == 0
          assert s['no_auto_trade'] is True
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Every-industry Top 5
        run: |
          python -m src.strategies.genge_opportunity_discovery.industry_coverage --report-root reports/all_a_full_scan --output-dir reports/industry_coverage --per-industry 5
      - name: Long-term second pass
        run: |
          python -m src.strategies.genge_opportunity_discovery.long_term_second_pass --report-root reports/all_a_full_scan --output-dir reports/long_term_second_pass
      - name: Every-industry valuation source
        run: |
          python -m src.strategies.genge_opportunity_discovery.industry_valuation_bridge \
            --all-a-report reports/all_a_full_scan --industry-coverage reports/industry_coverage \
            --output-dir reports/industry_valuation_source --global-limit 800 --relaxed-reserve 500 --per-industry 5
      - name: Merge long-term source
        run: |
          python -m src.strategies.genge_opportunity_discovery.long_term_valuation_merge \
            --valuation-source-dir reports/industry_valuation_source --long-term-dir reports/long_term_second_pass --output-dir reports/final_valuation_source
      - name: Restore valuation cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/valuation_research_fundamentals
          key: genge-v31-valuation-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            genge-v31-valuation-${{ runner.os }}-${{ github.ref_name }}-
            genge-postscan-valuation-${{ runner.os }}-${{ github.ref_name }}-
      - name: Build valuation queue
        run: |
          python -m src.strategies.genge_opportunity_discovery.valuation_research_long_term_runner \
            --report-dir reports/final_valuation_source --output-dir reports/valuation_research_queue \
            --fundamental-cache-dir data/cache/valuation_research_fundamentals \
            --research-limit 800 --relaxed-reserve 500 --financial-review-limit 300 --years 7 --minimum-pe-samples 20 --max-workers 10
      - name: Route valuation models
        run: |
          python -m src.strategies.genge_opportunity_discovery.valuation_model_routing --report-root reports/valuation_research_queue --profile-config config/valuation_company_profiles.yaml
      - name: Execute specialized models
        run: |
          python -m src.strategies.genge_opportunity_discovery.specialized_valuation_execution --report-root reports/valuation_research_queue --cache-dir data/cache/valuation_research_fundamentals --years 7 --minimum-annual-roe-samples 3 --maximum-annual-roe-samples 5
      - name: Execute insurance appraisal
        run: |
          python -m src.strategies.genge_opportunity_discovery.insurance_valuation_execution --report-root reports/valuation_research_queue --input-config config/insurance_embedded_value_inputs.yaml --cache-dir data/cache/valuation_research_fundamentals --years 3
      - name: Execute four-scenario resource NAV
        run: |
          python -m src.strategies.genge_opportunity_discovery.resource_valuation_execution --report-root reports/valuation_research_queue --input-config config/resource_asset_inputs.yaml
      - name: Build frozen V3.1 queue
        run: |
          python -m src.strategies.genge_opportunity_discovery.v31_review_queue --valuation-root reports/valuation_research_queue --all-a-report-root reports/all_a_full_scan --output-dir reports/v31_review --limit 500
      - name: Map resource scenarios into V3.1
        run: |
          python -m src.strategies.genge_opportunity_discovery.v31_resource_scenario_merge --v31-dir reports/v31_review --resource-root reports/valuation_research_queue --output-dir reports/v31_review_enriched
      - name: Validate every industry represented
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          coverage=list(csv.DictReader(Path('reports/industry_coverage/industry_top_candidates.csv').open(encoding='utf-8')))
          source=list(csv.DictReader(Path('reports/final_valuation_source/all_a_quant_screen.csv').open(encoding='utf-8')))
          clean={r['industry'] for r in coverage if r.get('industry_candidate_state')=='RESEARCH_CANDIDATE'}
          represented={r.get('industry','') for r in source if r.get('industry','')}
          missing=sorted(clean-represented); assert not missing, f'missing industries: {missing}'
          v31=list(csv.DictReader(Path('reports/v31_review_enriched/v31_review_queue_enriched.csv').open(encoding='utf-8'))); assert v31
          print(json.dumps({'clean_industries':len(clean),'represented':len(represented),'v31_candidates':len(v31)},ensure_ascii=False,indent=2))
          PY
      - name: Save caches
        uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            data/cache/all_a_full_scan
            data/cache/genge_fundamentals
            data/cache/opportunity_evidence
            data/cache/valuation_research_fundamentals
            data/opportunity_snapshots/all_a_state
            data/opportunity_snapshots/all_a_forward_observation_ledger.csv
            data/opportunity_snapshots/exit_profile.csv
          key: genge-all-a-v31-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload full research artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genge-all-a-v31-one-shot
          path: |
            reports/all_a_full_scan
            reports/industry_coverage
            reports/long_term_second_pass
            reports/industry_valuation_source
            reports/final_valuation_source
            reports/valuation_research_queue
            reports/v31_review
            reports/v31_review_enriched
          if-no-files-found: error
